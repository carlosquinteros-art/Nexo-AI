<!doctype html>
<html lang="es" data-space="todo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D5C63" />
    <meta name="description" content="Nexo — trabajo, universidad y vida personal en un solo lugar." />
    <link rel="icon" type="image/svg+xml" href="/icono.svg" />
    <link rel="apple-touch-icon" href="/icono.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Nexo</title>
    <script>
      /* Tema y espacio antes del primer pintado, para evitar parpadeos. */
      try {
        var u = JSON.parse(localStorage.getItem('nexo.ui.v1') || '{}');
        document.documentElement.dataset.space = u.space || 'todo';
        if (u.tema === 'oscuro') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[var(--page)] text-ink-800 dark:text-ink-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
