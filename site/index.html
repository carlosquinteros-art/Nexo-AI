/* ==========================================================================
   22. ENRUTADOR Y RENDER
   ========================================================================== */
function parseHash() {
  const h = (location.hash || '#/inicio').replace(/^#\/?/, '');
  const [ruta, param] = h.split('/');
  const r = TITULOS[ruta] ? ruta : 'inicio';
  if (UI.route !== r || UI.param !== (param || null)) { UI.tab = null; UI.fichaActual = null; UI.fichaRevelada = false; }
  UI.route = r; UI.param = param || null;
}

function render() {
  /* El acento del tema sigue al espacio activo: misma app, tres identidades */
  document.documentElement.dataset.space = UI.space || 'todo';
  document.documentElement.classList.toggle('dark', UI.tema === 'oscuro');

  const vista = Vistas[UI.route] || Vistas.inicio;
  let html = '';
  if (UI.cargando) {
    html = '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">' +
      card(skeleton(3)) + card(skeleton(3)) + card(skeleton(4)) + card(skeleton(2)) + '</div>';
  } else {
    try { html = vista(); }
    catch (e) {
      console.error(e);
      html = card(errorBox('No pudimos dibujar esta vista',
        'Ocurrió un error inesperado: ' + e.message + '. Tus datos están a salvo.',
        btnSec('Volver a Inicio', 'ir-inicio') + btn('Recargar', 'recargar')));
    }
  }
  document.getElementById('app').innerHTML = shell(html);
  saveUI();
  // Recalcular herramientas visibles
  if (UI.route === 'herramientas') Object.keys(ToolCalc).forEach(k => { if (typeof ToolCalc[k] === 'function' && !['val','set'].includes(k)) { try { ToolCalc[k](); } catch (e) {} } });
  // Restaurar foco en buscadores
  if (UI.focusSel) {
    const el = document.querySelector('[data-act="' + UI.focusSel + '"]' + (UI.focusKey ? '[data-k="' + UI.focusKey + '"]' : ''));
    if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} }
    UI.focusSel = null; UI.focusKey = null;
  }
}

/* ==========================================================================
   23. EVENTOS
   ========================================================================== */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  const noNav = ['espacio','tab','tvista','avista','filtro'];
  if (el.tagName !== 'A' && el.tagName !== 'INPUT' && el.tagName !== 'SELECT') ev.preventDefault();

  switch (a) {
    /* --- navegación y shell --- */
    case 'espacio': UI.space = v; render(); break;
    case 'tab': UI.tab = v; UI.fichaRevelada = false; render(); break;
    case 'tvista': UI.tareaVista = v; render(); break;
    case 'avista': UI.agendaVista = v; render(); break;
    case 'semana': UI.semanaOffset = (UI.semanaOffset || 0) + Number(v); render(); break;
    case 'mes': {
      const base = UI.mes || todayISO().slice(0, 7);
      const d = new Date(Date.UTC(+base.slice(0, 4), +base.slice(5, 7) - 1 + Number(v), 1));
      UI.mes = d.toISOString().slice(0, 7); render(); break;
    }
    case 'tema': UI.tema = UI.tema === 'oscuro' ? 'claro' : 'oscuro'; DB.profile.tema = UI.tema; saveDB();
      Nube.guardarPerfil().catch(() => {}); render(); break;
    case 'tema-set': UI.tema = v; DB.profile.tema = v; saveDB(); render(); break;
    case 'menu-mas': menuMas(); break;
    case 'ir-inicio': location.hash = '#/inicio'; break;
    case 'recargar': location.reload(); break;
    case 'ir-trabajo': location.hash = '#/trabajo'; break;
    case 'ir-universidad': location.hash = '#/universidad'; break;
    case 'ir-fichas': cerrarModal(); location.hash = '#/estudio'; UI.route = 'estudio'; UI.tab = 'fichas'; render(); break;
    case 'ir-pomodoro': cerrarModal(); location.hash = '#/estudio'; UI.route = 'estudio'; UI.tab = 'pomodoro'; render(); break;
    case 'ir-estudio': cerrarModal(); location.hash = '#/estudio'; UI.route = 'estudio'; UI.tab = 'plan'; render(); break;
    case 'ir-apuntes': cerrarModal(); UI.space = 'universidad'; location.hash = '#/notas'; UI.route = 'notas'; render(); break;
    case 'ir-config': cerrarModal(); location.hash = '#/config'; UI.route = 'config'; render(); break;
    case 'ir-glosario': cerrarModal(); location.hash = '#/universidad'; UI.route = 'universidad'; UI.tab = 'glosario'; render(); break;
    case 'captura': cerrarModal(); menuRapido(); break;
    case 'rapido': ejecutarRapido(el.dataset.k); break;
    case 'nueva-evaluacion-libre': {
      const s = store.all('subjects')[0];
      if (!s) { toast('Primero crea una asignatura', 'warn'); formAsignatura(null); break; }
      formEvaluacion(null, s.id); break;
    }
    case 'nueva-lectura-libre': formLectura(null, (store.all('subjects')[0] || {}).id || ''); break;

    /* --- buscador global --- */
    case 'buscar-global': cerrarModal(); abrirBuscador(); break;
    case 'bg-sug': { const i = document.getElementById('bg-input'); if (i) { i.value = el.dataset.txt; i.focus(); }
      const r = document.getElementById('bg-res'); if (r) r.innerHTML = pintarResultados(el.dataset.txt); break; }
    case 'bg-ir': {
      const ruta = el.dataset.ruta, accion = el.dataset.accion;
      cerrarModal();
      if (ruta) { location.hash = ruta; parseHash(); render(); }
      else if (accion) {
        const [a2, id2] = accion.split('|');
        if (a2 === 'ver-tarea') verTarea(id2);
        else if (a2 === 'ver-evento') verEvento(id2);
        else if (a2 === 'ver-nota') verNota(id2);
        else if (a2 === 'ver-caso') verCaso(id2);
      }
      break;
    }
    case 'copiar': navigator.clipboard.writeText(el.dataset.txt || '').then(() => toast('Copiado')).catch(() => toast('No se pudo copiar', 'error')); break;

    /* --- modales --- */
    case 'modal-cerrar': cerrarModal(); break;
    case 'modal-ok': if (modalOnSave) modalOnSave(); break;

    /* --- asistente --- */
    case 'ej': cerrarModal(); if (UI.route !== 'asistente') { location.hash = '#/asistente'; UI.route = 'asistente'; }
      enviarChat(el.dataset.txt); break;
    case 'chat-rapida': enviarChat(el.dataset.txt); break;
    case 'chat-enviar': { const i = document.getElementById('chat-input'); if (i) { const t2 = i.value; i.value = ''; enviarChat(t2); } break; }
    case 'chat-limpiar': UI.chat = []; UI.propuesta = null; UI.propEditando = false; render(); break;
    case 'chat-borrar-historial':
      confirmar('Se borrará el historial de frases recientes. No afecta a los registros guardados.', () => {
        UI.historial = []; try { localStorage.removeItem(LS_CHAT); } catch (e2) {} toast('Historial borrado'); render();
      }, { ok: 'Borrar historial' });
      break;
    case 'prop-ok': confirmarPropuesta(); break;
    case 'prop-editar': UI.propEditando = !UI.propEditando; render(); break;
    case 'prop-no':
      UI.chat.push({ rol: 'nexo', tipo: 'resultado', estado: 'no', txt: 'Descartado, no se guardó nada' });
      UI.propuesta = null; UI.propEditando = false; render(); break;
    case 'prop-plantilla': {
      const ult = (UI.chat || []).slice().reverse().find(m => m.respuesta && m.respuesta.plantilla);
      if (!ult) break;
      const guardada = AsistenteAcciones.guardarPlantilla(ult.respuesta.plantilla);
      toast('Plantilla guardada en Notas', 'exito');
      UI.chat.push({ rol: 'nexo', tipo: 'resultado', estado: 'ok', txt: 'Plantilla guardada', ruta: '#/notas' });
      render(); break;
    }

    /* --- captura rápida --- */
    case 'cap-ej': { const t = document.getElementById('cap-txt'); if (t) t.value = el.dataset.txt; break; }

    /* --- tareas --- */
    case 'toggle-tarea': cerrarModal(); Acciones.completarTarea(id); break;
    case 'ver-tarea': verTarea(id); break;
    case 'nueva-tarea': formTarea(null); break;
    case 'nueva-tarea-marca': formTarea(null, { brand_id: id, area: 'trabajo' }); break;
    case 'editar-tarea': cerrarModal(); formTarea(store.get('tasks', id)); break;
    case 'nueva-subtarea': { const t = store.get('tasks', id); cerrarModal();
      formTarea(null, { parent_id: id, area: t.area, brand_id: t.brand_id || '', subject_id: t.subject_id || '' }); break; }
    case 'duplicar-tarea': cerrarModal(); Acciones.duplicarTarea(id); break;
    case 'borrar-tarea': cerrarModal(); Acciones.eliminar('tasks', id, 'la tarea'); break;
    case 'mover-tarea': store.update('tasks', id, { estado: el.dataset.e, completed_at: el.dataset.e === 'completada' ? nowNaive() : null }); render(); break;
    case 'filtro-limpiar': UI.filtros = { estado: '', prioridad: '', brand: '', subject: '', fecha: '', q: '' }; render(); break;

    /* --- eventos --- */
    case 'ver-evento': verEvento(id); break;
    case 'nuevo-evento': formEvento(null); break;
    case 'nuevo-evento-marca': formEvento(null, { brand_id: id, area: 'trabajo', tipo: 'reunion' }); break;
    case 'editar-evento': cerrarModal(); formEvento(store.get('events', id)); break;
    case 'borrar-evento': cerrarModal(); Acciones.eliminar('events', id, 'el evento'); break;
    case 'acuerdo-evento': { const e2 = store.get('events', id); cerrarModal();
      formAcuerdo(null, { brand_id: e2.brand_id || '', event_id: id, fecha: String(e2.inicio).slice(0, 10) }); break; }

    /* --- bloques de tiempo --- */
    case 'nuevo-bloque': formBloque(); break;
    case 'toggle-bloque': { const b = store.get('time_blocks', id); store.update('time_blocks', id, { cumplido: !b.cumplido }); render(); break; }
    case 'borrar-bloque': store.remove('time_blocks', id); render(); break;

    /* --- trabajo --- */
    case 'nueva-marca': formMarca(null); break;
    case 'editar-marca': formMarca(store.get('brands', id)); break;
    case 'nueva-tienda': formTienda(null, id); break;
    case 'editar-tienda': formTienda(store.get('stores', id)); break;
    case 'nueva-persona': formPersona(null, id); break;
    case 'editar-persona': formPersona(store.get('people', id)); break;
    case 'nueva-novedad': formNovedad(id); break;
    case 'nueva-solicitud': formSolicitud(null, id); break;
    case 'editar-solicitud': formSolicitud(store.get('requests', id)); break;
    case 'nuevo-acuerdo': formAcuerdo(null, { brand_id: id }); break;
    case 'editar-acuerdo': formAcuerdo(store.get('agreements', id)); break;
    case 'nueva-nota-marca': formNota(null, { brand_id: id, area: 'trabajo' }); break;

    /* --- universidad --- */
    case 'nueva-asignatura': formAsignatura(null); break;
    case 'editar-asignatura': formAsignatura(store.get('subjects', id)); break;
    case 'nueva-unidad': formUnidad(null, id); break;
    case 'borrar-unidad': Acciones.eliminar('units', id, 'la unidad'); break;
    case 'nueva-evaluacion': formEvaluacion(null, id); break;
    case 'editar-evaluacion': formEvaluacion(store.get('evaluations', id)); break;
    case 'plan-desde-eval': formPlan(id); break;
    case 'nueva-lectura': formLectura(null, id); break;
    case 'editar-lectura': formLectura(store.get('readings', id)); break;
    case 'leer': { const r = store.get('readings', id);
      const n = el.dataset.n === 'all' ? r.paginas_total : Math.min(r.paginas_total, (r.paginas_leidas || 0) + Number(el.dataset.n));
      store.update('readings', id, { paginas_leidas: n }); render(); break; }
    case 'nuevo-concepto': formConcepto(null); break;
    case 'editar-concepto': formConcepto(store.get('glossary', id)); break;
    /* --- legislación, jurisprudencia, apuntes y casos --- */
    case 'nueva-legislacion': formLegislacion(null, id || ''); break;
    case 'editar-legislacion': formLegislacion(store.get('legal_sources', id)); break;
    case 'nueva-jurisprudencia': formJurisprudencia(null, id || ''); break;
    case 'editar-jurisprudencia': formJurisprudencia(store.get('legal_sources', id)); break;
    case 'toggle-verificada': {
      const f = store.get('legal_sources', id);
      if (!f) break;
      if (!f.verificado && !f.enlace) { toast('Primero registra el enlace a la fuente oficial', 'warn'); break; }
      confirmar(f.verificado
        ? 'La ficha volverá a quedar como no verificada.'
        : '¿Confirmas que abriste la fuente oficial y contrastaste los datos? Nexo no puede verificarlo por ti.',
        () => { store.update('legal_sources', id, { verificado: !f.verificado, consultada_el: f.verificado ? f.consultada_el : todayISO() });
          toast(f.verificado ? 'Marcada como no verificada' : 'Marcada como verificada', 'exito'); render(); },
        { tono: 'info', ok: f.verificado ? 'Quitar verificación' : 'Sí, la verifiqué' });
      break;
    }
    case 'borrar-fuente': Acciones.eliminar('legal_sources', id, 'la ficha'); break;
    case 'caso-desde-fallo': {
      const f = store.get('legal_sources', id); if (!f) break;
      formCaso(null, f.subject_id || '');
      break;
    }
    case 'nuevo-apunte': formApunte(null, id || ''); break;
    case 'editar-apunte': formApunte(store.get('legal_notes', id)); break;
    case 'derivar-apunte': derivarApunte(id); break;
    case 'fichas-desde-apunte': fichasDesdeApunte(id); break;
    case 'borrar-apunte': Acciones.eliminar('legal_notes', id, 'el apunte'); break;
    case 'lectura-citas': verCitasLectura(id); break;
    case 'nueva-cita': formCita(id); break;
    case 'borrar-cita': { const c = store.get('reading_notes', id); store.remove('reading_notes', id);

      const r2 = store.get('readings', id); if (!r2) break;

        fields: [{ k: 'pagina', label: 'Voy en la página', type: 'number', min: 0, max: r2.paginas_total, req: true, col: 2 }],
        values: { pagina: r2.paginas_leidas },
        onSave(d) { store.update('readings', id, { paginas_leidas: Math.min(Number(d.pagina) || 0, r2.paginas_total) });
          toast('Avance actualizado', 'exito'); render(); } });
      break;
    }
    case 'poner-nota': {
      const e2 = store.get('evaluations', id); if (!e2) break;
      const es = Academico.escala();
      openForm({ title: 'Registrar nota · ' + e2.titulo, ancho: 'max-w-sm',
        sub: es.nombre,
        fields: [{ k: 'nota', label: 'Nota obtenida', type: 'number', step: '0.1', min: es.min, max: es.max, req: true, col: 2 }],
        values: { nota: '' },
        onSave(d) {
          store.update('evaluations', id, { nota: Number(d.nota), estado: 'calificada' });
          const pr3 = Academico.promedio(e2.subject_id), nn3 = Academico.notaNecesaria(e2.subject_id);
          toast('Nota registrada · promedio ' + Academico.fmtNota(pr3.promedio) +
            (nn3 != null ? ' · necesitas ' + Academico.fmtNota(nn3) : ''), 'exito');
          render();
        } });
      break;
    }
    case 'cambiar-preparacion': {
      const e3 = store.get('evaluations', id); if (!e3) break;
      openForm({ title: 'Nivel de preparación', ancho: 'max-w-sm',
        fields: [{ k: 'preparacion', label: '¿Cómo vas?', type: 'select', col: 2,
          opts: Object.keys(PREPARACION).map(k => ({ v: k, l: PREPARACION[k].label })) }],
        values: { preparacion: e3.preparacion || 'no_iniciada' },
        onSave(d) { store.update('evaluations', id, d); toast('Preparación actualizada', 'exito'); render(); } });
      break;
    }
    case 'nuevo-caso': formCaso(null); break;
    case 'ver-caso': verCaso(id); break;
    case 'editar-caso': cerrarModal(); formCaso(store.get('cases', id)); break;
    case 'borrar-caso': cerrarModal(); Acciones.eliminar('cases', id, 'el caso'); break;
    case 'nueva-nota-asig': formNota(null, { subject_id: id, area: 'universidad', tipo: 'apunte' }); break;

    /* --- estudio --- */
    case 'nueva-sesion': formSesion(null); break;
    case 'editar-sesion': formSesion(store.get('study_sessions', id)); break;
    case 'ver-sesion': formSesion(store.get('study_sessions', id)); break;
    case 'toggle-sesion': Acciones.completarSesion(id); break;
    case 'reprogramar': Acciones.reprogramarAtrasadas(); break;
    case 'nuevo-plan': formPlan(null); break;
    case 'ver-plan': { const ss = store.where('study_sessions', s => s.plan_id === id).sort(by('fecha'));
      abrirModal((store.get('study_plans', id) || {}).nombre || 'Plan',
        ss.length ? '<div class="divide-y divide-ink-200/70 dark:divide-ink-800">' + ss.map(filaSesion).join('') + '</div>' : vacio('Sin sesiones', ''), ''); break; }
    case 'borrar-plan': confirmar('¿Eliminar el plan y todas sus sesiones?', () => {
      store.where('study_sessions', s => s.plan_id === id).forEach(s => store.remove('study_sessions', s.id));
      store.remove('study_plans', id); toast('Plan eliminado'); render(); }); break;

    /* --- pomodoro --- */
    case 'pomo-iniciar': {
      if (!UI.pomodoro) UI.pomodoro = { duracion: UI.pomoDur || 25, restante: (UI.pomoDur || 25) * 60, fase: 'foco', corriendo: true, sesionId: UI.pomoSesion || '', acumulado: 0 };
      else UI.pomodoro.corriendo = true;
      if (pomoTimer) clearInterval(pomoTimer);
      pomoTimer = setInterval(pomoTick, 1000); render(); break; }
    case 'pomo-pausa': if (UI.pomodoro) UI.pomodoro.corriendo = false; if (pomoTimer) { clearInterval(pomoTimer); pomoTimer = null; } render(); break;
    case 'pomo-reset': if (pomoTimer) { clearInterval(pomoTimer); pomoTimer = null; } UI.pomodoro = null; render(); break;
    case 'pomo-dur': UI.pomoDur = Number(v); if (UI.pomodoro && !UI.pomodoro.corriendo) { UI.pomodoro.duracion = Number(v); UI.pomodoro.restante = Number(v) * 60; } render(); break;
    case 'pomo-fin': {
      const p = UI.pomodoro; if (!p) break;
      const usados = p.fase === 'foco' ? Math.round((p.duracion * 60 - p.restante) / 60) : 0;
      if (p.sesionId && usados > 0) {
        const s = store.get('study_sessions', p.sesionId);
        if (s) store.update('study_sessions', p.sesionId, { minutos_efectivos: (s.minutos_efectivos || 0) + usados, estado: 'completada' });
      }
      if (pomoTimer) { clearInterval(pomoTimer); pomoTimer = null; }
      UI.pomodoro = null; toast(usados + ' minutos registrados'); render(); break; }

    /* --- Universidad: navegación --- */
    case 'ir-lecturas': cerrarModal(); location.hash = '#/universidad'; UI.route = 'universidad'; UI.tab = 'resumen'; render(); break;
    case 'ir-apuntes-juridicos': cerrarModal(); location.hash = '#/universidad'; UI.route = 'universidad'; UI.tab = 'apuntes'; render(); break;
    case 'ir-legislacion': cerrarModal(); location.hash = '#/universidad'; UI.route = 'universidad'; UI.tab = 'legislacion'; render(); break;
    case 'ir-jurisprudencia': cerrarModal(); location.hash = '#/universidad'; UI.route = 'universidad'; UI.tab = 'jurisprudencia'; render(); break;
    case 'ir-casos': cerrarModal(); location.hash = '#/universidad'; UI.route = 'universidad'; UI.tab = 'casos'; render(); break;
    case 'ir-modo-estudio': cerrarModal(); location.hash = '#/estudio'; UI.route = 'estudio'; UI.tab = 'sesion'; render(); break;
    case 'ir-repaso': cerrarModal(); location.hash = '#/estudio'; UI.route = 'estudio'; UI.tab = 'repaso'; render(); break;

    /* --- Modo de estudio --- */
    case 'ms-iniciar': {
      const sel = (x) => (document.getElementById(x) || {}).value || '';
      const foco = clamp(Number(sel('ms-foco')) || 25, 5, 120);
      const descanso = clamp(Number(sel('ms-descanso')) || 5, 1, 60);
      DB.profile.pomodoro = Object.assign({}, DB.profile.pomodoro, { foco, descanso });
      let sesionId = sel('ms-sesion');
      const objetivo = sel('ms-objetivo');
      const material = sel('ms-material');
      const asig = sel('ms-asig');
      UI.zen = !!(document.getElementById('ms-zen') || {}).checked;

      /* Sin sesión elegida se crea una libre para poder registrar el tiempo. */
      if (!sesionId) {
        const nueva = store.insert('study_sessions', {
          plan_id: null, subject_id: asig || null, unit_id: null,
          titulo: objetivo ? objetivo.slice(0, 80) : 'Sesión de estudio',
          fecha: todayISO(), hora: relojCL(), duracion_min: foco, tipo: 'estudio', estado: 'pendiente',
          minutos_efectivos: 0, notas: '', objetivo, material: material ? [{ titulo: material }] : [],
          pausas: 0, concentracion: null, resultado: 'pendiente', proximo_paso: '',
          iniciada: nowNaive(), terminada: null, pagina_lectura: null
        });
        sesionId = nueva.id;
      } else {
        store.update('study_sessions', sesionId, {
          objetivo: objetivo || (store.get('study_sessions', sesionId) || {}).objetivo || '',
          material: material ? [{ titulo: material }] : (store.get('study_sessions', sesionId) || {}).material || [],
          iniciada: nowNaive()
        });
      }
      UI.pomodoro = { sesionId, duracion: foco, descanso, restante: foco * 60, fase: 'foco',
        corriendo: true, acumulado: 0, pausas: 0, bloques: 1, objetivo };
      if (pomoTimer) clearInterval(pomoTimer);
      pomoTimer = setInterval(pomoTick, 1000);
      saveDB(); render(); break;
    }
    case 'ms-pausa': if (UI.pomodoro) UI.pomodoro.corriendo = false;
      if (pomoTimer) { clearInterval(pomoTimer); pomoTimer = null; } render(); break;
    case 'ms-reanudar': if (UI.pomodoro) UI.pomodoro.corriendo = true;
      if (pomoTimer) clearInterval(pomoTimer); pomoTimer = setInterval(pomoTick, 1000); render(); break;
    case 'ms-pausa-registrar': if (UI.pomodoro) { UI.pomodoro.pausas = (UI.pomodoro.pausas || 0) + 1;
      toast('Pausa registrada'); render(); } break;
    case 'ms-saltar': if (UI.pomodoro) { UI.pomodoro.restante = 1; } break;
    case 'ms-zen': UI.zen = true; render(); break;

    case 'repaso-tipo': UI.repasoFiltro = Object.assign({}, UI.repasoFiltro, { tipo: v || null });

    case 'repaso-debiles-toggle': UI.repasoFiltro = Object.assign({}, UI.repasoFiltro, { debiles: !(UI.repasoFiltro || {}).debiles });
      UI.repasoActual = null; UI.repasoRevelada = false; render(); break;

    case 'repaso-opcion': UI.repasoElegida = Number(el.dataset.i); UI.repasoRevelada = true; render(); break;
    case 'repaso-saltar': avanzarRepaso(); break;
    case 'repaso-bien':
    case 'repaso-mal': {
      const ficha = store.get('flashcards', id); if (!ficha) break;
      const acerto = a === 'repaso-bien';
      const segundos = UI.repasoDesde ? (Date.now() - UI.repasoDesde) / 1000 : 0;
      const dias = Academico.responder(ficha, acerto ? 'correcto' : 'incorrecto', segundos);
      UI.repasoSesion = UI.repasoSesion || { correctas: 0, incorrectas: 0 };
      UI.repasoSesion[acerto ? 'correctas' : 'incorrectas']++;
      toast(acerto ? 'Vuelve en ' + dias + ' día(s)' : 'La verás mañana de nuevo', acerto ? 'exito' : 'ok');
      avanzarRepaso(); break;
    }
    case 'repasar-debiles': cerrarModal(); location.hash = '#/estudio'; UI.route = 'estudio'; UI.tab = 'repaso';
      UI.repasoFiltro = { debiles: true }; UI.repasoActual = null; UI.repasoRevelada = false; render(); break;
    case 'repasar-debiles-asig': location.hash = '#/estudio'; UI.route = 'estudio'; UI.tab = 'repaso';
      UI.repasoFiltro = { debiles: true, subject_id: id }; UI.repasoActual = null; UI.repasoRevelada = false; render(); break;
    case 'repasar-asignatura': location.hash = '#/estudio'; UI.route = 'estudio'; UI.tab = 'repaso';
      UI.repasoFiltro = { subject_id: id }; UI.repasoActual = null; UI.repasoRevelada = false; render(); break;
    case 'repasar-caso': {
      const c = store.get('cases', id); if (!c) break;
      abrirModal('Repaso de caso · ' + c.titulo,
        '<p class="text-[12.5px] text-ink-500 dark:text-ink-400 mb-3">Lee los hechos y responde mentalmente antes de mirar la decisión.</p>' +
        '<div class="p-3 rounded-xl bg-ink-50 dark:bg-ink-850 border border-ink-200 dark:border-ink-800 mb-2">' +
          '<p class="text-[10.5px] uppercase tracking-wider font-semibold text-ink-400 mb-1">Hechos</p>' +
          '<p class="text-[13px] prose-note">' + esc(c.hechos || '(sin hechos registrados)') + '</p></div>' +
        '<div class="p-3 rounded-xl acc-soft mb-3">' +
          '<p class="text-[10.5px] uppercase tracking-wider font-semibold acc-text mb-1">Problema jurídico</p>' +
          '<p class="text-[13px] prose-note">' + esc(c.problema || '(sin problema registrado)') + '</p></div>' +
        '<details class="rounded-xl border border-ink-200 dark:border-ink-800 p-3">' +
          '<summary class="text-[13px] font-medium cursor-pointer">Ver decisión y fundamentos</summary>' +
          '<p class="text-[12.5px] prose-note mt-2">' + esc(c.decision || '(sin decisión registrada)') + '</p>' +
          (c.fundamentos ? '<p class="text-[12.5px] prose-note mt-2 text-ink-600 dark:text-ink-300">' + esc(c.fundamentos) + '</p>' : '') +
        '</details>',
        btn('Cerrar', 'modal-cerrar', '', BTN.secundario) +
        btn('Lo tenía claro', 'caso-ok', 'data-id="' + c.id + '"', BTN.exito), 'max-w-lg');
      break;
    }
    case 'caso-ok': {
      const c = store.get('cases', id);
      if (c) store.insert('review_attempts', { item_tipo: 'case_brief', item_id: c.id,
        subject_id: c.subject_id, unit_id: null, resultado: 'correcto', segundos: 0, respondida_en: nowNaive() });
      cerrarModal(); toast('Anotado', 'exito'); render(); break;
    }
    case 'fichas-desde-asignatura':
    case 'fichas-desde-todo': {
      const sid = a === 'fichas-desde-asignatura' ? id : null;
      const conceptos = store.all('glossary').filter(g => !sid || g.subject_id === sid);
      const apuntes = store.all('legal_notes').filter(n => (!sid || n.subject_id === sid) && (n.conceptos || []).length);
      const total = conceptos.length + apuntes.reduce((x, n) => x + n.conceptos.length, 0);
      if (!total) { toast('No hay conceptos propios de donde generar preguntas', 'warn'); break; }
      confirmar('Se crearán ' + total + ' ficha(s) a partir de tu glosario y de los conceptos que derivaste de tus apuntes. ' +
        'Nexo no genera contenido jurídico nuevo.', () => {
        conceptos.forEach(g => store.insert('flashcards', { subject_id: g.subject_id, unit_id: null,
          pregunta: '¿Qué es ' + g.termino + '?', respuesta: g.definicion, tipo: 'ficha', opciones: [],
          dominio: 'no_estudiado', aciertos: 0, fallos: 0, intervalo_dias: 1, proxima_revision: todayISO() }));
        apuntes.forEach(n => n.conceptos.forEach(c => store.insert('flashcards', {
          subject_id: n.subject_id, unit_id: n.unit_id, pregunta: '¿Qué es ' + c + '?', respuesta: '',
          tipo: 'ficha', opciones: [], dominio: 'no_estudiado', aciertos: 0, fallos: 0,
          intervalo_dias: 1, proxima_revision: todayISO(), origen_apunte: n.id })));
        toast(total + ' ficha(s) creada(s)', 'exito'); render();
      }, { tono: 'info', ok: 'Crear fichas' });
      break;
    }

    /* --- Planificador y disponibilidad --- */
    case 'editar-disponibilidad': cerrarModal(); location.hash = '#/config'; UI.route = 'config'; render();
      setTimeout(() => toast('Edita tus bloques en «Disponibilidad para estudiar»'), 400); break;
    case 'guardar-escala': {
      const g = (x) => Number((document.getElementById(x) || {}).value);
      const min = g('cfg-esc-min'), max = g('cfg-esc-max'), ap = g('cfg-esc-ap');
      if (!(min < max) || ap < min || ap > max) { toast('Revisa los valores: la mínima debe ser menor que la máxima y la aprobación quedar en medio', 'warn'); break; }
      DB.profile.escala = { min, max, aprobacion: ap, decimales: 1,
        nombre: (document.getElementById('cfg-esc-nombre') || {}).value || 'Escala personalizada' };
      DB.profile.nota_aprobacion = ap;
      saveDB(); Nube.guardarPerfil().catch(() => {});
      toast('Escala actualizada', 'exito'); render(); break;
    }
    case 'cambiar-meta':
      openForm({ title: 'Meta semanal de estudio', ancho: 'max-w-sm',
        fields: [{ k: 'horas', label: 'Horas por semana', type: 'number', min: 1, max: 60, req: true, col: 2 }],
        values: { horas: Math.round((DB.profile.meta_semanal_min || 480) / 60) },
        onSave(d) { DB.profile.meta_semanal_min = Math.round(Number(d.horas) * 60); saveDB();
          Nube.guardarPerfil().catch(() => {}); toast('Meta actualizada', 'exito'); render(); } });
      break;
    case 'estudiar-unidad': {
      const u = store.get('units', id); if (!u) break;
      formSesion(null, { subject_id: u.subject_id, unit_id: u.id, titulo: 'Estudio: ' + u.nombre, fecha: todayISO() });
      break;
    }
    case 'iniciar-sesion-rapida': cerrarModal(); location.hash = '#/estudio'; UI.route = 'estudio'; UI.tab = 'sesion';
      UI.sesionAsignatura = id; render(); break;
    case 'sesion-desde-lectura': {
      const r = store.get('readings', id); if (!r) break;
      const min = Math.min(120, Math.max(30, Academico.minutosLectura(r)));
      formSesion(null, { subject_id: r.subject_id, titulo: 'Leer: ' + r.titulo, fecha: todayISO(),
        duracion_min: min, tipo: 'estudio' });
      break;
    }

    /* --- fichas --- */
    case 'nueva-ficha': formFicha(null); break;
    case 'ficha-revelar': UI.fichaRevelada = true; render(); break;
    case 'ficha-op': UI.fichaRevelada = true; render(); break;
    case 'ficha-bien': { const f = store.get('flashcards', id);
      const inter = Math.min(30, (f.intervalo_dias || 1) * 2);
      const dom = f.dominio === 'no_estudiado' ? 'inicial' : f.dominio === 'inicial' ? 'en_progreso' : 'dominado';
      store.update('flashcards', id, { aciertos: (f.aciertos || 0) + 1, intervalo_dias: inter, dominio: dom, proxima_revision: addDays(todayISO(), inter) });
      UI.fichaActual = null; UI.fichaRevelada = false; render(); break; }
    case 'ficha-mal': { const f = store.get('flashcards', id);
      store.update('flashcards', id, { fallos: (f.fallos || 0) + 1, intervalo_dias: 1, dominio: 'inicial', proxima_revision: addDays(todayISO(), 1) });
      UI.fichaActual = null; UI.fichaRevelada = false; render(); break; }
    case 'ficha-siguiente': { const pend = store.all('flashcards').filter(x => !x.proxima_revision || x.proxima_revision <= todayISO());
      const i = pend.findIndex(x => x.id === (UI.fichaActual || (pend[0] || {}).id));
      UI.fichaActual = (pend[(i + 1) % Math.max(1, pend.length)] || {}).id || null; UI.fichaRevelada = false; render(); break; }
    case 'borrar-ficha': Acciones.eliminar('flashcards', id, 'la ficha'); break;

    /* --- notas --- */
    case 'nueva-nota': formNota(null); break;
    case 'ver-nota': verNota(id); break;
    case 'editar-nota': cerrarModal(); formNota(store.get('notes', id)); break;
    case 'borrar-nota': cerrarModal(); Acciones.eliminar('notes', id, 'la nota'); break;
    case 'fijar-nota': { const n = store.get('notes', id); store.update('notes', id, { fijada: !n.fijada }); cerrarModal(); render(); break; }
    case 'nota-a': convertirNota(id, el.dataset.t); break;

    /* --- configuración --- */
    case 'guardar-perfil': DB.profile.nombre = document.getElementById('cfg-nombre').value || 'Carlos';
      DB.profile.nota_aprobacion = Number(document.getElementById('cfg-nota').value) || 4; saveDB();
      Nube.guardarPerfil().catch(() => {}); toast('Perfil guardado', 'exito'); render(); break;
    case 'guardar-horario': DB.profile.horario_laboral = {
        inicio: document.getElementById('cfg-lab-ini').value, fin: document.getElementById('cfg-lab-fin').value,
        dias: Array.from(document.querySelectorAll('[data-cfg-dia]')).filter(x => x.checked).map(x => Number(x.dataset.cfgDia))
      }; saveDB(); Nube.guardarPerfil().catch(() => {}); toast('Horario guardado', 'exito'); render(); break;
    case 'guardar-notif': {
      const n = DB.profile.notificaciones;
      document.querySelectorAll('[data-cfg-notif]').forEach(x => n[x.dataset.cfgNotif] = x.checked);
      n.anticipacion_min = Number(document.getElementById('cfg-notif-min').value) || 30;
      saveDB(); Nube.guardarPerfil().catch(() => {}); toast('Preferencias guardadas', 'exito'); break; }
    case 'cfg-disp-add': openForm({ title: 'Bloque de disponibilidad',
      fields: [{ k: 'dia', label: 'Día', type: 'select', opts: DIAS.map((d, i) => ({ v: i, l: d })) },
               { k: 'inicio', label: 'Desde', type: 'time' }, { k: 'fin', label: 'Hasta', type: 'time' }],
      values: { dia: 1, inicio: '20:30', fin: '22:30' }, ancho: 'max-w-md',
      onSave(d) { DB.profile.disponibilidad_estudio.push({ dia: Number(d.dia), inicio: d.inicio, fin: d.fin }); saveDB(); toast('Disponibilidad agregada'); render(); } }); break;
    case 'cfg-disp-del': DB.profile.disponibilidad_estudio.splice(Number(el.dataset.i), 1); saveDB();
      Nube.guardarPerfil().catch(() => {}); render(); break;

    /* --- Supabase: conexión, cuenta y sincronización --- */
    case 'abrir-conexion': cerrarModal(); abrirConexion(); break;
    case 'auth-entrar': cerrarModal(); abrirAuth('entrar'); break;
    case 'auth-registro': cerrarModal(); abrirAuth('registro'); break;
    case 'auth-tab': UI.authModo = v; abrirAuth(v); break;
    case 'auth-reenviar':
      Nube.reenviarConfirmacion(el.dataset.mail)
        .then(() => toast('Correo reenviado', 'exito'))
        .catch(e2 => toast(mensajeAuth(e2), 'error'));
      break;
    case 'auth-cambiar-clave':
      openForm({
        title: 'Cambiar contraseña', ancho: 'max-w-md',
        nota: 'Necesitamos tu contraseña actual para confirmar que eres tú.',
        fields: [
          { k: 'actual', label: 'Contraseña actual', type: 'password', req: true, col: 2 },
          { k: 'nueva', label: 'Contraseña nueva', type: 'password', req: true, col: 2, hint: 'Mínimo 8 caracteres, con una letra y un número.' }
        ],
        values: { actual: '', nueva: '' },
        onSave(d) {
          if (d.nueva.length < 8 || !/[a-zA-Z]/.test(d.nueva) || !/\d/.test(d.nueva)) return toast('La contraseña nueva no cumple los requisitos', 'warn');
          Nube.client.auth.signInWithPassword({ email: Nube.user.email, password: d.actual })
            .then(r => { if (r.error) throw new Error('La contraseña actual no es correcta.'); return Nube.definirClave(d.nueva); })
            .then(() => toast('Contraseña actualizada', 'exito'))
            .catch(e2 => toast(mensajeAuth(e2), 'error'));
        }
      });
      break;
    case 'sb-salir':
      confirmar('Se cerrará la sesión. Tus datos locales quedan en este navegador.', () => {
        Nube.salir().then(() => { toast('Sesión cerrada'); render(); });
      }, { tono: 'info', ok: 'Cerrar sesión' });
      break;
    case 'sb-olvidar':
      confirmar('Se borrará la conexión guardada en este navegador. Los datos de la nube no se tocan.', () => {
        Nube.clearCfg(); toast('Conexión eliminada'); render();
      }, { ok: 'Olvidar conexión' });
      break;
    case 'sb-vaciar':
      confirmar('Se borrarán TODOS tus registros guardados en Supabase. Los datos locales de este navegador no se tocan. Esta acción no se puede deshacer.', () => {
        UI.cargando = true; render();
        Nube.vaciarCuenta()
          .then(m => toast(m || 'Cuenta vaciada', 'exito'))
          .catch(e2 => toast(mensajeAuth(e2), 'error'))
          .finally(() => { UI.cargando = false; render(); });
      }, { ok: 'Vaciar la nube' });
      break;
    case 'sync-subir':
      confirmar('Se enviarán todos tus datos locales a Supabase. Lo que ya exista con el mismo identificador se actualiza.', () => sincronizar('subir'),
        { tono: 'info', ok: 'Subir datos' });
      break;
    case 'sync-bajar':
      confirmar('Se reemplazarán los datos de este navegador por los de tu cuenta en la nube.', () => sincronizar('bajar'),
        { ok: 'Reemplazar datos locales' });
      break;
    case 'sync-demo':
      confirmar('Se cargarán datos de ejemplo en tu cuenta de Supabase y se descargarán a este navegador.', () => sincronizar('demo'),
        { tono: 'info', ok: 'Cargar ejemplo' });
      break;

    /* --- datos --- */
    case 'exportar': {
      const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
      const url2 = URL.createObjectURL(blob);
      const a2 = document.createElement('a');
      a2.href = url2; a2.download = 'nexo-respaldo-' + todayISO() + '.json'; a2.click();
      URL.revokeObjectURL(url2); toast('Respaldo descargado'); break; }
    case 'importar': {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json';
      inp.onchange = () => { const f = inp.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = () => { try { const d = JSON.parse(rd.result);
            if (!d.profile) throw new Error('Archivo no válido');
            DB = d; TABLAS.forEach(t => { if (!Array.isArray(DB[t])) DB[t] = []; });
            saveDB(); toast('Respaldo importado'); render();
          } catch (e2) { toast('No se pudo importar: ' + e2.message, 'error'); } };
        rd.readAsText(f); };
      inp.click(); break; }
    case 'reset-demo': confirmar('Se reemplazarán todos los datos locales por los de demostración. ¿Continuar?', () => {
        DB = seedDemo(); saveDB(); toast('Datos demo recargados'); render(); }); break;
    case 'borrar-todo': confirmar('Se borrarán TODOS los datos guardados en este navegador. Esta acción no se puede deshacer.', () => {
        DB = seedDemo(); TABLAS.forEach(t => DB[t] = []); saveDB(); toast('Datos borrados'); render(); }); break;
  }
  if (noNav.includes(a)) ev.stopPropagation();
});

/* Cambios en campos (filtros, selects, buscadores, herramientas) */
function manejarCampo(e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  if (a === 'filtro') {
    UI.filtros[el.dataset.k] = el.value;
    if (el.dataset.k === 'q') { UI.focusSel = 'filtro'; UI.focusKey = 'q'; }
    render();
  } else if (a === 'buscar-u') { UI.busquedaU = el.value; UI.focusSel = 'buscar-u'; render(); }
  else if (a === 'buscar-n') { UI.busquedaN = el.value; UI.focusSel = 'buscar-n'; render(); }
  else if (a === 'tool') { const fn = ToolCalc[el.dataset.t]; if (fn) fn.call(ToolCalc); }
  else if (a === 'dominio') { store.update('units', el.dataset.id, { dominio: el.value }); render(); }
  else if (a === 'chk') { const t = store.get('tasks', el.dataset.id);
    t.checklist[Number(el.dataset.i)].hecho = el.checked; store.update('tasks', t.id, { checklist: t.checklist }); }
  else if (a === 'pomo-sesion') { UI.pomoSesion = el.value; if (UI.pomodoro) UI.pomodoro.sesionId = el.value; }
  else if (a === 'pl-eval') { if (window.__planRepintar) window.__planRepintar(el.value); }
  else if (a === 'repaso-asig') {
    UI.repasoFiltro = Object.assign({}, UI.repasoFiltro, { subject_id: el.value || null });
    UI.repasoActual = null; UI.repasoRevelada = false; render();
  }
  else if (a === 'cfg-ia') {
    DB.profile.ia_activada = el.checked; saveDB();
    toast(el.checked ? 'IA activada. Si la función no está desplegada, se usan reglas.' : 'Asistente en modo reglas locales', 'exito');
    render();
  }
  else if (a === 'bg-input') { const r = document.getElementById('bg-res'); if (r) r.innerHTML = pintarResultados(el.value); }
}
document.addEventListener('input', manejarCampo);
document.addEventListener('change', manejarCampo);

/* Atajos de teclado */
document.addEventListener('keydown', (e) => {
  const enCampo = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || '')) || e.target.isContentEditable;
  if (e.target && e.target.id === 'chat-input' && e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault(); const t = e.target.value; e.target.value = ''; enviarChat(t); return;
  }
  if (e.target && e.target.id === 'cap-txt' && e.key === 'Enter') { e.preventDefault(); if (modalOnSave) modalOnSave(); return; }
  if (e.target && e.target.id === 'bg-input' && e.key === 'Enter') {
    e.preventDefault();
    const primero = document.querySelector('#bg-res [data-act="bg-ir"]');
    if (primero) primero.click();
    return;
  }
  if (e.key === 'Escape') { cerrarModal(); return; }
  if (!enCampo && (e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey)))) { e.preventDefault(); abrirBuscador(); return; }
  if (!enCampo && e.key.toLowerCase() === 'n' && !e.metaKey && !e.ctrlKey && !document.querySelector('#modal-root [role="dialog"]')) {
    e.preventDefault(); menuRapido();
  }
  /* Enter o barra espaciadora activan las filas marcadas como botón */
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.dataset.act) {
    e.preventDefault(); e.target.click();
  }
});

window.addEventListener('hashchange', () => { parseHash(); render(); window.scrollTo(0, 0); });

/* ==========================================================================
   24. ARRANQUE
   ========================================================================== */
/* Service worker: solo tiene sentido servido por http/https, no con file:// */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {
      /* Sin service worker la app sigue funcionando; solo pierde el modo sin conexión. */
    });
  });
}

(async function init() {
  loadLocal();
  cargarHistorial();
  if (!UI.tema) UI.tema = DB.profile.tema || 'claro';
  parseHash();
  render();
  try {
    await Nube.init();
    if (Nube.conectado && DB.esDemo) {
      /* Lo local todavía es el ejemplo: la nube manda. Si la cuenta está
         vacía, se conserva el ejemplo hasta que decidas qué hacer. */
      UI.cargando = true; render();
      try {
        const { count } = await Nube.client.from('tasks').select('id', { count: 'exact', head: true });
        if ((count || 0) > 0) { await Nube.bajar(); DB.esDemo = false; saveDB(); }
      } catch (e) { console.warn('Sincronización inicial', e.message); }
      UI.cargando = false;
    }
    render();
  } catch (e) { console.warn('Supabase no disponible:', e.message); }
  // Reloj: actualiza el encabezado cada minuto sin redibujar toda la app
  setInterval(() => {
    if (document.querySelector('#modal-root [role="dialog"]')) return;
    if (UI.pomodoro && UI.pomodoro.corriendo) return;
    render();
  }, 60000);
})();
</script>
