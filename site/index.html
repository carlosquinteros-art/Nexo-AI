<title>Nexo — Asistente de Carlos</title>
<!--
  ============================================================================
  NEXO — Prototipo funcional (archivo único)
  ----------------------------------------------------------------------------
  Cómo usar:
    1. Abrir este archivo con doble clic en cualquier navegador moderno.
    2. Funciona sin conexión a internet excepto por Tailwind y Supabase (CDN).
    3. Los datos se guardan en el navegador (localStorage).
    4. Para sincronizar en la nube: Configuración → Sincronización.
       Pegar Project URL y anon key de Supabase (ambas son públicas por diseño).
       La seguridad real la entrega Row Level Security en la base de datos.

  Lo que NO hace y por qué (sin inventar integraciones):
    - Notificaciones push: requieren Service Worker + servidor con claves VAPID.
      Aquí las alertas se muestran dentro de la app.
    - Asistente con IA: el parser es por reglas, en español, y funciona de verdad.
      Para IA real hay que crear una Edge Function en Supabase que guarde la API
      key del lado servidor. El contrato está definido en Asistente.callAI().
    - Búsqueda jurídica automática: no existe API pública estable de BCN ni del
      Poder Judicial. Se ofrecen enlaces directos y verificación manual.
  ============================================================================
-->

const TZ = 'America/Santiago';
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS_C = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* Los identificadores son UUID v4 para que coincidan con la base de datos. */
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach((_, i) => (b[i] = Math.floor(Math.random() * 256)));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
}
const esUuid = (s) => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(s || ''));
const uid = () => uuid();
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const by = (k, dir = 1) => (a, b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0) * dir;

/* --- Fecha y hora de Chile ------------------------------------------------
   Todas las fechas se guardan como texto ingenuo (sin zona):
     fecha       -> "AAAA-MM-DD"
     fecha y hora-> "AAAA-MM-DDTHH:MM"
   y se interpretan siempre como hora de Chile. Al sincronizar con Supabase se
   convierten a timestamptz usando el desfase real de la fecha (considera el
   horario de verano).                                                       */
function tzOffsetMin(date, tz = TZ) {
  const dtf = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const p = {}; dtf.formatToParts(date).forEach(x => p[x.type] = x.value);
  const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, p.hour === '24' ? 0 : +p.hour, +p.minute, +p.second);
  return (asUTC - date.getTime()) / 60000;
}
function nowCL() {
  const d = new Date();
  return new Date(d.getTime() + tzOffsetMin(d) * 60000);
}
function todayISO() { return nowCL().toISOString().slice(0, 10); }
function nowNaive() { return nowCL().toISOString().slice(0, 16); }
function parseNaive(s) {
  if (!s) return null;
  const [d, t] = String(s).split('T');
  const [y, m, dd] = d.split('-').map(Number);
  const [hh, mm] = (t || '00:00').split(':').map(Number);
  return new Date(Date.UTC(y, m - 1, dd, hh || 0, mm || 0));
}
function naiveOf(dt) { return dt.toISOString().slice(0, 16); }
function isoOf(dt) { return dt.toISOString().slice(0, 10); }
function addDays(s, n) { const d = parseNaive(s); d.setUTCDate(d.getUTCDate() + n); return String(s).length > 10 ? naiveOf(d) : isoOf(d); }
function addMin(s, n) { const d = parseNaive(s); d.setUTCMinutes(d.getUTCMinutes() + n); return naiveOf(d); }
function diffDays(a, b) { return Math.round((parseNaive(a) - parseNaive(b)) / 86400000); }
function dayOfWeek(s) { return parseNaive(s).getUTCDay(); }
function fmtFecha(s) { if (!s) return '—'; const d = parseNaive(s); return String(d.getUTCDate()).padStart(2,'0') + '/' + String(d.getUTCMonth()+1).padStart(2,'0') + '/' + d.getUTCFullYear(); }
function fmtHora(s) { if (!s || String(s).length <= 10) return ''; return String(s).slice(11, 16); }
function fmtFechaHora(s) { const h = fmtHora(s); return fmtFecha(s) + (h ? ' · ' + h : ''); }
function fmtLargo(s) { const d = parseNaive(s); return DIAS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' de ' + MESES[d.getUTCMonth()] + ' de ' + d.getUTCFullYear(); }
function fmtRelativo(s) {
  if (!s) return '';
  const dd = diffDays(String(s).slice(0, 10), todayISO());
  if (dd === 0) return 'hoy';
  if (dd === 1) return 'mañana';
  if (dd === -1) return 'ayer';
  if (dd > 1 && dd <= 7) return 'en ' + dd + ' días';
  if (dd < -1) return 'hace ' + Math.abs(dd) + ' días';
  return fmtFecha(s);
}
function fmtCLP(n) {
  if (n === '' || n === null || n === undefined || isNaN(n)) return '$0';
  return '$' + Math.round(n).toLocaleString('es-CL');
}
function fmtNum(n, dec = 1) { return (Number(n) || 0).toLocaleString('es-CL', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function saludo() { const h = nowCL().getUTCHours(); return h < 12 ? 'Buenos días' : h < 20 ? 'Buenas tardes' : 'Buenas noches'; }
function relojCL() {
  const d = nowCL();
  return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
}
function slug(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }

   3. ESTADO Y PERSISTENCIA
   ========================================================================== */
const LS_DB = 'nexo.db.v1', LS_UI = 'nexo.ui.v1', LS_SB = 'nexo.supabase.v1';

let DB = {};
let UI = {
  space: 'todo', route: 'inicio', param: null, tab: null,
  tareaVista: 'lista', filtros: { estado: '', prioridad: '', brand: '', subject: '', fecha: '', q: '' },
  chat: [], propuesta: null, pomodoro: null, busquedaU: '', tema: 'claro'
};

function saveDB() { try { localStorage.setItem(LS_DB, JSON.stringify(DB)); } catch (e) { console.warn('No se pudo guardar', e); } }
function saveUI() {
  try {
    const { space, route, tareaVista, tema } = UI;
    localStorage.setItem(LS_UI, JSON.stringify({ space, route, tareaVista, tema }));
  } catch (e) {}
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_DB);
    if (raw) DB = JSON.parse(raw);
  } catch (e) { DB = {}; }
  try {
    const u = JSON.parse(localStorage.getItem(LS_UI) || '{}');
    Object.assign(UI, u);
  } catch (e) {}
  if (!DB || !DB.profile) DB = seedDemo();
  TABLAS.forEach(t => { if (!Array.isArray(DB[t])) DB[t] = []; });
}

/* --- API de datos: siempre local, y espejo en Supabase si está conectado --- */
function dejarDeSerDemo() { if (DB.esDemo) { DB.esDemo = false; } }

const store = {
  all(t) { return DB[t] || []; },
  get(t, id) { return (DB[t] || []).find(r => r.id === id); },
  insert(t, row) {
    const r = Object.assign({ id: uid(), created_at: nowNaive(), updated_at: nowNaive() }, row);
    (DB[t] = DB[t] || []).push(r); dejarDeSerDemo(); saveDB(); Cloud.push(t, r); return r;
  },
  update(t, id, patch) {
    const r = store.get(t, id); if (!r) return null;
    Object.assign(r, patch, { updated_at: nowNaive() }); dejarDeSerDemo(); saveDB(); Cloud.push(t, r); return r;
  },
  remove(t, id) {
    DB[t] = (DB[t] || []).filter(r => r.id !== id); dejarDeSerDemo(); saveDB(); Cloud.remove(t, id);
  },
  where(t, fn) { return (DB[t] || []).filter(fn); }
};

/* ==========================================================================
   4. SUPABASE — autenticación y sincronización con el esquema v2
   --------------------------------------------------------------------------
   El modelo local sigue en español y la base en inglés. Entre medio vive esta
   capa de traducción: así el prototipo conserva toda su lógica y la base queda
   con nombres estándar, enums y RLS. Cada tabla declara cómo convertir en los
   dos sentidos.
   ========================================================================== */

/* Diccionarios de enums: local ↔ remoto */
function inv(o) { const r = {}; for (const k in o) r[o[k]] = k; return r; }
const E = {

  novedad:   { ingreso: 'onboarding', licencia: 'sick_leave', vacaciones: 'vacation', reemplazo: 'replacement', renuncia: 'resignation', capacitacion: 'training', amonestacion: 'warning' },

  acuerdoT:  { acuerdo: 'agreement', incidencia: 'incident', hallazgo: 'finding', oportunidad: 'opportunity' },
  acuerdoE:  { abierto: 'open', en_curso: 'in_progress', cerrado: 'closed' },
  impacto:   { bajo: 'low', medio: 'medium', alto: 'high' },
  evalT:     { prueba: 'test', examen: 'exam', control: 'quiz', trabajo: 'paper', presentacion: 'presentation', taller: 'workshop' },
  evalE:     { pendiente: 'pending', rendida: 'taken', calificada: 'graded', anulada: 'cancelled' },
  dominio:   { no_estudiado: 'not_started', inicial: 'initial', en_progreso: 'in_progress', dominado: 'mastered' },
  planE:     { activo: 'active', completado: 'completed', cancelado: 'cancelled' },
  sesionT:   { estudio: 'study', repaso: 'review', ejercicios: 'practice', sintesis: 'summary' },
  sesionE:   { pendiente: 'pending', completada: 'done', reprogramada: 'rescheduled', omitida: 'skipped' },

const EI = {}; for (const k in E) EI[k] = inv(E[k]);
const aR = (dic, v, def) => E[dic][v] || def || Object.values(E[dic])[0];
const aL = (dic, v, def) => EI[dic][v] || def || Object.keys(E[dic])[0];

/* Fechas: el modelo local guarda texto ingenuo en hora de Chile */
const tzOut = (naive) => naive ? new Date(parseNaive(naive).getTime() - tzOffsetMin(parseNaive(naive)) * 60000).toISOString() : null;
const tzIn  = (iso) => { if (!iso) return null; const d = new Date(iso); return new Date(d.getTime() + tzOffsetMin(d) * 60000).toISOString().slice(0, 16); };
const soloFecha = (s) => s ? String(s).slice(0, 10) : null;
const soloHora  = (s) => { const h = fmtHora(s); return h ? h + ':00' : null; };
const linksOut  = (a) => (a || []).map(x => ({ title: x.titulo || '', url: x.url || '' }));

    in_: r => ({ id: r.id, parent_id: null, area: aL('area', r.space), titulo: r.title,
      descripcion: r.description || '', categoria: r.category || '', responsable: r.assignee || '',
      prioridad: aL('prioridad', r.priority), estado: aL('estadoT', r.status), due_at: tzIn(r.due_at),
      brand_id: r.brand_id, subject_id: r.course_id, recurrencia: aL('recurr', r.recurrence),
      enlaces: linksIn(r.links), completed_at: tzIn(r.completed_at),
      checklist: (r.subtasks || []).map(s => ({ texto: s.title, hecho: s.is_done })) }) }
};

/* Tablas locales que se sincronizan por el mapa directo */
const TABLAS_MAPEADAS = Object.keys(MAPA);

const Nube = {
  client: null, user: null, cfg: null, sincronizando: false, ultimoError: '',
  perfil: null, preferencias: null,

  /* ------------------------------------------------------------ Conexión -- */
  loadCfg() { try { this.cfg = JSON.parse(localStorage.getItem(LS_SB) || 'null'); } catch (e) { this.cfg = null; } return this.cfg; },
  saveCfg(url, key) { this.cfg = { url: url.trim().replace(/\/$/, ''), key: key.trim() }; localStorage.setItem(LS_SB, JSON.stringify(this.cfg)); },
  clearCfg() { localStorage.removeItem(LS_SB); this.cfg = null; this.client = null; this.user = null; },
  get conectado() { return !!(this.client && this.user); },
  get configurado() { return !!this.client; },

  async init() {
    this.loadCfg();
    if (!this.cfg || !window.supabase) return false;
    try {
      this.client = window.supabase.createClient(this.cfg.url, this.cfg.key, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce', storageKey: 'nexo.auth' }
      });
      const { data } = await this.client.auth.getSession();
      this.user = data?.session?.user || null;
      this.client.auth.onAuthStateChange((evento, sesion) => {
        this.user = sesion?.user || null;
        if (evento === 'PASSWORD_RECOVERY') { UI.recuperandoClave = true; abrirNuevaClave(); return; }
        if (evento === 'SIGNED_OUT') { this.perfil = null; this.preferencias = null; }
        render();
      });
      if (this.user) await this.cargarPerfil();
      return true;
    } catch (e) { this.ultimoError = e.message; this.client = null; return false; }
  },

  /* ------------------------------------------------------- Autenticación -- */
  async registrar(email, password, nombre) {
    if (!this.client) throw new Error('Primero guarda la conexión con Supabase.');
    const { data, error } = await this.client.auth.signUp({
      email: email.trim().toLowerCase(), password,
      options: { data: { full_name: nombre || DB.profile.nombre }, emailRedirectTo: location.href.split('#')[0] }
    });
    if (error) throw error;
    this.user = data.user;
    if (data.session) await this.cargarPerfil();
    return { requiereConfirmacion: !data.session };
  },

  async entrar(email, password) {
    if (!this.client) throw new Error('Primero guarda la conexión con Supabase.');
    const { data, error } = await this.client.auth.signInWithPassword({ email: email.trim().toLowerCase(), password });
    if (error) throw error;
    this.user = data.user;
    await this.cargarPerfil();
    return data.user;
  },

  async salir() { if (this.client) await this.client.auth.signOut(); this.user = null; this.perfil = null; },

  async recuperar(email) {
    if (!this.client) throw new Error('Primero guarda la conexión con Supabase.');
    const { error } = await this.client.auth.resetPasswordForEmail(email.trim().toLowerCase(), {
      redirectTo: location.href.split('#')[0]
    });
    if (error) throw error;
  },

  async definirClave(nueva) {
    const { error } = await this.client.auth.updateUser({ password: nueva });
    if (error) throw error;
    UI.recuperandoClave = false;
  },

  async reenviarConfirmacion(email) {
    const { error } = await this.client.auth.resend({ type: 'signup', email: email.trim().toLowerCase() });
    if (error) throw error;
  },

  /* -------------------------------------------------------------- Perfil -- */
  async cargarPerfil() {
    if (!this.conectado) return;
    const { data: p } = await this.client.from('profiles').select('*').eq('id', this.user.id).maybeSingle();
    const { data: s } = await this.client.from('user_settings').select('*').eq('user_id', this.user.id).maybeSingle();
    this.perfil = p || null; this.preferencias = s || null;
    if (p) DB.profile.nombre = p.full_name || DB.profile.nombre;
    if (p) DB.profile.email = p.email || this.user.email || '';
    if (s) {
      DB.profile.nota_aprobacion = Number(s.pass_grade) || 4;
      DB.profile.tema = s.theme === 'dark' ? 'oscuro' : 'claro';
      if (s.work_schedule) DB.profile.horario_laboral = { inicio: s.work_schedule.start, fin: s.work_schedule.end, dias: s.work_schedule.days || [1,2,3,4,5] };
      if (Array.isArray(s.study_availability)) DB.profile.disponibilidad_estudio = s.study_availability.map(d => ({ dia: d.day, inicio: d.start, fin: d.end }));
      if (s.notifications) DB.profile.notificaciones = {
        tareas: !!s.notifications.tasks, eventos: !!s.notifications.events,
        evaluaciones: !!s.notifications.assessments, sesiones: !!s.notifications.sessions,
        anticipacion_min: Number(s.notifications.lead_minutes) || 30
      };
      saveDB();
    }
  },

  async guardarPerfil() {
    if (!this.conectado) return;
    const p = DB.profile;
    await this.client.from('profiles').update({ full_name: p.nombre }).eq('id', this.user.id);
    await this.client.from('user_settings').update({
      theme: p.tema === 'oscuro' ? 'dark' : 'light',
      pass_grade: Number(p.nota_aprobacion) || 4,
      work_schedule: { start: p.horario_laboral.inicio, end: p.horario_laboral.fin, days: p.horario_laboral.dias },
      study_availability: (p.disponibilidad_estudio || []).map(d => ({ day: d.dia, start: d.inicio, end: d.fin })),
      notifications: {
        tasks: !!p.notificaciones.tareas, events: !!p.notificaciones.eventos,
        assessments: !!p.notificaciones.evaluaciones, sessions: !!p.notificaciones.sesiones,
        lead_minutes: Number(p.notificaciones.anticipacion_min) || 30
      }
    }).eq('user_id', this.user.id);
  },

  /* ------------------------------------------------- Escritura incremental */
  /** Envía una fila concreta. Silencioso: la copia local ya se guardó. */
  async push(tabla, fila) {
    if (!this.conectado || this.sincronizando) return;
    try {
      if (tabla === 'tasks' && fila.parent_id) return this.pushSubtarea(fila);
      if (tabla === 'events') return this.pushEvento(fila);
      if (tabla === 'agreements') return this.pushAcuerdo(fila);
      if (tabla === 'flashcards') return this.pushFicha(fila);
      const m = MAPA[tabla]; if (!m) return;
      const payload = Object.assign(m.out(fila), { user_id: this.user.id });
      const { error } = await this.client.from(m.remota).upsert(payload);
      if (error) throw error;
      if (tabla === 'tasks') await this.pushChecklist(fila);
      if (tabla === 'evaluations') await this.pushNota(fila);
      if (tabla === 'brands') await this.pushContactos(fila);
    } catch (e) { console.warn('Sincronización', tabla, e.message); }
  },

  async remove(tabla, id) {
    if (!this.conectado) return;
    const destino = tabla === 'events' ? null : (MAPA[tabla] ? MAPA[tabla].remota : tabla);
    try {
      if (destino) await this.client.from(destino).delete().eq('id', id);
      else { for (const t of ['meetings', 'class_sessions', 'personal_events']) await this.client.from(t).delete().eq('id', id); }
    } catch (e) { console.warn(e); }
  },

  async pushChecklist(t) {
    const hijas = store.where('tasks', x => x.parent_id === t.id);
    const filas = (t.checklist || []).map((c, i) => ({ id: uid(), user_id: this.user.id, task_id: t.id, title: c.texto, is_done: !!c.hecho, position: i + 1 }))
      .concat(hijas.map((h, i) => ({ id: h.id, user_id: this.user.id, task_id: t.id, title: h.titulo, is_done: h.estado === 'completada', position: 100 + i })));
    await this.client.from('subtasks').delete().eq('task_id', t.id);
    if (filas.length) await this.client.from('subtasks').insert(filas);
  },
  async pushSubtarea(t) {
    if (!t.parent_id) return;
    await this.client.from('subtasks').upsert({
      id: t.id, user_id: this.user.id, task_id: t.parent_id, title: t.titulo,
      is_done: t.estado === 'completada', position: 100
    });
  },
  async pushNota(e) {
    if (e.nota == null || e.nota === '') { await this.client.from('grades').delete().eq('assessment_id', e.id); return; }
    await this.client.from('grades').upsert(
      { user_id: this.user.id, assessment_id: e.id, score: Number(e.nota), attempt: 1 },
      { onConflict: 'assessment_id,attempt' }
    );
  },
  async pushContactos(b) {
    await this.client.from('contacts').delete().eq('brand_id', b.id);
    const filas = (b.contactos || []).filter(c => c.nombre).map(c => ({
      id: uid(), user_id: this.user.id, brand_id: b.id, full_name: c.nombre,
      role_title: c.cargo || null, email: c.email || null, phone: c.telefono || null
    }));
    if (filas.length) await this.client.from('contacts').insert(filas);
  },
  async pushEvento(ev) {
    const base = { id: ev.id, user_id: this.user.id, title: ev.titulo };
    if (ev.tipo === 'reunion') {
      await this.client.from('meetings').upsert(Object.assign({}, base, {
        space: aR('area', ev.area), brand_id: ev.brand_id || null, starts_at: tzOut(ev.inicio),
        ends_at: tzOut(ev.fin), location: ev.lugar || null, link: ev.enlace || null,
        objective: ev.objetivo || null, notes: ev.notas || null,
        reminder_minutes: clamp(ev.recordatorio_min || 30, 0, 10080),
        status: ev.estado === 'realizado' ? 'done' : ev.estado === 'cancelado' ? 'cancelled' : 'scheduled'
      }));
      const partes = (ev.participantes || []).filter(p => p.nombre).map(p => ({
        id: uid(), user_id: this.user.id, meeting_id: ev.id, display_name: p.nombre, role_title: p.rol || null
      }));
      await this.client.from('meeting_participants').delete().eq('meeting_id', ev.id);
      if (partes.length) await this.client.from('meeting_participants').insert(partes);
    } else if (ev.tipo === 'clase' && ev.subject_id) {
      await this.client.from('class_sessions').upsert(Object.assign({}, base, {
        course_id: ev.subject_id, starts_at: tzOut(ev.inicio), ends_at: tzOut(ev.fin),
        room: ev.lugar || null, modality: ev.enlace ? 'Online' : null, notes: ev.notas || null
      }));
    } else if (ev.tipo === 'personal') {
      await this.client.from('personal_events').upsert(Object.assign({}, base, {
        starts_at: tzOut(ev.inicio), ends_at: tzOut(ev.fin), location: ev.lugar || null, notes: ev.notas || null,
        reminder_minutes: clamp(ev.recordatorio_min || 30, 0, 10080)
      }));
    }
    /* Los eventos de tipo evaluación y sesión de estudio se derivan de sus
       propias tablas, así que no se duplican aquí. */
  },
  async pushAcuerdo(a) {
    const comun = { id: a.id, user_id: this.user.id, brand_id: a.brand_id || null, title: a.titulo, detail: a.detalle || null };
    if (a.tipo === 'incidencia') {
      await this.client.from('incidents').upsert(Object.assign({}, comun, {
        description: a.detalle || null, severity: a.impacto === 'alto' ? 'high' : a.impacto === 'bajo' ? 'low' : 'medium',
        status: a.estado === 'cerrado' ? 'resolved' : a.estado === 'en_curso' ? 'in_progress' : 'open',
        detected_at: tzOut(a.fecha + 'T09:00')
      }));
      delete comun.detail;
    } else {
      await this.client.from('agreements').upsert(Object.assign({}, comun, {
        meeting_id: a.event_id || null, type: aR('acuerdoT', a.tipo), owner_name: a.responsable || null,
        agreed_on: soloFecha(a.fecha), status: aR('acuerdoE', a.estado), impact: aR('impacto', a.impacto || 'medio')
      }));
    }
  },
  async pushFicha(f) {
    if (f.tipo === 'ficha') {
      await this.client.from('flashcards').upsert({
        id: f.id, user_id: this.user.id, course_id: f.subject_id || null, unit_id: f.unit_id || null,
        front: f.pregunta, back: f.respuesta, mastery: aR('dominio', f.dominio),
        hits: f.aciertos || 0, misses: f.fallos || 0,
        interval_days: clamp(f.intervalo_dias || 1, 0, 365), next_review: soloFecha(f.proxima_revision)
      });
    } else {
      await this.client.from('practice_questions').upsert({
        id: f.id, user_id: this.user.id, course_id: f.subject_id || null, unit_id: f.unit_id || null,
        type: aR('preguntaT', f.tipo, 'open'), prompt: f.pregunta, answer: f.respuesta || null,
        options: (f.opciones || []).map(o => ({ text: o.texto, correct: !!o.correcta })), difficulty: 3
      });
    }
  },

  /* ------------------------------------------------------- Subir todo ----- */
  async subir() {
    if (!this.conectado) throw new Error('Inicia sesión para sincronizar.');
    this.sincronizando = true;
    try {
      migrarIdsAUuid();
      const orden = ['brands', 'stores', 'people', 'person_events', 'requests', 'subjects', 'units',
        'evaluations', 'readings', 'study_plans', 'study_sessions', 'glossary', 'legal_sources',
        'cases', 'tasks', 'notes', 'time_blocks'];
      for (const t of orden) {
        const filas = (DB[t] || []).filter(f => t !== 'tasks' || !f.parent_id).map(f => Object.assign(MAPA[t].out(f), { user_id: this.user.id }));
        for (let i = 0; i < filas.length; i += 100) {
          const { error } = await this.client.from(MAPA[t].remota).upsert(filas.slice(i, i + 100));
          if (error) throw new Error(MAPA[t].remota + ': ' + error.message);
        }
      }
      /* Derivados y tablas que se dividen */
      for (const b of DB.brands) await this.pushContactos(b);
      for (const t of DB.tasks.filter(x => !x.parent_id)) await this.pushChecklist(t);
      for (const e of DB.evaluations) await this.pushNota(e);
      for (const ev of DB.events) await this.pushEvento(ev);
      for (const a of DB.agreements) await this.pushAcuerdo(a);
      for (const f of DB.flashcards) await this.pushFicha(f);
      await this.guardarPerfil();
    } finally { this.sincronizando = false; }
  },

  /* ------------------------------------------------------- Bajar todo ----- */
  async bajar() {
    if (!this.conectado) throw new Error('Inicia sesión para sincronizar.');
    this.sincronizando = true;
    try {
      const traer = async (tabla, select) => {
        const { data, error } = await this.client.from(tabla).select(select || '*').is('deleted_at', null);
        if (error && /deleted_at/.test(error.message || '')) {
          const r2 = await this.client.from(tabla).select(select || '*');
          if (r2.error) throw new Error(tabla + ': ' + r2.error.message);
          return r2.data || [];
        }
        if (error) throw new Error(tabla + ': ' + error.message);
        return data || [];
      };

      const [brands, contacts, stores, people, peopleEv, requests, incidents, meetings, mParts, agreements,
             periods, courses, units, classes, assessments, readings, plans, sessions,
             sources, concepts, cases, flashcards, questions, tasks, subtasks, notes, personal, blocks] =
        await Promise.all([
          traer('brands'), traer('contacts'), traer('stores'), traer('people'),
          traer('people_events'), traer('requests'), traer('incidents'),
          traer('meetings'), traer('meeting_participants'), traer('agreements'),
          traer('academic_periods'), traer('courses'), traer('course_units'), traer('class_sessions'),
          traer('assessments', '*, grades(*)'), traer('readings'), traer('study_plans'), traer('study_sessions'),
          traer('legal_sources'), traer('legal_concepts'), traer('case_briefs'),
          traer('flashcards'), traer('practice_questions'),
          traer('tasks', '*, subtasks(*)'), traer('subtasks'), traer('notes'),
          traer('personal_events'), traer('time_blocks')
        ]);

      const periodoDe = {}; periods.forEach(p => periodoDe[p.id] = p.name);

      DB.brands = brands.map(MAPA.brands.in_);
      DB.brands.forEach(b => {
        b.contactos = contacts.filter(c => c.brand_id === b.id)
          .map(c => ({ nombre: c.full_name, cargo: c.role_title || '', email: c.email || '', telefono: c.phone || '' }));
      });
      DB.stores = stores.map(MAPA.stores.in_);
      DB.people = people.map(MAPA.people.in_);
      DB.person_events = peopleEv.map(MAPA.person_events.in_);
      DB.requests = requests.map(MAPA.requests.in_);

      DB.agreements = agreements.map(a => ({
        id: a.id, brand_id: a.brand_id, event_id: a.meeting_id, tipo: aL('acuerdoT', a.type),
        titulo: a.title, detalle: a.detail || '', responsable: a.owner_name || '',
        fecha: a.agreed_on, estado: aL('acuerdoE', a.status), impacto: aL('impacto', a.impact)
      })).concat(incidents.map(i => ({
        id: i.id, brand_id: i.brand_id, event_id: null, tipo: 'incidencia', titulo: i.title,
        detalle: i.description || '', responsable: '', fecha: soloFecha(i.detected_at),
        estado: i.status === 'resolved' ? 'cerrado' : i.status === 'in_progress' ? 'en_curso' : 'abierto',
        impacto: i.severity === 'critical' || i.severity === 'high' ? 'alto' : i.severity === 'low' ? 'bajo' : 'medio'
      })));

      DB.subjects = courses.map(c => MAPA.subjects.in_(Object.assign({}, c, { periodo_nombre: periodoDe[c.period_id] || '' })));
      DB.units = units.map(MAPA.units.in_);
      DB.evaluations = assessments.map(MAPA.evaluations.in_);
      DB.readings = readings.map(MAPA.readings.in_);
      DB.study_plans = plans.map(MAPA.study_plans.in_);
      DB.study_sessions = sessions.map(MAPA.study_sessions.in_);
      DB.legal_sources = sources.map(MAPA.legal_sources.in_);
      DB.glossary = concepts.map(MAPA.glossary.in_);
      DB.cases = cases.map(MAPA.cases.in_);

      DB.flashcards = flashcards.map(f => ({
        id: f.id, subject_id: f.course_id, unit_id: f.unit_id, pregunta: f.front, respuesta: f.back,
        tipo: 'ficha', opciones: [], dominio: aL('dominio', f.mastery), aciertos: f.hits, fallos: f.misses,
        intervalo_dias: f.interval_days, proxima_revision: f.next_review
      })).concat(questions.map(q => ({
        id: q.id, subject_id: q.course_id, unit_id: q.unit_id, pregunta: q.prompt, respuesta: q.answer || '',
        tipo: aL('preguntaT', q.type, 'desarrollo'),
        opciones: (q.options || []).map(o => ({ texto: o.text, correcta: !!o.correct })),
        dominio: 'no_estudiado', aciertos: 0, fallos: 0, intervalo_dias: 1, proxima_revision: todayISO()
      })));

      /* Tareas y subtareas */
      DB.tasks = tasks.map(MAPA.tasks.in_);
      const porTarea = {}; subtasks.forEach(s => (porTarea[s.task_id] = porTarea[s.task_id] || []).push(s));
      DB.tasks.forEach(t => { t.checklist = (porTarea[t.id] || []).map(s => ({ texto: s.title, hecho: s.is_done })); });

      DB.notes = notes.map(MAPA.notes.in_);
      DB.time_blocks = blocks.map(MAPA.time_blocks.in_);

      /* Agenda: se reconstruye desde las tablas especializadas */
      const partsDe = {}; mParts.forEach(p => (partsDe[p.meeting_id] = partsDe[p.meeting_id] || []).push(p));
      DB.events = meetings.map(m => ({
        id: m.id, area: aL('area', m.space), tipo: 'reunion', titulo: m.title, inicio: tzIn(m.starts_at),
        fin: tzIn(m.ends_at), lugar: m.location || '', enlace: m.link || '', objetivo: m.objective || '',
        notas: m.notes || '', brand_id: m.brand_id, subject_id: null,
        participantes: (partsDe[m.id] || []).map(p => ({ nombre: p.display_name, rol: p.role_title || '' })),
        recordatorio_min: m.reminder_minutes,
        estado: m.status === 'done' ? 'realizado' : m.status === 'cancelled' ? 'cancelado' : 'programado'
      })).concat(classes.map(c => ({
        id: c.id, area: 'universidad', tipo: 'clase', titulo: c.title || Q.nombreSubject(c.course_id) || 'Clase',
        inicio: tzIn(c.starts_at), fin: tzIn(c.ends_at), lugar: c.room || '', enlace: '', objetivo: c.topic || '',
        notas: c.notes || '', brand_id: null, subject_id: c.course_id, participantes: [],
        recordatorio_min: 30, estado: 'programado'
      }))).concat(personal.map(p => ({
        id: p.id, area: 'personal', tipo: 'personal', titulo: p.title, inicio: tzIn(p.starts_at),
        fin: tzIn(p.ends_at), lugar: p.location || '', enlace: '', objetivo: '', notas: p.notes || '',
        brand_id: null, subject_id: null, participantes: [], recordatorio_min: p.reminder_minutes, estado: 'programado'
      }))).concat(DB.evaluations.filter(e => e.fecha).map(e => ({
        id: 'ev-' + e.id, area: 'universidad', tipo: 'evaluacion', titulo: e.titulo,
        inicio: e.fecha + 'T' + (e.hora || '18:30'), fin: null, lugar: '', enlace: '', objetivo: e.temario || '',
        notas: '', brand_id: null, subject_id: e.subject_id, participantes: [], recordatorio_min: 60, estado: 'programado'
      })));

      await this.cargarPerfil();
      saveDB();
    } finally { this.sincronizando = false; }
  },

  /* ---------------------------------------------------------- Utilidades -- */
  async cargarDemoEnLaNube() {
    const { data, error } = await this.client.rpc('seed_demo_data');
    if (error) throw error;
    return data;
  },
  async vaciarCuenta() {
    const { data, error } = await this.client.rpc('wipe_my_data');
    if (error) throw error;
    return data;
  },

  /** Deja constancia de la acción confirmada. Nunca interrumpe el flujo. */
  async registrarActividad(entidad, id, accion, resumen) {
    if (!this.conectado) return;
    try {
      await this.client.from('activity_log').insert({
        user_id: this.user.id, entity_type: entidad, entity_id: id, action: accion, summary: resumen || null
      });
    } catch (e) { console.warn('activity_log', e.message); }
  },

  /** Crea el recordatorio asociado a un registro. */
  async crearRecordatorio(entidad, id, cuandoNaive, mensaje) {
    if (!this.conectado) return;
    try {
      await this.client.from('reminders').insert({
        user_id: this.user.id, entity_type: entidad, entity_id: id,
        remind_at: tzOut(cuandoNaive), channel: 'in_app', message: mensaje || null
      });
    } catch (e) { console.warn('reminders', e.message); }
  },

  /* Contrato para la futura Edge Function de IA. */
  async callAI(texto, contexto) {
    if (!this.conectado) throw new Error('IA_NO_DISPONIBLE');
    const { data, error } = await this.client.functions.invoke('nexo-ai', { body: { texto, contexto } });
    if (error) throw error;
    return data;
  }
};

/* --------------------------------------------------------------------------
   Migración de identificadores.
   El prototipo antiguo generaba ids cortos. La base exige UUID, así que al
   sincronizar por primera vez se reescriben los ids y todas sus referencias.
   -------------------------------------------------------------------------- */
const CAMPOS_REF = ['brand_id', 'store_id', 'subject_id', 'unit_id', 'person_id', 'plan_id', 'parent_id',
  'event_id', 'evaluation_id', 'reemplazo_de', 'source_id', 'concept_id'];

function migrarIdsAUuid() {
  const mapa = {};
  let cambios = 0;
  TABLAS.forEach(t => (DB[t] || []).forEach(f => {
    if (f.id && !esUuid(f.id)) { mapa[f.id] = uuid(); cambios++; }
  }));
  if (!cambios) return 0;
  TABLAS.forEach(t => (DB[t] || []).forEach(f => {
    if (mapa[f.id]) f.id = mapa[f.id];
    CAMPOS_REF.forEach(c => { if (f[c] && mapa[f[c]]) f[c] = mapa[f[c]]; });
  }));
  saveDB();
  return cambios;
}

/* ==========================================================================
   6. LÓGICA DE NEGOCIO
   ========================================================================== */
const Q = {
  brand: (bid) => store.get('brands', bid),
  subject: (sid) => store.get('subjects', sid),
  nombreBrand: (bid) => (Q.brand(bid) || {}).nombre || '',
  nombreSubject: (sid) => (Q.subject(sid) || {}).nombre || '',
  contexto(o) { return o.brand_id ? Q.nombreBrand(o.brand_id) : o.subject_id ? Q.nombreSubject(o.subject_id) : ''; },

  enEspacio(o) { return UI.space === 'todo' || o.area === UI.space; },

  tareas(opts = {}) {
    let l = store.all('tasks').filter(t => !t.parent_id);
    if (!opts.todas) l = l.filter(t => Q.enEspacio(t));
    if (opts.abiertas) l = l.filter(t => t.estado !== 'completada');
    return l;
  },
  subtareas(id) { return store.where('tasks', t => t.parent_id === id); },

  vencida(t) { return t.estado !== 'completada' && t.due_at && parseNaive(t.due_at) < parseNaive(nowNaive()); },
  paraHoy(t) { return t.estado !== 'completada' && t.due_at && String(t.due_at).slice(0, 10) === todayISO(); },

  score(t) {
    let s = PRIORIDADES[t.prioridad]?.peso || 10;
    if (t.due_at) {
      const dd = diffDays(String(t.due_at).slice(0, 10), todayISO());
      if (dd < 0) s += 35;
      else if (dd === 0) s += 30;
      else if (dd === 1) s += 18;
      else if (dd <= 3) s += 10;
      else if (dd <= 7) s += 5;
    }
    if (t.estado === 'esperando') s -= 12;
    if (t.estado === 'en_curso') s += 4;
    if (t.subject_id) {
      const ev = store.where('evaluations', e => e.subject_id === t.subject_id && e.estado === 'pendiente' && e.fecha)
        .sort(by('fecha'))[0];
      if (ev && diffDays(ev.fecha, todayISO()) >= 0 && diffDays(ev.fecha, todayISO()) <= 7) s += 12;
    }
    if (t.brand_id) {
      const b = Q.brand(t.brand_id);
      if (b?.estado === 'critico') s += 12;
      else if (b?.estado === 'requiere_atencion') s += 5;
    }
    return s;
  },
  prioridades(n = 3) {
    return Q.tareas({ abiertas: true }).map(t => ({ t, s: Q.score(t) })).sort((a, b) => b.s - a.s).slice(0, n).map(x => x.t);
  },
  eventosEntre(desde, hasta) {
    return store.all('events').filter(e => Q.enEspacio(e) && e.inicio >= desde && e.inicio <= hasta).sort(by('inicio'));
  },
  eventosDelDia(fecha) {
    return store.all('events').filter(e => Q.enEspacio(e) && String(e.inicio).slice(0, 10) === fecha).sort(by('inicio'));
  },
  evaluacionesProximas(dias = 45) {
    return store.all('evaluations')
      .filter(e => e.estado === 'pendiente' && e.fecha && diffDays(e.fecha, todayISO()) >= 0 && diffDays(e.fecha, todayISO()) <= dias)
      .sort(by('fecha'));
  },
  sesionesAtrasadas() {
    return store.all('study_sessions').filter(s => s.estado === 'pendiente' && s.fecha < todayISO()).sort(by('fecha'));
  },
  sesionesDeHoy() {
    return store.all('study_sessions').filter(s => s.fecha === todayISO() && s.estado !== 'omitida').sort(by('hora'));
  },
  paginasPendientes(sid) {
    return store.all('readings')
      .filter(r => !sid || r.subject_id === sid)
      .reduce((a, r) => a + Math.max(0, (r.paginas_total || 0) - (r.paginas_leidas || 0)), 0);
  },
  /* Delegan en el motor académico para respetar la escala configurada. */
  promedio(sid) { return Academico.promedio(sid); },
  notaNecesaria(sid, meta) { return Academico.notaNecesaria(sid, meta); },
  avanceSubject(sid) {
    const us = store.where('units', u => u.subject_id === sid);
    if (!us.length) return 0;
    return Math.round(us.reduce((a, u) => a + (DOMINIO[u.dominio]?.pct || 0), 0) / us.length);
  },
  cargaBrand(bid) {
    const t = store.where('tasks', x => x.brand_id === bid && x.estado !== 'completada');
    return {
      abiertas: t.length,
      vencidas: t.filter(Q.vencida).length,
      solicitudes: store.where('requests', r => r.brand_id === bid && ['abierta', 'en_gestion', 'sin_respuesta'].includes(r.estado)).length,
      incidencias: store.where('agreements', a => a.brand_id === bid && a.tipo === 'incidencia' && a.estado !== 'cerrado').length
    };
  },
  alertas() {
    const out = [];
    Q.tareas({ abiertas: true }).filter(Q.vencida).slice(0, 30).length &&
      out.push({ nivel: 'critico', txt: Q.tareas({ abiertas: true }).filter(Q.vencida).length + ' tarea(s) vencida(s)', ruta: '#/tareas' });
    store.all('brands').filter(b => b.estado === 'critico').forEach(b =>
      out.push({ nivel: 'critico', txt: 'Marca en estado crítico: ' + b.nombre, ruta: '#/marca/' + b.id }));
    store.all('requests').filter(r => r.estado === 'sin_respuesta').forEach(r =>
      out.push({ nivel: 'warn', txt: 'Sin respuesta: ' + r.titulo + ' (' + Q.nombreBrand(r.brand_id) + ')', ruta: '#/marca/' + r.brand_id }));
    store.all('stores').filter(s => s.estado === 'sin_cobertura').forEach(s =>
      out.push({ nivel: 'critico', txt: 'Tienda sin cobertura: ' + s.nombre, ruta: '#/marca/' + s.brand_id }));
    Q.evaluacionesProximas(7).forEach(e =>
      out.push({ nivel: 'warn', txt: e.titulo + ' — ' + Q.nombreSubject(e.subject_id) + ' ' + fmtRelativo(e.fecha), ruta: '#/asignatura/' + e.subject_id }));
    const atr = Q.sesionesAtrasadas().length;
    if (atr) out.push({ nivel: 'warn', txt: atr + ' sesión(es) de estudio atrasada(s)', ruta: '#/estudio' });
    store.all('readings').filter(r => r.fecha_limite && r.fecha_limite < todayISO() && r.paginas_leidas < r.paginas_total).forEach(r =>
      out.push({ nivel: 'warn', txt: 'Lectura atrasada: ' + r.titulo, ruta: '#/asignatura/' + r.subject_id }));
    store.all('person_events').filter(p => p.tipo === 'licencia' && p.hasta && p.hasta >= todayISO() && p.desde <= todayISO()).forEach(p => {
      const per = store.get('people', p.person_id);
      out.push({ nivel: 'info', txt: (per?.nombre || 'Persona') + ' con licencia hasta el ' + fmtFecha(p.hasta), ruta: '#/marca/' + (per?.brand_id || '') });
    });
    const filtradas = out.filter(a => {
      if (UI.space === 'todo') return true;
      if (UI.space === 'trabajo') return !/evaluación|sesión|lectura|Prueba|Control|Examen/i.test(a.txt) || /marca|tienda|Sin respuesta/i.test(a.txt);
      if (UI.space === 'universidad') return /evaluac|sesión|lectura|Prueba|Control|Examen|Trabajo|Presentación/i.test(a.txt);
      return false;
    });
    return (UI.space === 'personal' ? out.filter(a => a.nivel === 'critico' && /vencida/.test(a.txt)) : filtradas).slice(0, 8);
  },
  avanceSemanal() {
    const ini = addDays(todayISO(), -(dayOfWeek(todayISO()) === 0 ? 6 : dayOfWeek(todayISO()) - 1));
    const fin = addDays(ini, 6);
    const compl = store.all('tasks').filter(t => t.estado === 'completada' && t.completed_at &&
      String(t.completed_at).slice(0, 10) >= ini && String(t.completed_at).slice(0, 10) <= fin && Q.enEspacio(t)).length;
    const abiertas = Q.tareas({ abiertas: true }).length;
    const ses = store.all('study_sessions').filter(s => s.fecha >= ini && s.fecha <= fin);
    const sesOk = ses.filter(s => s.estado === 'completada').length;
    const min = ses.reduce((a, s) => a + (s.minutos_efectivos || 0), 0);
    return { ini, fin, compl, abiertas, ses: ses.length, sesOk, min,
             pct: (compl + abiertas) ? Math.round(compl / (compl + abiertas) * 100) : 0 };
  }
};

/* ==========================================================================
   6b. MOTOR ACADÉMICO
   Escala de notas configurable, avance por unidad, temas débiles y realismo
   del plan de estudio. Todo se calcula sobre tus datos: nada se estima solo.
   ========================================================================== */
const Academico = {
  /** Escala vigente. Por defecto la chilena, pero es configurable. */
  escala() {
    const e = DB.profile.escala || {};
    return {
      min: Number(e.min != null ? e.min : 1),
      max: Number(e.max != null ? e.max : 7),
      aprobacion: Number(e.aprobacion != null ? e.aprobacion : (DB.profile.nota_aprobacion || 4)),
      decimales: Number(e.decimales != null ? e.decimales : 1),
      nombre: e.nombre || 'Escala chilena 1,0 – 7,0'
    };
  },
  fmtNota(n) {
    if (n == null || n === '' || isNaN(n)) return '—';
    return fmtNum(n, this.escala().decimales);
  },
  aprueba(n) { return n != null && Number(n) >= this.escala().aprobacion; },

  /** Promedio ponderado con lo ya calificado. */
  promedio(subjectId) {
    const evs = store.where('evaluations', e => e.subject_id === subjectId && e.nota != null);
    const peso = evs.reduce((a, e) => a + Number(e.ponderacion || 0), 0);
    if (!peso) return { promedio: null, ponderacion: 0 };
    return { promedio: evs.reduce((a, e) => a + Number(e.nota) * Number(e.ponderacion), 0) / peso, ponderacion: peso };
  },

  /** Nota necesaria en lo que falta para alcanzar una meta. */
  notaNecesaria(subjectId, meta) {
    const objetivo = meta != null ? Number(meta) : this.escala().aprobacion;
    const evs = store.where('evaluations', e => e.subject_id === subjectId);
    const acum = evs.filter(e => e.nota != null)
      .reduce((a, e) => a + Number(e.nota) * Number(e.ponderacion) / 100, 0);
    const restante = evs.filter(e => e.nota == null).reduce((a, e) => a + Number(e.ponderacion || 0), 0) / 100;
    if (restante <= 0) return null;
    return (objetivo - acum) / restante;
  },

  /** ¿Es alcanzable esa nota con la escala vigente? */
  alcanzable(nota) { return nota != null && nota <= this.escala().max + 0.001; },

  /** Ponderación total declarada de una asignatura. */
  ponderacionTotal(subjectId) {
    return store.where('evaluations', e => e.subject_id === subjectId)
      .reduce((a, e) => a + Number(e.ponderacion || 0), 0);
  },

  /* ------------------------------------------------------------ Unidades - */
  /** Avance de una unidad cruzando dominio declarado y aciertos de repaso. */
  avanceUnidad(unitId) {
    const u = store.get('units', unitId);
    if (!u) return null;
    const intentos = store.where('review_attempts', r => r.unit_id === unitId);
    const aciertos = intentos.filter(r => r.resultado === 'correcto').length;
    const minutos = store.where('study_sessions', s => s.unit_id === unitId)
      .reduce((a, s) => a + (s.minutos_efectivos || 0), 0);
    return {
      unidad: u,
      dominioPct: DOMINIO[u.dominio].pct,
      intentos: intentos.length,
      aciertos,
      precision: intentos.length ? Math.round(aciertos * 100 / intentos.length) : null,
      minutos
    };
  },

  /** Ranking de temas que conviene reforzar. Score alto = más urgente. */
  temasDebiles(subjectId, limite) {
    return store.where('units', u => !subjectId || u.subject_id === subjectId)
      .map(u => this.avanceUnidad(u.id))
      .filter(x => x && x.dominioPct < 100)
      .map(x => {
        const ev = store.where('evaluations', e => e.subject_id === x.unidad.subject_id && e.estado === 'pendiente' && e.fecha)
          .sort(by('fecha'))[0];
        const dias = ev ? diffDays(ev.fecha, todayISO()) : null;
        const score = (100 - x.dominioPct) * 0.5
          + (x.unidad.dificultad || 3) * 8
          + (x.precision == null ? 40 : (100 - x.precision)) * 0.4
          + (x.minutos === 0 ? 15 : 0)
          + (dias != null && dias >= 0 && dias <= 10 ? (10 - dias) * 2 : 0);
        return Object.assign({}, x, { score: Math.round(score), evaluacion: ev, diasEval: dias });
      })
      .sort((a, b) => b.score - a.score)
      .slice(0, limite || 8);
  },

  /* ---------------------------------------------------- Tiempo de estudio */
  semana(offset) {
    const hoy = todayISO();
    const lunes = addDays(hoy, -((dayOfWeek(hoy) + 6) % 7) + (offset || 0) * 7);
    return { ini: lunes, fin: addDays(lunes, 6) };
  },
  horasSemana(offset) {
    const { ini, fin } = this.semana(offset);
    const ses = store.all('study_sessions').filter(s => s.fecha >= ini && s.fecha <= fin);
    const min = ses.reduce((a, s) => a + (s.minutos_efectivos || 0), 0);
    const meta = Number(DB.profile.meta_semanal_min || 480);
    return {
      ini, fin, minutos: min, sesiones: ses.length,
      hechas: ses.filter(s => s.estado === 'completada').length,
      pausas: ses.reduce((a, s) => a + (s.pausas || 0), 0),
      meta, pct: meta ? Math.min(100, Math.round(min / meta * 100)) : 0
    };
  },

  /* ------------------------------------------------------------ Lecturas - */
  minutosLectura(r) {
    const faltan = Math.max(0, (r.paginas_total || 0) - (r.paginas_leidas || 0));
    return Math.round(faltan * Number(r.min_por_pagina || 2.5));
  },
  avanceLectura(r) {
    return r.paginas_total ? Math.round((r.paginas_leidas || 0) / r.paginas_total * 100) : 0;
  },

  /* ------------------------------------------------- Realismo de un plan - */
  /**
   * Compara las horas que exige el plan con las que realmente tienes libres
   * según tu disponibilidad, descontando clases y bloques ya ocupados.
   */
  realismo(fechaObjetivo, minutosNecesarios, desde) {
    const inicio = desde || todayISO();
    const dias = Math.max(0, diffDays(fechaObjetivo, inicio));
    const disp = DB.profile.disponibilidad_estudio || [];
    let disponible = 0;
    for (let i = 0; i <= dias; i++) {
      const fecha = addDays(inicio, i);
      if (fecha >= fechaObjetivo) break;
      const d = dayOfWeek(fecha);
      disp.filter(x => Number(x.dia) === d).forEach(v => {
        const largo = (Number(v.fin.slice(0, 2)) * 60 + Number(v.fin.slice(3, 5))) -
                      (Number(v.inicio.slice(0, 2)) * 60 + Number(v.inicio.slice(3, 5)));
        disponible += Math.max(0, largo);
      });
      /* Se descuenta lo que ya está comprometido ese día. */
      store.all('events').filter(e => String(e.inicio).slice(0, 10) === fecha && e.tipo === 'clase')
        .forEach(e => { disponible -= e.fin ? Math.max(0, (parseNaive(e.fin) - parseNaive(e.inicio)) / 60000) : 90; });
      store.all('study_sessions').filter(s => s.fecha === fecha && s.estado === 'pendiente')
        .forEach(s => { disponible -= s.duracion_min || 60; });
    }
    disponible = Math.max(0, Math.round(disponible));
    const holgura = disponible - minutosNecesarios;
    const ratio = minutosNecesarios ? disponible / minutosNecesarios : 2;
    return {
      dias, disponible, necesario: minutosNecesarios, holgura, ratio,
      nivel: ratio >= 1.4 ? 'holgado' : ratio >= 1 ? 'ajustado' : 'irreal',
      mensaje: ratio >= 1.4
        ? 'El plan cabe con holgura en tu disponibilidad.'
        : ratio >= 1
          ? 'El plan cabe, pero justo: cualquier imprevisto te deja atrás.'
          : 'No alcanza. Necesitas más bloques disponibles, menos materia o empezar antes.'
    };
  },

  /** Minutos que exige cubrir un conjunto de unidades. */
  minutosPara(unidades) {
    return unidades.reduce((a, u) => {
      const falta = (100 - DOMINIO[u.dominio].pct) / 100;
      const base = (u.paginas ? u.paginas * 2.5 : 90);
      return a + Math.round(base * falta * (0.7 + (u.dificultad || 3) * 0.1));
    }, 0);
  },

  /* --------------------------------------------------------- Repaso ------ */
  /** Ítems que tocan hoy, ordenados por urgencia. */
  colaRepaso(filtro) {
    const hoy = todayISO();
    let items = store.all('flashcards').map(f => ({
      tipo: f.tipo === 'ficha' ? 'ficha' : f.tipo, item: f,
      vence: f.proxima_revision || hoy, subject_id: f.subject_id, unit_id: f.unit_id
    }));
    if (filtro && filtro.subject_id) items = items.filter(x => x.subject_id === filtro.subject_id);
    if (filtro && filtro.unit_id) items = items.filter(x => x.unit_id === filtro.unit_id);
    if (filtro && filtro.tipo) items = items.filter(x => x.tipo === filtro.tipo);
    if (filtro && filtro.debiles) {
      const ids = this.temasDebiles(filtro.subject_id, 5).map(t => t.unidad.id);
      items = items.filter(x => ids.includes(x.unit_id));
    }
    return items.filter(x => !x.vence || x.vence <= hoy).sort((a, b) => (a.vence > b.vence ? 1 : -1));
  },

  /** Repetición espaciada simple: 1 → 3 → 7 → 14 → 30 días. */
  responder(ficha, resultado, segundos) {
    const pasos = [1, 3, 7, 14, 30];
    const actual = pasos.indexOf(ficha.intervalo_dias);
    const acerto = resultado === 'correcto';
    const idx = acerto ? Math.min(pasos.length - 1, (actual < 0 ? 0 : actual) + 1) : 0;
    const dominio = acerto
      ? (ficha.dominio === 'no_estudiado' ? 'inicial' : ficha.dominio === 'inicial' ? 'en_progreso' : 'dominado')
      : 'inicial';
    store.update('flashcards', ficha.id, {
      aciertos: (ficha.aciertos || 0) + (acerto ? 1 : 0),
      fallos: (ficha.fallos || 0) + (acerto ? 0 : 1),
      intervalo_dias: pasos[idx], dominio,
      proxima_revision: addDays(todayISO(), pasos[idx])
    });
    store.insert('review_attempts', {
      item_tipo: ficha.tipo === 'ficha' ? 'flashcard' : 'practice_question', item_id: ficha.id,
      subject_id: ficha.subject_id, unit_id: ficha.unit_id, resultado,
      segundos: Math.max(0, Math.round(segundos || 0)), respondida_en: nowNaive()
    });
    return pasos[idx];
  },

  /** Resumen de aciertos por asignatura. */
  precisionPorAsignatura() {
    const out = {};
    store.all('review_attempts').forEach(r => {
      const k = r.subject_id || 'sin';
      out[k] = out[k] || { intentos: 0, aciertos: 0 };
      out[k].intentos++;
      if (r.resultado === 'correcto') out[k].aciertos++;
    });
    Object.keys(out).forEach(k => { out[k].pct = Math.round(out[k].aciertos * 100 / out[k].intentos); });
    return out;
  }
};

/* --- Acciones de dominio -------------------------------------------------- */
const Acciones = {
  completarTarea(id) {
    const t = store.get('tasks', id); if (!t) return;
    const nuevo = t.estado === 'completada' ? 'pendiente' : 'completada';
    store.update('tasks', id, { estado: nuevo, completed_at: nuevo === 'completada' ? nowNaive() : null });
    if (nuevo === 'completada' && t.recurrencia && t.recurrencia !== 'ninguna' && t.due_at) {
      const salto = { diaria: 1, semanal: 7, quincenal: 14, mensual: 30, dias_habiles: 1 }[t.recurrencia] || 1;
      let next = addDays(t.due_at, salto);
      if (t.recurrencia === 'dias_habiles') while ([0, 6].includes(dayOfWeek(next))) next = addDays(next, 1);
      const copia = Object.assign({}, t, { id: undefined, estado: 'pendiente', completed_at: null, due_at: next,
        checklist: (t.checklist || []).map(c => ({ texto: c.texto, hecho: false })) });
      delete copia.id;
      store.insert('tasks', copia);
      toast('Tarea completada. Se creó la próxima para el ' + fmtFecha(next));
    } else {
      toast(nuevo === 'completada' ? 'Tarea completada' : 'Tarea reabierta');
    }
    render();
  },
  duplicarTarea(id) {
    const t = store.get('tasks', id); if (!t) return;
    const c = Object.assign({}, t); delete c.id; delete c.created_at; delete c.updated_at;
    c.titulo = t.titulo + ' (copia)'; c.estado = 'pendiente'; c.completed_at = null;
    store.insert('tasks', c); toast('Tarea duplicada'); render();
  },
  eliminar(tabla, id, etiqueta) {
    confirmar('¿Eliminar ' + etiqueta + '? Esta acción no se puede deshacer.', () => {
      if (tabla === 'tasks') store.where('tasks', t => t.parent_id === id).forEach(s => store.remove('tasks', s.id));
      store.remove(tabla, id); toast('Eliminado'); render();
    });
  },
  completarSesion(id) {
    const s = store.get('study_sessions', id); if (!s) return;
    store.update('study_sessions', id, { estado: s.estado === 'completada' ? 'pendiente' : 'completada',
      minutos_efectivos: s.estado === 'completada' ? 0 : (s.minutos_efectivos || s.duracion_min) });
    render();
  },
  reprogramarAtrasadas() {
    const atr = Q.sesionesAtrasadas();
    if (!atr.length) return toast('No hay sesiones atrasadas');
    confirmar('Se reprogramarán ' + atr.length + ' sesión(es) a partir de hoy, respetando tu disponibilidad. ¿Continuar?', () => {
      const libres = Planificador.slotsLibres(todayISO(), 21, atr.length);
      atr.forEach((s, i) => {
        const slot = libres[i] || { fecha: addDays(todayISO(), i + 1), hora: '20:30' };
        store.update('study_sessions', s.id, { fecha: slot.fecha, hora: slot.hora, estado: 'pendiente' });
      });
      toast(atr.length + ' sesión(es) reprogramada(s)'); render();
    });
  }
};

/* --- Toast --------------------------------------------------------------- */
function toast(msg, tipo = 'ok') {
  const root = document.getElementById('toast-root');
  if (!root) return;
  const el = document.createElement('div');
  const estilos = {
    ok:    { cls: 'bg-ink-900 text-white dark:bg-white dark:text-ink-900', ic: 'ok' },
    exito: { cls: 'bg-okc-500 text-white', ic: 'ok' },
    warn:  { cls: 'bg-warnc-500 text-white', ic: 'alerta' },
    error: { cls: 'bg-critc-500 text-white', ic: 'alerta' }
  };
  const e = estilos[tipo] || estilos.ok;
  el.className = 'pointer-events-auto w-full flex items-center gap-2.5 text-[13px] font-medium px-4 py-3 rounded-xl2 shadow-pop rise ' + e.cls;
  el.setAttribute('role', tipo === 'error' ? 'alert' : 'status');
  el.innerHTML = ico(e.ic, 17) + '<span class="min-w-0 flex-1">' + esc(msg) + '</span>';
  root.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(6px)'; el.style.transition = 'opacity .25s, transform .25s'; setTimeout(() => el.remove(), 280); }, 2800);
}

/* --- Constructor de formularios ------------------------------------------ */
const INP = 'w-full rounded-lg border border-ink-300 dark:border-ink-700 bg-white dark:bg-ink-850 px-3 py-2.5 text-[14px] text-ink-800 dark:text-ink-100 placeholder:text-ink-400 focus-ring transition-colors hover:border-ink-400 dark:hover:border-ink-600';
const LBL = 'block text-[12px] font-medium text-ink-600 dark:text-ink-400 mb-1.5';
function campoHTML(f, v) {
  const k = 'f_' + f.k;
  const val = v == null ? '' : v;
  let inner = '';
  if (f.type === 'textarea') inner = '<textarea id="' + k + '" rows="' + (f.rows || 3) + '" class="' + INP + '" placeholder="' + esc(f.ph || '') + '">' + esc(val) + '</textarea>';
  else if (f.type === 'select') inner = '<select id="' + k + '" class="' + INP + '">' +
      (f.opts || []).map(o => '<option value="' + esc(o.v) + '"' + (String(o.v) === String(val) ? ' selected' : '') + '>' + esc(o.l) + '</option>').join('') + '</select>';
  else if (f.type === 'checkbox') inner = '<label class="flex items-start gap-2.5 text-[13px] p-3 rounded-lg border border-ink-200 dark:border-ink-800 bg-ink-50 dark:bg-ink-850 cursor-pointer">' +
      '<input type="checkbox" id="' + k + '" class="rounded focus-ring w-4 h-4 mt-0.5 accent-current"' + (val ? ' checked' : '') + '>' +
      '<span><span class="font-medium">' + esc(f.label) + '</span>' + (f.hint ? '<span class="block text-[11.5px] text-ink-500 dark:text-ink-400 mt-0.5">' + esc(f.hint) + '</span>' : '') + '</span></label>';
  else if (f.type === 'tags') inner = '<input id="' + k + '" class="' + INP + '" value="' + esc(Array.isArray(val) ? val.join(', ') : val) + '" placeholder="separadas por coma">';
  else if (f.type === 'checklist') inner = '<textarea id="' + k + '" rows="' + (f.rows || 4) + '" class="' + INP + '" placeholder="Una línea por ítem">' +
      esc((Array.isArray(val) ? val : []).map(c => (c.hecho ? '[x] ' : '') + c.texto).join('\n')) + '</textarea>';
  else if (f.type === 'links') inner = '<textarea id="' + k + '" rows="' + (f.rows || 3) + '" class="' + INP + '" placeholder="Título | https://...">' +
      esc((Array.isArray(val) ? val : []).map(l => l.titulo + ' | ' + (l.url || '')).join('\n')) + '</textarea>';
  else inner = '<input type="' + (f.type || 'text') + '" id="' + k + '" class="' + INP + '" value="' + esc(val) + '"' +
      (f.step ? ' step="' + f.step + '"' : '') + (f.min != null ? ' min="' + f.min + '"' : '') + (f.max != null ? ' max="' + f.max + '"' : '') +
      ' placeholder="' + esc(f.ph || '') + '">';
  return '<div class="' + (f.col === 2 ? 'sm:col-span-2' : '') + '">' +
    (f.type === 'checkbox' ? '' : '<label class="' + LBL + '" for="' + k + '">' + esc(f.label) +
      (f.req ? ' <span class="text-critc-500" aria-hidden="true">*</span><span class="sr-only">obligatorio</span>' : '') + '</label>') +
    inner + (f.hint && f.type !== 'checkbox' ? '<p class="text-[11.5px] text-ink-500 dark:text-ink-400 mt-1.5 leading-snug">' + esc(f.hint) + '</p>' : '') + '</div>';
}
function leerCampo(f) {
  const el = document.getElementById('f_' + f.k); if (!el) return undefined;
  if (f.type === 'checkbox') return el.checked;
  if (f.type === 'number') return el.value === '' ? null : Number(el.value);
  if (f.type === 'tags') return el.value.split(',').map(s => s.trim()).filter(Boolean);
  if (f.type === 'checklist') return el.value.split('\n').map(s => s.trim()).filter(Boolean)
    .map(s => ({ texto: s.replace(/^\[x\]\s*/i, ''), hecho: /^\[x\]/i.test(s) }));
  if (f.type === 'links') return el.value.split('\n').map(s => s.trim()).filter(Boolean)
    .map(s => { const p = s.split('|'); return { titulo: (p[0] || '').trim(), url: (p[1] || '').trim() }; });
  return el.value;
}
function openForm({ title, fields, values = {}, onSave, ancho = 'max-w-2xl', nota = '', sub = '', guardar = 'Guardar' }) {
  const cuerpo =
    (nota ? '<div class="flex gap-2.5 items-start text-[12px] leading-relaxed text-ink-600 dark:text-ink-300 mb-4 p-3 rounded-xl bg-ink-100/70 dark:bg-ink-850 border border-ink-200 dark:border-ink-800">' +
      '<span class="text-ink-400 mt-px">' + ico('info', 15) + '</span><span>' + nota + '</span></div>' : '') +
    '<div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-3.5">' + fields.map(f => campoHTML(f, values[f.k])).join('') + '</div>';
  abrirModal(title, cuerpo,
    btn('Cancelar', 'modal-cerrar', '', BTN.secundario + ' w-full sm:w-auto') +
    btn(ico('check', 16) + guardar, 'modal-ok', '', BTN.primario + ' w-full sm:w-auto'),
    ancho, sub);
  modalOnSave = () => {
    const out = {};
    const marcar = (f, mensaje) => {
      toast(mensaje, 'warn');
      const el = document.getElementById('f_' + f.k);
      if (el) { el.classList.add('border-critc-500'); el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    };
    for (const f of fields) {
      const v = leerCampo(f);
      if (f.req && (v === '' || v == null)) { marcar(f, 'Falta completar: ' + f.label); return; }
      /* Validaciones de formato equivalentes a las CHECK de la base. */
      if (v !== '' && v != null) {
        if (f.type === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(v))) {
          return marcar(f, f.label + ': el correo no tiene un formato válido');
        }
        if ((f.type === 'url' || /enlace|url/i.test(f.k)) && !/^https?:\/\/[^\s]+\.[^\s]+/.test(String(v))) {
          return marcar(f, f.label + ': debe empezar con https:// y ser una dirección válida');
        }
        if (f.type === 'number') {
          const n = Number(v);
          if (isNaN(n)) return marcar(f, f.label + ': debe ser un número');
          if (f.min != null && n < f.min) return marcar(f, f.label + ': el mínimo es ' + f.min);
          if (f.max != null && n > f.max) return marcar(f, f.label + ': el máximo es ' + f.max);
        }
        if (f.maxLargo && String(v).length > f.maxLargo) {
          return marcar(f, f.label + ': máximo ' + f.maxLargo + ' caracteres');
        }
      }
      out[f.k] = v;
    }
    cerrarModal(); onSave(out);
  };
}

/* ==========================================================================
   8b. BUSCADOR GLOBAL
   ========================================================================== */
function buscarGlobal(q) {
  const s = slug(q);
  if (s.length < 2) return [];
  const out = [];
  const push = (tipo, icono, titulo, sub, ruta, accion) => out.push({ tipo, icono, titulo, sub, ruta, accion });
  const coincide = (txt) => slug(txt || '').includes(s);

  store.all('tasks').filter(t => !t.parent_id && coincide(t.titulo + ' ' + (t.descripcion || '') + ' ' + (t.categoria || '')))
    .slice(0, 6).forEach(t => push('Tarea', 'tareas', t.titulo,
      AREAS[t.area].label + (Q.contexto(t) ? ' · ' + Q.contexto(t) : '') + (t.due_at ? ' · ' + fmtRelativo(t.due_at) : ''), '', 'ver-tarea|' + t.id));
  store.all('events').filter(e => coincide(e.titulo + ' ' + (e.objetivo || '') + ' ' + (e.lugar || '')))
    .slice(0, 5).forEach(e => push('Evento', 'agenda', e.titulo, TIPO_EVENTO[e.tipo].label + ' · ' + fmtFechaHora(e.inicio), '', 'ver-evento|' + e.id));
  store.all('brands').filter(b => coincide(b.nombre + ' ' + (b.cliente || '')))
    .forEach(b => push('Marca', 'marca', b.nombre, (b.cliente || '') + ' · ' + SEMAFORO[b.estado].label, '#/marca/' + b.id));
  store.all('subjects').filter(x => coincide(x.nombre + ' ' + (x.profesor || '')))
    .forEach(x => push('Asignatura', 'universidad', x.nombre, x.profesor || '', '#/asignatura/' + x.id));
  store.all('notes').filter(n => coincide(n.titulo + ' ' + (n.contenido || '') + ' ' + (n.etiquetas || []).join(' ')))
    .slice(0, 5).forEach(n => push('Nota', 'notas', n.titulo, AREAS[n.area].label + (Q.contexto(n) ? ' · ' + Q.contexto(n) : ''), '', 'ver-nota|' + n.id));
  store.all('glossary').filter(g => coincide(g.termino + ' ' + g.definicion))
    .slice(0, 5).forEach(g => push('Concepto', 'libro', g.termino, (Q.nombreSubject(g.subject_id) || '') + (g.verificado ? ' · verificado' : ' · sin verificar'), '#/universidad'));
  store.all('evaluations').filter(e => coincide(e.titulo + ' ' + (e.temario || '')))
    .slice(0, 5).forEach(e => push('Evaluación', 'evaluacion', e.titulo, Q.nombreSubject(e.subject_id) + ' · ' + (e.fecha ? fmtFecha(e.fecha) : 'sin fecha'), '#/asignatura/' + e.subject_id));
  store.all('legal_sources').filter(f => coincide(f.identificador + ' ' + (f.titulo || '') + ' ' + (f.materia || '')))
    .slice(0, 4).forEach(f => push('Fuente', 'libro', f.identificador, (f.materia || '') + (f.verificado ? ' · verificado' : ' · sin verificar'), '#/universidad'));
  store.all('cases').filter(c => coincide(c.titulo + ' ' + (c.problema || '')))
    .slice(0, 4).forEach(c => push('Caso', 'evaluacion', c.titulo, Q.nombreSubject(c.subject_id) || '', '', 'ver-caso|' + c.id));
  store.all('people').filter(x => coincide(x.nombre))
    .slice(0, 5).forEach(x => push('Persona', 'persona', x.nombre, (x.rol || '') + ' · ' + Q.nombreBrand(x.brand_id), '#/marca/' + x.brand_id));
  return out.slice(0, 24);
}
function pintarResultados(q) {
  const res = buscarGlobal(q);
  if (!q || slug(q).length < 2) {
    const sug = ['Trauko', 'Derecho Civil', 'reporte', 'licencia', 'jurisdicción'];
    return '<p class="text-[12px] text-ink-500 dark:text-ink-400 mb-2">Busca tareas, eventos, marcas, asignaturas, notas, conceptos, fuentes y personas.</p>' +
      '<div class="flex flex-wrap gap-1.5">' + sug.map(x =>
        '<button type="button" data-act="bg-sug" data-txt="' + esc(x) + '" class="press focus-ring text-[12px] px-2.5 py-1.5 rounded-lg bg-ink-100 dark:bg-ink-850 text-ink-600 dark:text-ink-300 hover:bg-ink-200 dark:hover:bg-ink-800">' + esc(x) + '</button>').join('') + '</div>';
  }
  if (!res.length) return vacio('Sin resultados', 'No encontré nada con “' + q + '”. Prueba con otra palabra.', '', 'buscar');
  return '<p class="text-[11.5px] text-ink-500 dark:text-ink-400 mb-2 tnum">' + res.length + ' resultado(s)</p>' +
    '<div class="flex flex-col gap-1">' + res.map(r =>
      '<button type="button" data-act="bg-ir" data-ruta="' + esc(r.ruta || '') + '" data-accion="' + esc(r.accion || '') + '" ' +
      'class="press focus-ring w-full text-left flex items-center gap-3 p-2.5 rounded-xl hover:bg-ink-100 dark:hover:bg-ink-850">' +
        '<span class="w-8 h-8 shrink-0 rounded-lg grid place-items-center bg-ink-100 dark:bg-ink-800 text-ink-500 dark:text-ink-400">' + ico(r.icono, 16) + '</span>' +
        '<span class="min-w-0 flex-1"><span class="block text-[13.5px] font-medium truncate">' + esc(r.titulo) + '</span>' +
        '<span class="block text-[11.5px] text-ink-500 dark:text-ink-400 truncate">' + esc(r.sub || '') + '</span></span>' +
        badge(r.tipo, 'bg-ink-100 dark:bg-ink-800 text-ink-500 dark:text-ink-400') +
      '</button>').join('') + '</div>';
}

function ejecutarRapido(k) {
  cerrarModal();
  const hoy = todayISO();
  switch (k) {
    case 'tarea_trabajo': formTarea(null, { area: 'trabajo' }); break;
    case 'tarea_uni':     formTarea(null, { area: 'universidad' }); break;
    case 'reunion':       formEvento(null, { area: 'trabajo', tipo: 'reunion', inicio: hoy + 'T10:00' }); break;
    case 'evaluacion': {
      const s = store.all('subjects')[0];
      if (!s) { toast('Primero crea una asignatura', 'warn'); return formAsignatura(null); }
      formEvaluacion(null, s.id); break;
    }
    case 'sesion':        formSesion(null, { fecha: hoy }); break;
    case 'nota':          formNota(null); break;
    case 'novedad': {
      const gente = store.all('people');
      if (!gente.length) { toast('Primero registra a alguien del equipo', 'warn'); return; }
      openForm({
        title: 'Registrar novedad', ancho: 'max-w-md',
        nota: 'Solo se guardan tipo y fechas. No registres diagnósticos ni datos sensibles.',
        fields: [{ k: 'person_id', label: 'Persona', type: 'select', req: true, col: 2,
          opts: gente.map(p => ({ v: p.id, l: p.nombre + ' — ' + (Q.nombreBrand(p.brand_id) || 'sin marca') })) }],
        values: { person_id: gente[0].id },
        onSave(d) { formNovedad(d.person_id); }
      });
      break;
    }
    case 'personal':      formEvento(null, { area: 'personal', tipo: 'personal', inicio: hoy + 'T19:00' }); break;
  }
}


/* ==========================================================================
   8d. AUTENTICACIÓN — pantallas de cuenta
   ========================================================================== */
function campoAuth(id, etiqueta, tipo, valor, extra) {
  return '<div class="mb-3"><label class="' + LBL + '" for="' + id + '">' + esc(etiqueta) + '</label>' +
    '<input id="' + id + '" type="' + tipo + '" value="' + esc(valor || '') + '" ' + (extra || '') + ' class="' + INP + '"></div>';
}
function avisoAuth(texto, tono) {
  const c = tono === 'error' ? 'bg-critc-50 dark:bg-critc-500/15 text-critc-700 dark:text-critc-200 border-critc-200 dark:border-critc-500/30'
    : tono === 'ok' ? 'bg-okc-50 dark:bg-okc-500/15 text-okc-700 dark:text-okc-200 border-okc-200 dark:border-okc-500/30'
    : 'bg-ink-100/70 dark:bg-ink-850 text-ink-600 dark:text-ink-300 border-ink-200 dark:border-ink-800';
  return '<div id="auth-aviso" class="flex gap-2.5 items-start text-[12.5px] leading-relaxed p-3 rounded-xl border mb-3 ' + c + '">' +
    ico(tono === 'error' ? 'alerta' : tono === 'ok' ? 'ok' : 'info', 15) + '<span>' + texto + '</span></div>';
}
function mostrarAviso(texto, tono) {
  const cont = document.getElementById('auth-cont');
  if (!cont) return toast(texto, tono === 'ok' ? 'exito' : 'error');
  const previo = document.getElementById('auth-aviso');
  if (previo) previo.remove();
  cont.insertAdjacentHTML('afterbegin', avisoAuth(esc(texto), tono));
}
function cargandoBoton(cargando) {
  const b = document.querySelector('#modal-root [data-act="modal-ok"]');
  if (!b) return;
  b.disabled = cargando;
  b.style.opacity = cargando ? '0.6' : '';
  b.style.pointerEvents = cargando ? 'none' : '';
  if (cargando) { b.dataset.txt = b.innerHTML; b.innerHTML = '<span class="skel w-4 h-4 rounded-full"></span> Procesando…'; }
  else if (b.dataset.txt) b.innerHTML = b.dataset.txt;
}

/** Pantalla de cuenta: entrar, crear cuenta o recuperar contraseña. */
function abrirAuth(modo) {
  UI.authModo = modo || UI.authModo || 'entrar';
  const m = UI.authModo;
  if (!Nube.configurado) return abrirConexion();

  const tabs = [['entrar', 'Iniciar sesión'], ['registro', 'Crear cuenta'], ['recuperar', 'Recuperar']];
  const email = esc(DB.profile.email || '');

  let cuerpo = '<div id="auth-cont">' +
    barraTabs(tabs, m, 'auth-tab', 'mb-4');

  if (m === 'entrar') {
    cuerpo += campoAuth('au-mail', 'Correo', 'email', email, 'autocomplete="username"') +
      campoAuth('au-pass', 'Contraseña', 'password', '', 'autocomplete="current-password"') +
      '<button type="button" data-act="auth-tab" data-v="recuperar" class="' + BTN.enlace + '">¿Olvidaste tu contraseña?</button>';
  } else if (m === 'registro') {
    cuerpo += campoAuth('au-nombre', 'Tu nombre', 'text', esc(DB.profile.nombre || ''), 'autocomplete="name"') +
      campoAuth('au-mail', 'Correo', 'email', email, 'autocomplete="username"') +
      campoAuth('au-pass', 'Contraseña', 'password', '', 'autocomplete="new-password"') +
      '<p class="text-[11.5px] text-ink-500 dark:text-ink-400 -mt-1">Mínimo 8 caracteres, con al menos una letra y un número.</p>';
  } else {
    cuerpo += avisoAuth('Te enviaremos un enlace para crear una contraseña nueva. Ábrelo en este mismo navegador.', 'info') +
      campoAuth('au-mail', 'Correo de tu cuenta', 'email', email, 'autocomplete="username"');
  }

  cuerpo += '<p class="text-[11.5px] text-ink-500 dark:text-ink-400 mt-4 pt-3 border-t border-ink-200 dark:border-ink-800">' +
    'Conectado a <span class="font-medium">' + esc((Nube.cfg && Nube.cfg.url || '').replace(/^https?:\/\//, '')) + '</span>. ' +
    'Tus datos quedan aislados por Row Level Security.</p></div>';

  const etiquetas = { entrar: 'Entrar', registro: 'Crear cuenta', recuperar: 'Enviar enlace' };
  abrirModal('Tu cuenta de Nexo', cuerpo,
    btn('Cancelar', 'modal-cerrar', '', BTN.secundario + ' w-full sm:w-auto') +
    btn(etiquetas[m], 'modal-ok', '', BTN.primario + ' w-full sm:w-auto'),
    'max-w-md', 'La sesión queda guardada en este navegador');

  modalOnSave = async () => {
    const val = (id) => (document.getElementById(id) || {}).value || '';
    try {
      cargandoBoton(true);
      if (m === 'recuperar') {
        await Nube.recuperar(val('au-mail'));
        cerrarModal();
        toast('Te enviamos el enlace. Revisa tu correo.', 'exito');
      } else if (m === 'registro') {
        const r = await Nube.registrar(val('au-mail'), val('au-pass'), val('au-nombre'));
        DB.profile.nombre = val('au-nombre') || DB.profile.nombre;
        DB.profile.email = val('au-mail'); saveDB();
        cerrarModal();
        if (r.requiereConfirmacion) {
          abrirModal('Confirma tu correo',
            avisoAuth('Te enviamos un correo a <strong>' + esc(val('au-mail')) + '</strong>. Ábrelo para activar la cuenta y luego vuelve a iniciar sesión.', 'ok') +
            '<p class="text-[12.5px] text-ink-500 dark:text-ink-400">Si no llega en unos minutos, revisa la carpeta de spam.</p>',
            btn('Reenviar correo', 'auth-reenviar', 'data-mail="' + esc(val('au-mail')) + '"', BTN.secundario) +
            btn('Entendido', 'modal-cerrar', '', BTN.primario), 'max-w-md');
        } else {
          toast('Cuenta creada. Sesión iniciada.', 'exito');
          abrirPrimeraSincronizacion();
        }
      } else {
        await Nube.entrar(val('au-mail'), val('au-pass'));
        DB.profile.email = val('au-mail'); saveDB();
        cerrarModal();
        toast('Sesión iniciada', 'exito');
        abrirPrimeraSincronizacion();
      }
      render();
    } catch (e) {
      cargandoBoton(false);
      mostrarAviso(mensajeAuth(e), 'error');
    }
  };
  setTimeout(() => { const f = document.getElementById(m === 'registro' ? 'au-nombre' : 'au-mail'); if (f) f.focus(); }, 80);
}

/** Traduce los errores de Supabase a español. */
function mensajeAuth(e) {
  const t = String((e && e.message) || e || '');
  if (/invalid login credentials/i.test(t)) return 'Correo o contraseña incorrectos.';
  if (/email not confirmed/i.test(t)) return 'Tienes que confirmar tu correo antes de entrar.';
  if (/user already registered/i.test(t)) return 'Ya existe una cuenta con ese correo. Prueba iniciar sesión.';
  if (/password should be at least|at least 8/i.test(t)) return 'La contraseña debe tener al menos 8 caracteres.';
  if (/weak password/i.test(t)) return 'La contraseña es demasiado débil. Combina letras, números y símbolos.';
  if (/rate limit|too many/i.test(t)) return 'Demasiados intentos. Espera un minuto y vuelve a probar.';
  if (/expired|invalid.*token/i.test(t)) return 'El enlace ya venció. Solicita uno nuevo.';
  if (/unable to validate email/i.test(t)) return 'El correo no tiene un formato válido.';
  if (/signups not allowed|disabled/i.test(t)) return 'El registro está deshabilitado en este proyecto de Supabase.';
  if (/failed to fetch|network/i.test(t)) return 'No pudimos conectarnos. Revisa la URL del proyecto y tu conexión.';
  if (/relation .* does not exist|schema cache/i.test(t)) return 'Falta ejecutar db/01-schema.sql en tu proyecto de Supabase.';
  if (/row-level security/i.test(t)) return 'La base rechazó la escritura. Verifica que ejecutaste el esquema completo.';
  return t || 'Ocurrió un error inesperado.';
}

/** Modal que aparece cuando el usuario llega desde el enlace de recuperación. */
function abrirNuevaClave() {
  abrirModal('Define tu nueva contraseña',
    '<div id="auth-cont">' + avisoAuth('Estás usando un enlace de recuperación. Elige una contraseña nueva para terminar.', 'info') +
    campoAuth('au-nueva', 'Nueva contraseña', 'password', '', 'autocomplete="new-password"') +
    campoAuth('au-nueva2', 'Repite la contraseña', 'password', '', 'autocomplete="new-password"') + '</div>',
    btn('Guardar contraseña', 'modal-ok', '', BTN.primario + ' w-full sm:w-auto'), 'max-w-md');
  modalOnSave = async () => {
    const a = (document.getElementById('au-nueva') || {}).value || '';
    const b = (document.getElementById('au-nueva2') || {}).value || '';
    if (a.length < 8) return mostrarAviso('La contraseña debe tener al menos 8 caracteres.', 'error');
    if (!/[a-zA-Z]/.test(a) || !/\d/.test(a)) return mostrarAviso('Incluye al menos una letra y un número.', 'error');
    if (a !== b) return mostrarAviso('Las dos contraseñas no coinciden.', 'error');
    try {
      cargandoBoton(true);
      await Nube.definirClave(a);
      cerrarModal(); toast('Contraseña actualizada', 'exito'); render();
    } catch (e) { cargandoBoton(false); mostrarAviso(mensajeAuth(e), 'error'); }
  };
}

/** Configuración de la conexión (URL + anon key). */
function abrirConexion() {
  const cfg = Nube.cfg || {};
  abrirModal('Conectar con Supabase',
    '<div id="auth-cont">' +
    avisoAuth('Crea tu proyecto y ejecuta <code class="px-1 rounded bg-ink-100 dark:bg-ink-800">db/01-schema.sql</code>. Después pega aquí los dos datos de <em>Project Settings → API</em>.', 'info') +
    campoAuth('sb-url2', 'Project URL', 'url', cfg.url || '', 'placeholder="https://xxxx.supabase.co"') +
    campoAuth('sb-key2', 'anon public key', 'text', cfg.key || '', 'placeholder="eyJhbGciOi…"') +
    '<p class="text-[11.5px] text-ink-500 dark:text-ink-400">La <strong>anon key</strong> es pública por diseño: quien protege los datos es Row Level Security. Nunca pegues la clave <code class="px-1 rounded bg-ink-100 dark:bg-ink-800">service_role</code>.</p></div>',
    btn('Cancelar', 'modal-cerrar', '', BTN.secundario + ' w-full sm:w-auto') +
    btn('Guardar y continuar', 'modal-ok', '', BTN.primario + ' w-full sm:w-auto'),
    'max-w-lg');
  modalOnSave = async () => {
    const url = (document.getElementById('sb-url2') || {}).value.trim();
    const key = (document.getElementById('sb-key2') || {}).value.trim();
    if (!url || !key) return mostrarAviso('Completa la URL y la anon key.', 'error');
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(url)) return mostrarAviso('La URL debe verse como https://xxxx.supabase.co', 'error');
    if (/service_role/i.test(key)) return mostrarAviso('Esa es la clave service_role. Usa la anon public.', 'error');
    cargandoBoton(true);
    Nube.saveCfg(url, key);
    const ok = await Nube.init();
    cerrarModal();
    if (ok) { toast('Conexión guardada', 'exito'); abrirAuth('entrar'); }
    else toast('No se pudo inicializar el cliente de Supabase', 'error');
    render();
