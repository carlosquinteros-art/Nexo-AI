Vistas.agenda = function () {
  const modo = UI.agendaVista || 'semana';
  const eventos = store.all('events').filter(Q.enEspacio);
  const ini = addDays(todayISO(), -(dayOfWeek(todayISO()) === 0 ? 6 : dayOfWeek(todayISO()) - 1) + (UI.semanaOffset || 0) * 7);
  const dias = Array.from({ length: 7 }, (_, i) => addDays(ini, i));

  const head =
    '<div class="flex items-center justify-between gap-2 mb-4">' +
      barraTabs([['semana','Semana','agenda'],['mes','Mes'],['lista','Lista']], modo, 'avista') + btn(ico('plus', 15) + 'Nuevo evento', 'nuevo-evento') +
    '</div>';

  if (modo === 'mes') return head + calendarioMes(eventos, 'inicio');

  if (modo === 'lista') {
    const prox = eventos.filter(e => e.inicio >= todayISO()).sort(by('inicio'));
    return head + card(cardTitulo('Próximos eventos') +
      (prox.length ? listaSep(prox.map(filaEvento)) : vacio('Agenda vacía', 'No hay eventos programados en este espacio.', btn('Agendar', 'nuevo-evento'))));
  }

  return head +
    '<div class="flex items-center justify-between mb-3">' +
      btnSec('‹ Semana anterior', 'semana', 'data-v="-1"') +
      '<p class="text-sm font-medium">' + fmtFecha(ini) + ' – ' + fmtFecha(addDays(ini, 6)) + '</p>' +
      btnSec('Semana siguiente ›', 'semana', 'data-v="1"') +
    '</div>' +
    '<div class="grid grid-cols-1 md:grid-cols-7 gap-2">' + dias.map(f => {
      const evs = eventos.filter(e => String(e.inicio).slice(0, 10) === f).sort(by('inicio'));
      const ses = store.all('study_sessions').filter(s => s.fecha === f);
      const blk = store.all('time_blocks').filter(b => b.fecha === f && Q.enEspacio(b));
      const hoy = f === todayISO();
      return '<div class="surface p-2 min-h-[120px] ' + (hoy ? 'acc-border ring-1 ring-[var(--acc)]' : '') + '">' +
        '<p class="text-[11px] font-semibold ' + (hoy ? 'text-petrol-600 dark:text-petrol-300' : 'text-ink-400') + ' mb-1.5 capitalize">' +
          DIAS_C[dayOfWeek(f)] + ' ' + Number(f.slice(-2)) + '</p>' +
        '<div class="flex flex-col gap-1">' +
        evs.map(e => '<div data-act="ver-evento" data-id="' + e.id + '" role="button" tabindex="0" class="flex items-center gap-1 text-[11px] leading-tight p-1.5 rounded-lg cursor-pointer border-l-2 ' +

          ico('estudio', 11) + '<span class="tnum">' + (s.hora || '') + '</span><span class="truncate">' + esc(s.titulo) + '</span>' +

      { k: 'lugar', label: 'Lugar' },
      { k: 'enlace', label: 'Enlace' },

      { k: 'participantesTxt', label: 'Participantes', col: 2, hint: 'Separados por coma. Ej: Paula Ríos, Matías Fuentes' },
      { k: 'recordatorio_min', label: 'Recordatorio (min antes)', type: 'number', min: 0 },
      { k: 'notas', label: 'Notas', type: 'textarea', col: 2 }
    ],
    values: Object.assign({}, v, { participantesTxt: (v.participantes || []).map(p => p.nombre).join(', ') }),
    nota: 'Los recordatorios se muestran dentro de Nexo. Las notificaciones push del teléfono requieren un servidor con claves VAPID (versión 2).',
    onSave(d) {
      d.participantes = (d.participantesTxt || '').split(',').map(s => s.trim()).filter(Boolean).map(n => ({ nombre: n, rol: '' }));
      delete d.participantesTxt;
      d.brand_id = d.brand_id || null; d.subject_id = d.subject_id || null; d.fin = d.fin || null;
      if (e) { store.update('events', e.id, d); toast('Evento actualizado'); }
      else { store.insert('events', Object.assign({ estado: 'programado' }, d)); toast('Evento creado'); }
      render();
    }
  });
}

Vistas.trabajo = function () {
  const marcas = store.all('brands');
  const orden = { critico: 0, requiere_atencion: 1, al_dia: 2 };
  const lista = marcas.slice().sort((a, b) => orden[a.estado] - orden[b.estado] || a.nombre.localeCompare(b.nombre));
  const totales = {
    abiertas: store.where('tasks', t => t.area === 'trabajo' && t.estado !== 'completada').length,
    vencidas: store.where('tasks', t => t.area === 'trabajo' && Q.vencida(t)).length,
    solicitudes: store.where('requests', r => ['abierta', 'en_gestion', 'sin_respuesta'].includes(r.estado)).length,
    sinCobertura: store.where('stores', s => s.estado === 'sin_cobertura').length
  };
  const porEstado = { critico: 0, requiere_atencion: 0, al_dia: 0 };
  marcas.forEach(b => porEstado[b.estado]++);

  const semaforo = '<section class="surface shadow-card p-4 mb-4 flex flex-col sm:flex-row sm:items-center gap-4">' +
    '<div class="min-w-0 flex-1"><p class="text-[13px] font-semibold text-ink-500 dark:text-ink-400 flex items-center gap-2">' +
      ico('marca', 15) + 'Semáforo de la cartera</p>' +
    '<div class="flex h-2.5 rounded-full overflow-hidden mt-2.5 bg-ink-200 dark:bg-ink-800">' +
      ['al_dia', 'requiere_atencion', 'critico'].map(k => porEstado[k]
        ? '<span class="' + SEMAFORO[k].dot + '" style="width:' + (porEstado[k] / marcas.length * 100) + '%"></span>' : '').join('') +
    '</div>' +
    '<div class="flex flex-wrap gap-x-4 gap-y-1 mt-2.5">' + ['critico', 'requiere_atencion', 'al_dia'].map(k =>
      '<span class="inline-flex items-center gap-1.5 text-[12px] text-ink-600 dark:text-ink-300">' +
      '<span class="w-2 h-2 rounded-full ' + SEMAFORO[k].dot + '"></span>' + porEstado[k] + ' ' + SEMAFORO[k].label.toLowerCase() + '</span>').join('') +
    '</div></div></section>';

  return '' +
    semaforo +
    '<div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5 mb-5">' +
      metrica('Pendientes', totales.abiertas, { ic: 'tareas', tono: 'acento', ruta: '#/tareas' }) +
      metrica('Vencidas', totales.vencidas, { ic: 'alerta', tono: totales.vencidas ? 'critico' : 'neutro', ruta: '#/tareas' }) +
      metrica('Solicitudes', totales.solicitudes, { ic: 'enviar', tono: totales.solicitudes ? 'alerta' : 'neutro' }) +
      metrica('Sin cobertura', totales.sinCobertura, { ic: 'tienda', tono: totales.sinCobertura ? 'critico' : 'ok' }) +
    '</div>' +
    '<div class="flex justify-between items-center mb-2.5">' +
      '<h2 class="text-[13px] font-semibold text-ink-500 dark:text-ink-400 flex items-center gap-2">' + ico('marca', 15) + 'Mis marcas</h2>' +
      btn(ico('plus', 15) + 'Nueva marca', 'nueva-marca') +
    '</div>' +
    (lista.length ? '<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3 stagger">' + lista.map(b => {
      const c = Q.cargaBrand(b.id);
      const eq = store.where('people', p => p.brand_id === b.id && !['renuncia', 'baja'].includes(p.estado)).length;
      const ti = store.where('stores', s => s.brand_id === b.id).length;
      const barraColor = b.estado === 'critico' ? 'bg-critc-500' : b.estado === 'requiere_atencion' ? 'bg-warnc-500' : 'bg-okc-500';
      return '<a href="#/marca/' + b.id + '" class="focus-ring surface surface-hover shadow-card p-4 block relative overflow-hidden">' +
        '<span aria-hidden="true" class="absolute left-0 top-0 bottom-0 w-1 ' + barraColor + '"></span>' +
        '<div class="flex items-start justify-between gap-2 mb-3">' +
          '<div class="min-w-0"><p class="font-semibold text-[14.5px] truncate">' + esc(b.nombre) + '</p>' +
          '<p class="text-[11.5px] text-ink-500 dark:text-ink-400 truncate">' + esc(b.cliente || 'Sin cliente') + '</p></div>' +
          badge('<span class="w-1.5 h-1.5 rounded-full ' + SEMAFORO[b.estado].dot + '"></span>' + SEMAFORO[b.estado].label, SEMAFORO[b.estado].cls) +
        '</div>' +
        '<div class="grid grid-cols-3 gap-1.5 mb-3">' +
          [['Pendientes', c.abiertas, c.abiertas ? '' : 'opacity-50'],
           ['Vencidas', c.vencidas, c.vencidas ? 'text-critc-500' : 'opacity-50'],
           ['Solicitudes', c.solicitudes, c.solicitudes ? 'text-warnc-500' : 'opacity-50']]
          .map(([l, v, cls]) => '<div class="rounded-lg bg-ink-100/70 dark:bg-ink-850 px-2 py-1.5 text-center">' +

          btn(ico('plus', 16) + 'Crear marca', 'nueva-marca'), 'marca')));
};

  '<a class="underline" target="_blank" rel="noopener" href="https://www.pjud.cl">Poder Judicial</a> y ' +

/* --------------------------------------------------------------------------
   Panel académico: lo que Carlos necesita ver al entrar a Universidad
   -------------------------------------------------------------------------- */
function seccionResumenUniversidad(subs) {
  const hoy = todayISO();
  const escala = Academico.escala();
  if (!subs.length) {
    return card(vacio('Aún no hay asignaturas', 'Crea tus ramos del periodo y Nexo arma el panel académico automáticamente.',
      btn(ico('plus', 16) + 'Crear asignatura', 'nueva-asignatura'), 'universidad'));
  }

  /* 1 · Próxima evaluación con cuenta regresiva */
  const prox = Q.evaluacionesProximas(180)[0];
  const dd = prox ? diffDays(prox.fecha, hoy) : null;
  const plan = prox ? store.all('study_plans').find(p => p.evaluation_id === prox.id && p.estado === 'activo') : null;
  const prep = prox ? PREPARACION[prox.preparacion || 'no_iniciada'] : null;

  const heroEval = prox
    ? '<section class="surface shadow-card overflow-hidden mb-4 relative">' +
        '<div aria-hidden="true" class="absolute inset-0 opacity-[0.06]" style="background:radial-gradient(90% 120% at 100% 0%, #4F46E5 0%, transparent 60%)"></div>' +
        '<div class="relative p-5 flex flex-col lg:flex-row lg:items-center gap-5">' +
          '<div class="flex items-center gap-4 min-w-0 flex-1">' +
            '<div class="shrink-0 w-[72px] h-[72px] rounded-2xl2 grid place-items-center ' +
              (dd <= 3 ? 'bg-critc-500' : dd <= 7 ? 'bg-warnc-500' : 'bg-uni-500') + ' text-white">' +
              '<span class="text-[26px] font-bold leading-none tnum">' + dd + '</span>' +
              '<span class="text-[10px] opacity-90 -mt-0.5">días</span></div>' +
            '<div class="min-w-0">' +
              '<p class="text-[11px] uppercase tracking-wider font-semibold text-uni-600 dark:text-uni-300">Próxima evaluación</p>' +
              '<p class="text-[17px] font-semibold leading-snug mt-0.5 clamp-2">' + esc(prox.titulo) + '</p>' +
              '<p class="text-[12.5px] text-ink-500 dark:text-ink-400 mt-1">' + esc(Q.nombreSubject(prox.subject_id)) + ' · ' +
                TIPO_EVAL[prox.tipo] + ' · ' + fmtFecha(prox.fecha) + (prox.hora ? ' a las ' + prox.hora : '') + ' · ' + fmtNum(prox.ponderacion, 0) + '%</p>' +
              '<div class="flex flex-wrap items-center gap-1.5 mt-2">' +
                badge(prep.label, prep.cls) +
                (prox.nota_objetivo != null ? badge('Meta ' + Academico.fmtNota(prox.nota_objetivo), CHIP) : '') +
                (plan ? badge(ico('estudio', 11) + 'Con plan', 'bg-okc-100 text-okc-700 dark:bg-okc-500/20 dark:text-okc-200') : badge('Sin plan', 'bg-warnc-100 text-warnc-700 dark:bg-warnc-500/20 dark:text-warnc-200')) +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="flex flex-wrap gap-2 shrink-0">' +
            (plan ? btn(ico('estudio', 16) + 'Ver plan', 'ir-estudio', '', BTN.secundario)
                  : btn(ico('plus', 16) + 'Crear plan', 'plan-desde-eval', 'data-id="' + prox.id + '"')) +
            btn(ico('fuego', 16) + 'Estudiar ahora', 'iniciar-sesion-rapida', 'data-id="' + prox.subject_id + '"', BTN.secundario) +
            '<a href="#/asignatura/' + prox.subject_id + '" class="' + BTN.secundario + '">Abrir ramo</a>' +
          '</div>' +
        '</div></section>'
    : card(vacio('Sin evaluaciones registradas', 'Agrega tus pruebas y trabajos para ver la cuenta regresiva.',
        btn(ico('plus', 16) + 'Registrar evaluación', 'nueva-evaluacion-libre'), 'evaluacion'), 'mb-4');

  /* 2 · Métricas del periodo */
  const sem = Academico.horasSemana();
  const promedios = subs.map(x => Academico.promedio(x.id).promedio).filter(x => x != null);
  const general = promedios.length ? promedios.reduce((a, b) => a + b, 0) / promedios.length : null;
  const atrasadas = Q.sesionesAtrasadas().length;
  const paginas = Q.paginasPendientes();

  const metricas = '<div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5 mb-4">' +
    metrica('Promedio general', general != null ? Academico.fmtNota(general) : '—',
      { ic: 'meta', tono: general == null ? 'neutro' : Academico.aprueba(general) ? 'ok' : 'critico' }) +
    metrica('Horas esta semana', Math.floor(sem.minutos / 60) + ' h ' + (sem.minutos % 60) + 'm',
      { ic: 'reloj', tono: 'acento', act: 'ir-estudio' }) +
    metrica('Páginas pendientes', paginas, { ic: 'lectura', act: 'ir-lecturas' }) +
    metrica('Sesiones atrasadas', atrasadas, { ic: 'alerta', tono: atrasadas ? 'critico' : 'ok', act: 'ir-estudio' }) +
  '</div>';

  /* 3 · Próximas evaluaciones con días restantes y preparación */
  const evals = Q.evaluacionesProximas(60).slice(0, 5);
  const cardEvals = card(
    cardTitulo('Próximas evaluaciones', btn(ico('plus', 14) + 'Nueva', 'nueva-evaluacion-libre', '', BTN.enlace), 'evaluacion') +
    (evals.length
      ? listaSep(evals.map(e => {
          const d = diffDays(e.fecha, hoy);
          const pr = PREPARACION[e.preparacion || 'no_iniciada'];
          const nn = Academico.notaNecesaria(e.subject_id, e.nota_objetivo);
          return '<a href="#/asignatura/' + e.subject_id + '" class="focus-ring flex items-center gap-3 px-4 py-3 hover:bg-ink-50 dark:hover:bg-ink-850/60">' +
            '<span class="w-11 shrink-0 text-center"><span class="block text-[19px] font-bold leading-none tnum ' +
              (d <= 3 ? 'text-critc-500' : d <= 7 ? 'text-warnc-500' : 'text-uni-600 dark:text-uni-300') + '">' + d + '</span>' +
            '<span class="block text-[10px] text-ink-500 dark:text-ink-400 mt-0.5">días</span></span>' +
            '<span class="min-w-0 flex-1"><span class="block text-[13.5px] font-semibold truncate">' + esc(e.titulo) + '</span>' +
            '<span class="block text-[11.5px] text-ink-500 dark:text-ink-400 truncate">' + esc(Q.nombreSubject(e.subject_id)) +
              ' · ' + TIPO_EVAL[e.tipo] + ' · ' + fmtNum(e.ponderacion, 0) + '%' +
              (nn != null ? ' · necesitas ' + Academico.fmtNota(nn) : '') + '</span>' +
            '<span class="mt-1.5 block">' + barra(pr.pct, pr.pct === 100 ? 'bg-okc-500' : 'bg-uni-500', 'h-1') + '</span></span>' +
            badge(pr.label, pr.cls) + '</a>';
        }))
      : vacio('Sin evaluaciones próximas', 'Registra tus pruebas para que Nexo te avise con tiempo.', '', 'evaluacion'))
  );

  /* 4 · Asignaturas del periodo */
  const cardSubs = '<div>' +
    '<div class="flex items-center justify-between gap-3 mb-2.5">' +
      '<h2 class="text-[13px] font-semibold text-ink-500 dark:text-ink-400 flex items-center gap-2">' + ico('universidad', 15) + 'Asignaturas del periodo</h2>' +
      btn(ico('plus', 14) + 'Nueva', 'nueva-asignatura', '', BTN.enlace) +
    '</div>' +
    '<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3 stagger">' + subs.map(tarjetaAsignatura).join('') + '</div></div>';

  /* 5 · Progreso por unidad */
  const unidades = store.all('units').map(u => Academico.avanceUnidad(u.id)).filter(Boolean);
  const porAsig = {};
  unidades.forEach(x => { (porAsig[x.unidad.subject_id] = porAsig[x.unidad.subject_id] || []).push(x); });
  const cardProgreso = card(
    cardTitulo('Progreso por unidad', '<span class="text-[11px] text-ink-400">dominio · precisión en repaso</span>', 'meta') +
    (unidades.length
      ? '<div class="px-4 pb-4 flex flex-col gap-3.5">' + Object.keys(porAsig).map(sid =>
          '<div><p class="text-[11.5px] font-semibold text-ink-600 dark:text-ink-300 mb-1.5">' + esc(Q.nombreSubject(sid)) + '</p>' +
          '<div class="flex flex-col gap-2">' + porAsig[sid].sort((a, b) => a.unidad.orden - b.unidad.orden).map(x =>
            '<div class="flex items-center gap-2.5">' +
              '<span class="min-w-0 flex-1"><span class="block text-[12.5px] truncate">' + esc(x.unidad.nombre) + '</span>' +
              '<span class="mt-1 block">' + barra(x.dominioPct, x.dominioPct === 100 ? 'bg-okc-500' : x.dominioPct <= 33 ? 'bg-critc-500' : 'bg-uni-500', 'h-1.5') + '</span></span>' +
              '<span class="text-[11px] tnum text-ink-500 dark:text-ink-400 w-11 text-right">' + x.dominioPct + '%</span>' +
              (x.precision != null
                ? badge(x.precision + '% ok', x.precision >= 70 ? 'bg-okc-100 text-okc-700 dark:bg-okc-500/20 dark:text-okc-200' : 'bg-warnc-100 text-warnc-700 dark:bg-warnc-500/20 dark:text-warnc-200')
                : badge('sin repasar', CHIP)) +
            '</div>').join('') + '</div></div>').join('') + '</div>'
      : vacio('Sin unidades', 'Agrega el programa de cada ramo para medir el avance.', '', 'universidad'))
  );

  /* 6 · Temas que requieren refuerzo */
  const debiles = Academico.temasDebiles(null, 6);
  const cardDebiles = card(
    cardTitulo('Temas que requieren refuerzo', btn('Repasar estos', 'repasar-debiles', '', BTN.enlace), 'alerta') +
    (debiles.length
      ? '<div class="px-4 pb-4 flex flex-col gap-2.5">' + debiles.map(x =>
          '<div class="flex items-center gap-2.5 p-2.5 rounded-xl border border-ink-200 dark:border-ink-800">' +
            '<span class="w-9 h-9 shrink-0 rounded-lg grid place-items-center text-[12px] font-bold tnum ' +
              (x.score >= 90 ? 'bg-critc-100 text-critc-700 dark:bg-critc-500/20 dark:text-critc-200'
               : x.score >= 60 ? 'bg-warnc-100 text-warnc-700 dark:bg-warnc-500/20 dark:text-warnc-200'
               : 'bg-ink-100 dark:bg-ink-800 text-ink-500') + '">' + x.score + '</span>' +
            '<a href="#/asignatura/' + x.unidad.subject_id + '" class="focus-ring min-w-0 flex-1">' +
              '<span class="block text-[13px] font-medium truncate">' + esc(x.unidad.nombre) + '</span>' +
              '<span class="block text-[11px] text-ink-500 dark:text-ink-400 truncate">' + esc(Q.nombreSubject(x.unidad.subject_id)) +
                ' · dificultad ' + x.unidad.dificultad + '/5' +
                (x.precision != null ? ' · ' + x.precision + '% de aciertos' : ' · sin repasos') +
                (x.diasEval != null && x.diasEval >= 0 ? ' · evaluación en ' + x.diasEval + ' días' : '') + '</span></a>' +
            badge(DOMINIO[x.unidad.dominio].label, DOMINIO[x.unidad.dominio].cls) +
            btnIco('fuego', 'estudiar-unidad', 'Estudiar esta unidad', 'data-id="' + x.unidad.id + '"') +
          '</div>').join('') + '</div>'
      : vacio('Todo dominado', 'No hay unidades pendientes de estudio.', '', 'ok'))
  );

  /* 7 · Lecturas pendientes con tiempo estimado */
  const lect = store.all('readings').filter(r => (r.paginas_leidas || 0) < (r.paginas_total || 0))
    .sort((a, b) => (a.fecha_limite || '9999') > (b.fecha_limite || '9999') ? 1 : -1);
  const minTotal = lect.reduce((a, r) => a + Academico.minutosLectura(r), 0);
  const cardLect = card(
    cardTitulo('Lecturas pendientes',
      badge(paginas + ' pág · ' + Math.round(minTotal / 60) + ' h estimadas', CHIP) +
      btn(ico('plus', 14) + 'Nueva', 'nueva-lectura-libre', '', BTN.enlace), 'lectura') +
    (lect.length
      ? '<div class="px-4 pb-4 flex flex-col gap-3">' + lect.slice(0, 5).map(filaLectura).join('') + '</div>'
      : vacio('Sin lecturas pendientes', 'Registra tus lecturas para llevar el control de páginas.',
          btn(ico('plus', 16) + 'Agregar lectura', 'nueva-lectura-libre'), 'lectura'))
  );

  /* 8 · Sesiones y horas de la semana */
  const dias = Array.from({ length: 7 }, (_, i) => addDays(sem.ini, i));
  const sesSem = store.all('study_sessions').filter(s => s.fecha >= sem.ini && s.fecha <= sem.fin);
  const cardSesiones = card(
    cardTitulo('Estudio de la semana',
      badge(sem.hechas + '/' + sem.sesiones + ' sesiones', sem.sesiones && sem.hechas === sem.sesiones
        ? 'bg-okc-100 text-okc-700 dark:bg-okc-500/20 dark:text-okc-200' : CHIP) +
      btn('Planificador', 'ir-estudio', '', BTN.enlace), 'estudio') +
    '<div class="px-4 pb-4">' +
      '<div class="flex items-center justify-between text-[11.5px] mb-1.5">' +
        '<span class="text-ink-500 dark:text-ink-400">Meta semanal: ' + Math.round(sem.meta / 60) + ' h</span>' +
        '<span class="font-semibold tnum">' + Math.floor(sem.minutos / 60) + ' h ' + (sem.minutos % 60) + ' min</span>' +
      '</div>' + barra(sem.pct, sem.pct >= 100 ? 'bg-okc-500' : 'bg-uni-500') +
      '<div class="grid grid-cols-7 gap-1.5 mt-3">' + dias.map(f => {
        const dS = sesSem.filter(s => s.fecha === f);
        const ok = dS.filter(s => s.estado === 'completada').length;
        const atr = dS.filter(s => s.estado === 'pendiente' && f < hoy).length;
        const tono = !dS.length ? 'bg-ink-100 dark:bg-ink-850 text-ink-400'
          : atr ? 'bg-critc-100 dark:bg-critc-500/20 text-critc-700 dark:text-critc-200'
          : ok === dS.length ? 'bg-okc-100 dark:bg-okc-500/20 text-okc-700 dark:text-okc-200'
          : 'bg-uni-50 dark:bg-uni-500/15 text-uni-700 dark:text-uni-200';
        return '<div class="rounded-lg px-1 py-2 text-center ' + tono + (f === hoy ? ' ring-2 ring-[var(--acc)]' : '') + '">' +
          '<p class="text-[10px] font-medium opacity-70">' + DIAS_C[dayOfWeek(f)] + '</p>' +
          '<p class="text-[15px] font-bold tnum leading-tight">' + (dS.length || '–') + '</p></div>';
      }).join('') + '</div>' +
      (sesSem.length ? '<div class="mt-3 divide-y divide-ink-200/70 dark:divide-ink-800 -mx-4">' +
        sesSem.slice(0, 3).map(filaSesion).join('') + '</div>' : '') +
    '</div>');

  /* 9 · Accesos rápidos */
  const pendFichas = Academico.colaRepaso().length;
  const accesos = card(
    cardTitulo('Accesos rápidos', '', 'flecha') +
    '<div class="px-4 pb-4 grid grid-cols-2 gap-2">' +
      [{ l: 'Modo de estudio', d: 'Pomodoro con objetivo', ic: 'fuego', act: 'ir-modo-estudio' },
       { l: 'Repaso', d: pendFichas + ' por repasar', ic: 'estudio', act: 'ir-repaso' },
       { l: 'Apuntes', d: store.all('legal_notes').length + ' apunte(s)', ic: 'notas', act: 'ir-apuntes-juridicos' },
       { l: 'Legislación', d: store.where('legal_sources', f => f.tipo !== 'sentencia').length + ' fichas', ic: 'libro', act: 'ir-legislacion' },
       { l: 'Jurisprudencia', d: store.where('legal_sources', f => f.tipo === 'sentencia').length + ' fallos', ic: 'evaluacion', act: 'ir-jurisprudencia' },
       { l: 'Casos prácticos', d: store.all('cases').length + ' casos', ic: 'meta', act: 'ir-casos' }]
      .map(x => '<button type="button" data-act="' + x.act + '" class="press focus-ring text-left flex items-center gap-2.5 p-3 rounded-xl2 border border-ink-200 dark:border-ink-800 hover:border-ink-300 dark:hover:border-ink-700 hover:bg-ink-50 dark:hover:bg-ink-850">' +
        '<span class="w-8 h-8 shrink-0 rounded-lg grid place-items-center bg-uni-50 dark:bg-uni-900/40 text-uni-600 dark:text-uni-300">' + ico(x.ic, 16) + '</span>' +
        '<span class="min-w-0"><span class="block text-[13px] font-semibold truncate">' + x.l + '</span>' +
        '<span class="block text-[11px] text-ink-500 dark:text-ink-400 truncate">' + x.d + '</span></span></button>').join('') +
    '</div>');

  return heroEval + metricas + cardEvals + '<div class="mt-4">' + cardSubs + '</div>' +
    '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start mt-4">' +
      cardSesiones + cardDebiles + cardProgreso + cardLect + accesos +
    '</div>';
}

/** Fila de lectura con avance, tiempo estimado y acciones rápidas. */
function filaLectura(r) {
  const hoy = todayISO();
  const falta = Math.max(0, (r.paginas_total || 0) - (r.paginas_leidas || 0));
  const pct = Academico.avanceLectura(r);
  const atras = r.fecha_limite && r.fecha_limite < hoy && falta > 0;
  const min = Academico.minutosLectura(r);
  const citas = store.where('reading_notes', n => n.reading_id === r.id).length;
  return '<div>' +
    '<div class="flex items-start justify-between gap-2 mb-1.5">' +
      '<span class="min-w-0"><span class="block text-[13px] font-medium truncate">' + esc(r.titulo) + '</span>' +
      '<span class="block text-[11px] text-ink-500 dark:text-ink-400 truncate">' +
        esc(r.autor || 'Sin autor') + ' · ' + esc(Q.nombreSubject(r.subject_id) || 'Sin asignatura') +
        (r.obligatoria === false ? ' · complementaria' : ' · obligatoria') +
        (r.fecha_limite ? ' · ' + (atras ? 'atrasada desde ' : 'para ') + fmtFecha(r.fecha_limite) : '') + '</span></span>' +
      '<span class="flex items-center gap-1.5 shrink-0">' +
        badge(falta + ' pág', atras ? 'bg-critc-100 text-critc-700 dark:bg-critc-500/20 dark:text-critc-200' : CHIP) +
        (min ? badge('~' + (min >= 60 ? Math.round(min / 60) + ' h' : min + ' min'), CHIP) : '') +
      '</span>' +
    '</div>' +
    barra(pct, atras ? 'bg-critc-500' : 'bg-uni-500') +
    '<div class="flex flex-wrap items-center gap-1.5 mt-1.5">' +
      '<span class="text-[11px] text-ink-400 tnum">' + (r.paginas_leidas || 0) + ' / ' + r.paginas_total + ' · ' + pct + '%</span>' +
      btn('+10', 'leer', 'data-id="' + r.id + '" data-n="10"', BTN.fantasma + ' text-[11px] px-2 py-1') +
      btn('+25', 'leer', 'data-id="' + r.id + '" data-n="25"', BTN.fantasma + ' text-[11px] px-2 py-1') +
      btn('Página…', 'lectura-pagina', 'data-id="' + r.id + '"', BTN.fantasma + ' text-[11px] px-2 py-1') +
      btn(ico('notas', 12) + (citas || '') + ' Citas', 'lectura-citas', 'data-id="' + r.id + '"', BTN.fantasma + ' text-[11px] px-2 py-1') +
      btn('Sesión', 'sesion-desde-lectura', 'data-id="' + r.id + '"', BTN.fantasma + ' text-[11px] px-2 py-1') +
    '</div></div>';
}

/* --------------------------------------------------------------------------
   Fichas de legislación y jurisprudencia.
   Nexo no completa ningún dato jurídico: los campos los llena el usuario
   copiando desde la fuente oficial. Todo parte como no verificado.
   -------------------------------------------------------------------------- */
function selloVerificacion(x) {
  return badge(ico(x.verificado ? 'ok' : 'alerta', 11) + (x.verificado ? 'Verificado' : 'Sin verificar'),
    x.verificado ? 'bg-okc-100 text-okc-700 dark:bg-okc-500/20 dark:text-okc-200'
                 : 'bg-warnc-100 text-warnc-700 dark:bg-warnc-500/20 dark:text-warnc-200');
}
function selloDemo(x) {
  return x.es_demo ? badge('Dato de ejemplo', 'bg-ink-200 dark:bg-ink-800 text-ink-600 dark:text-ink-300') : '';
}

function fichaLegislacion(f) {
  return '<div class="px-4 py-3.5">' +
    '<div class="flex items-start justify-between gap-2 mb-1">' +
      '<div class="min-w-0"><p class="text-[14px] font-semibold leading-snug">' + esc(f.identificador) +
        (f.articulo ? ' · <span class="acc-text">' + esc(f.articulo) + '</span>' : '') + '</p>' +
      (f.titulo ? '<p class="text-[12px] text-ink-500 dark:text-ink-400">' + esc(f.titulo) + '</p>' : '') + '</div>' +
      '<div class="flex flex-col items-end gap-1 shrink-0">' + selloVerificacion(f) + selloDemo(f) + '</div>' +
    '</div>' +
    '<div class="flex flex-wrap gap-1.5 mt-1.5">' +
      badge(VIGENCIA[f.vigencia || 'por_verificar'].label, VIGENCIA[f.vigencia || 'por_verificar'].cls) +
      (f.numero ? badge('N° ' + esc(f.numero), CHIP) : '') +
      (f.materia ? badge(esc(f.materia), 'bg-uni-50 text-uni-700 dark:bg-uni-500/20 dark:text-uni-100') : '') +
      (f.subject_id ? badge(esc(Q.nombreSubject(f.subject_id)), CHIP) : '') +
      (f.consultada_el ? badge('Consultada el ' + fmtFecha(f.consultada_el), CHIP) : badge('Sin fecha de consulta', CHIP)) +
    '</div>' +
    (f.texto_registrado
      ? '<div class="mt-2.5 p-3 rounded-xl bg-ink-50 dark:bg-ink-850 border border-ink-200 dark:border-ink-800">' +
        '<p class="text-[10.5px] uppercase tracking-wider font-semibold text-ink-400 mb-1">Texto que registraste</p>' +
        '<p class="text-[12.5px] prose-note leading-relaxed">' + esc(f.texto_registrado) + '</p></div>' : '') +
    (f.resumen ? '<p class="text-[12.5px] text-ink-600 dark:text-ink-300 mt-2 prose-note">' + esc(f.resumen) + '</p>' : '') +
    '<div class="flex flex-wrap gap-1.5 mt-2.5">' +
      (f.enlace ? '<a href="' + esc(f.enlace) + '" target="_blank" rel="noopener" class="' + BTN.enlace + '">' + ico('libro', 13) + 'Abrir fuente oficial</a>' : '') +
      btn('Editar', 'editar-legislacion', 'data-id="' + f.id + '"', BTN.enlace) +
      btn(f.verificado ? 'Marcar sin verificar' : 'Marcar verificada', 'toggle-verificada', 'data-id="' + f.id + '"', BTN.enlace) +
      btn('Eliminar', 'borrar-fuente', 'data-id="' + f.id + '"', BTN.enlace + ' text-critc-500') +
    '</div></div>';
}

function fichaJurisprudencia(f) {

/** Apunte jurídico: texto original y contenido derivado en secciones aparte. */
function fichaApunte(n, compacto) {
  const derivado = n.resumen || (n.conceptos || []).length || (n.normas || []).length || (n.jurisprudencia || []).length;
  const lista = (t, arr, cls) => (arr || []).length
    ? '<div class="mt-2"><p class="text-[10.5px] uppercase tracking-wider font-semibold text-ink-400 mb-1">' + t + '</p>' +
      '<div class="flex flex-wrap gap-1.5">' + arr.map(x => badge(esc(x), cls || CHIP)).join('') + '</div></div>'
    : '';
  return '<div class="px-4 py-3.5">' +
    '<div class="flex items-start justify-between gap-2">' +
      '<div class="min-w-0"><p class="text-[14px] font-semibold leading-snug">' + esc(n.titulo) + '</p>' +
      '<p class="text-[11.5px] text-ink-500 dark:text-ink-400 truncate">' +
        esc(Q.nombreSubject(n.subject_id) || 'Sin asignatura') +
        (n.unit_id ? ' · ' + esc((store.get('units', n.unit_id) || {}).nombre || '') : '') +
        (n.tema ? ' · ' + esc(n.tema) : '') + '</p></div>' +
      '<div class="text-right shrink-0"><p class="text-[10.5px] text-ink-400">Creado ' + fmtFecha(n.created_at) + '</p>' +
      (n.updated_at && n.updated_at !== n.created_at ? '<p class="text-[10.5px] text-ink-400">Editado ' + fmtFecha(n.updated_at) + '</p>' : '') + '</div>' +
    '</div>' +

    '<div class="mt-2.5 p-3 rounded-xl bg-ink-50 dark:bg-ink-850 border border-ink-200 dark:border-ink-800">' +
      '<p class="text-[10.5px] uppercase tracking-wider font-semibold text-ink-400 mb-1 flex items-center gap-1.5">' +
        ico('notas', 12) + 'Texto original · no se modifica</p>' +
      '<p class="text-[12.5px] prose-note leading-relaxed' + (compacto ? ' clamp-3' : '') + '">' + esc(n.texto_original || '') + '</p></div>' +

    (derivado
      ? '<div class="mt-2.5 p-3 rounded-xl border border-uni-200 dark:border-uni-500/25 bg-uni-50/60 dark:bg-uni-500/10">' +
        '<p class="text-[10.5px] uppercase tracking-wider font-semibold text-uni-700 dark:text-uni-200 mb-1 flex items-center gap-1.5">' +
          ico('estudio', 12) + 'Contenido derivado' +
          (n.derivado_por ? ' · ' + esc(n.derivado_por) : '') + (n.derivado_en ? ' · ' + fmtFecha(n.derivado_en) : '') + '</p>' +
        (n.resumen ? '<p class="text-[12.5px] prose-note leading-relaxed">' + esc(n.resumen) + '</p>' : '') +
        lista('Conceptos principales', n.conceptos, 'bg-white dark:bg-ink-800 text-ink-700 dark:text-ink-200') +
        lista('Normas mencionadas', n.normas, 'bg-warnc-100 text-warnc-700 dark:bg-warnc-500/20 dark:text-warnc-200') +
        lista('Jurisprudencia mencionada', n.jurisprudencia, 'bg-warnc-100 text-warnc-700 dark:bg-warnc-500/20 dark:text-warnc-200') +
        ((n.normas || []).length || (n.jurisprudencia || []).length
          ? '<p class="text-[11px] text-ink-500 dark:text-ink-400 mt-2">Lo mencionado en tus apuntes debe verificarse en fuente oficial antes de citarlo.</p>' : '') +
        '</div>'
      : '<p class="text-[11.5px] text-ink-500 dark:text-ink-400 mt-2">Sin contenido derivado todavía.</p>') +

    ((n.etiquetas || []).length ? '<div class="flex flex-wrap gap-1.5 mt-2.5">' +
      n.etiquetas.map(t => badge('#' + esc(t), CHIP)).join('') + '</div>' : '') +

    '<div class="flex flex-wrap gap-1.5 mt-2.5">' +
      btn('Editar', 'editar-apunte', 'data-id="' + n.id + '"', BTN.enlace) +
      btn(ico('estudio', 13) + 'Derivar contenido', 'derivar-apunte', 'data-id="' + n.id + '"', BTN.enlace) +
      btn('Crear fichas', 'fichas-desde-apunte', 'data-id="' + n.id + '"', BTN.enlace) +
      btn('Eliminar', 'borrar-apunte', 'data-id="' + n.id + '"', BTN.enlace + ' text-critc-500') +
    '</div></div>';
}

/** Tarjeta de asignatura, reutilizada en Resumen y en el listado. */
function tarjetaAsignatura(s) {
  const av = Q.avanceSubject(s.id);
  const pr = Q.promedio(s.id);
  const nn = Q.notaNecesaria(s.id);
  const prox = store.where('evaluations', e => e.subject_id === s.id && e.estado === 'pendiente' && e.fecha).sort(by('fecha'))[0];
  const pag = Q.paginasPendientes(s.id);
  const notaCls = pr.promedio == null ? CHIP
    : pr.promedio >= 5.5 ? 'bg-okc-100 text-okc-700 dark:bg-okc-500/20 dark:text-okc-200'
    : pr.promedio >= 4 ? 'bg-ink-100 dark:bg-ink-800 text-ink-700 dark:text-ink-200'
    : 'bg-critc-100 text-critc-700 dark:bg-critc-500/20 dark:text-critc-200';
  const nnCls = nn == null ? CHIP
    : nn > 7 ? 'bg-critc-100 text-critc-700 dark:bg-critc-500/20 dark:text-critc-200'
    : nn <= 4 ? 'bg-okc-100 text-okc-700 dark:bg-okc-500/20 dark:text-okc-200'
    : 'bg-warnc-100 text-warnc-700 dark:bg-warnc-500/20 dark:text-warnc-200';
  return '<a href="#/asignatura/' + s.id + '" class="focus-ring surface surface-hover shadow-card p-4 block relative overflow-hidden">' +
    '<span aria-hidden="true" class="absolute left-0 top-0 bottom-0 w-1 bg-uni-500"></span>' +
    '<div class="flex items-start justify-between gap-3 mb-3">' +
      '<div class="min-w-0"><p class="font-semibold text-[14.5px] leading-snug truncate">' + esc(s.nombre) + '</p>' +
      '<p class="text-[11.5px] text-ink-500 dark:text-ink-400 truncate mt-0.5">' + esc(s.profesor || 'Sin profesor') + ' · ' + esc(s.sala_modalidad || '') + '</p>' +
      (s.es_demo ? '<span class="inline-block mt-1">' + badge('Asignatura de ejemplo', 'bg-ink-200 dark:bg-ink-800 text-ink-600 dark:text-ink-300') + '</span>' : '') + '</div>' +
      anillo(av, av + '%', 46, '#4F46E5') +
    '</div>' +
    '<div class="grid grid-cols-2 gap-2 mb-3">' +
      '<div class="rounded-lg px-2.5 py-2 ' + notaCls + '"><p class="text-[10px] uppercase tracking-wide opacity-70 font-medium">Promedio</p>' +
      '<p class="text-[17px] font-semibold tnum leading-tight">' + (pr.promedio ? fmtNum(pr.promedio) : '—') + '</p></div>' +
      '<div class="rounded-lg px-2.5 py-2 ' + nnCls + '"><p class="text-[10px] uppercase tracking-wide opacity-70 font-medium">Nota necesaria</p>' +
      '<p class="text-[17px] font-semibold tnum leading-tight">' + (nn != null ? fmtNum(nn) : '—') + '</p></div>' +
    '</div>' +
    '<div class="flex flex-wrap gap-1.5">' +
      (prox ? badge(ico('evaluacion', 11) + fmtFecha(prox.fecha) + ' · ' + diffDays(prox.fecha, todayISO()) + ' días',
        diffDays(prox.fecha, todayISO()) <= 7 ? 'bg-warnc-100 text-warnc-700 dark:bg-warnc-500/20 dark:text-warnc-200' : 'bg-uni-50 text-uni-700 dark:bg-uni-500/20 dark:text-uni-100') : badge('Sin evaluaciones', CHIP)) +
      (pag ? badge(ico('lectura', 11) + pag + ' pág.', CHIP) : '') +
    '</div></a>';
}

    const prox = Q.evaluacionesProximas(120);

            '<div class="w-14 text-center shrink-0"><p class="text-sm font-semibold">' + fmtFecha(e.fecha).slice(0, 5) + '</p><p class="text-[10px] text-ink-400">' + DIAS_C[dayOfWeek(e.fecha)] + '</p></div>' +
            '<div class="min-w-0 flex-1"><p class="text-sm font-medium truncate">' + esc(e.titulo) + '</p>' +

            badge(diffDays(e.fecha, todayISO()) + ' días', diffDays(e.fecha, todayISO()) <= 7 ? 'bg-warnc-50 text-warnc-600' : 'bg-ink-100 dark:bg-ink-850 text-ink-500') + '</a>'))
          : vacio('Sin evaluaciones', 'Registra pruebas, controles, trabajos y presentaciones en cada asignatura.'))) + '</div>';
  } else if (sec === 'glosario') {
    const g = store.all('glossary').filter(x => !q || slug(x.termino + ' ' + x.definicion + ' ' + (x.etiquetas || []).join(' ')).includes(q));
    cuerpo = card(cardTitulo('Glosario de conceptos jurídicos', btn(ico('plus', 14) + 'Concepto', 'nuevo-concepto', '', BTN.enlace)) +
      (g.length ? listaSep(g.map(x =>
        '<div class="px-4 py-3"><div class="flex items-start justify-between gap-2">' +
          '<p class="text-sm font-semibold">' + esc(x.termino) + '</p>' +
          badge(ico(x.verificado ? 'ok' : 'alerta', 11) + (x.verificado ? 'Verificado' : 'Sin verificar'), x.verificado ? 'bg-okc-50 text-okc-600 dark:bg-okc-500/20 dark:text-okc-100' : 'bg-warnc-50 text-warnc-600 dark:bg-warnc-500/20 dark:text-warnc-100') + '</div>' +
        '<p class="text-sm text-ink-600 dark:text-ink-300 mt-1 prose-note">' + esc(x.definicion) + '</p>' +
        '<div class="flex flex-wrap gap-1.5 mt-1.5">' + (x.subject_id ? badge(esc(Q.nombreSubject(x.subject_id)), 'bg-uni-50 text-uni-700 dark:bg-uni-500/20 dark:text-uni-100') : '') +

          (x.etiquetas || []).map(e => badge('#' + esc(e), 'bg-ink-100 dark:bg-ink-850 text-ink-500')).join('') +
          '<button data-act="editar-concepto" data-id="' + x.id + '" class="focus-ring text-[11px] text-uni-600 dark:text-uni-300">Editar</button>' +
        '</div></div>'))
        : vacio('Glosario vacío', 'Guarda los conceptos que necesitas memorizar, con su fuente.', btn('Agregar concepto', 'nuevo-concepto'))));
  } else if (sec === 'legislacion') {
    const f = store.where('legal_sources', x => x.tipo !== 'sentencia')
      .filter(x => !q || slug(x.identificador + ' ' + (x.titulo || '') + ' ' + (x.materia || '') + ' ' + (x.articulo || '')).includes(q));
    cuerpo = AVISO_JURIDICO + card(
      cardTitulo('Fichas de legislación', btn(ico('plus', 14) + 'Nueva ficha', 'nueva-legislacion', '', BTN.enlace), 'libro') +
      (f.length ? listaSep(f.sort(by('identificador')).map(fichaLegislacion))
        : vacio('Sin normas registradas', 'Registra la norma, su número, artículo y el texto que copiaste desde BCN.',
            btn(ico('plus', 16) + 'Agregar norma', 'nueva-legislacion'), 'libro')));
  } else if (sec === 'jurisprudencia') {
    const f = store.where('legal_sources', x => x.tipo === 'sentencia')
      .filter(x => !q || slug(x.identificador + ' ' + (x.tribunal || '') + ' ' + (x.rol || '') + ' ' + (x.materia || '')).includes(q));
    cuerpo = AVISO_JURIDICO + card(
      cardTitulo('Fichas de jurisprudencia', btn(ico('plus', 14) + 'Nuevo fallo', 'nueva-jurisprudencia', '', BTN.enlace), 'evaluacion') +
      (f.length ? listaSep(f.sort(by('fecha', -1)).map(fichaJurisprudencia))
        : vacio('Sin fallos registrados', 'Copia tribunal, rol y fecha desde el portal del Poder Judicial. Nexo no completa esos datos.',
            btn(ico('plus', 16) + 'Agregar fallo', 'nueva-jurisprudencia'), 'evaluacion')));
  } else if (sec === 'apuntes') {
    const ap = store.all('legal_notes')
      .filter(x => !q || slug(x.titulo + ' ' + (x.texto_original || '') + ' ' + (x.tema || '') + ' ' + (x.etiquetas || []).join(' ')).includes(q))
      .sort(by('updated_at', -1));
    cuerpo = card(
      cardTitulo('Apuntes jurídicos', btn(ico('plus', 14) + 'Nuevo apunte', 'nuevo-apunte', '', BTN.enlace), 'notas') +
      '<p class="px-4 -mt-1 mb-2 text-[11.5px] text-ink-500 dark:text-ink-400">Tu texto original nunca se modifica. Lo derivado —resumen, conceptos, normas y jurisprudencia— se guarda y se muestra aparte.</p>' +
      (ap.length ? listaSep(ap.map(n => fichaApunte(n, true)))
        : vacio('Sin apuntes', 'Pega el texto de tu clase y Nexo lo organiza por asignatura, unidad y tema.',
            btn(ico('plus', 16) + 'Crear apunte', 'nuevo-apunte'), 'notas')));
  } else {
    const cs = store.all('cases').filter(x => !q || slug(x.titulo + ' ' + (x.problema || '') + ' ' + (x.hechos || '')).includes(q));
    cuerpo = AVISO_JURIDICO + card(
      cardTitulo('Análisis de casos', btn(ico('plus', 14) + 'Nuevo caso', 'nuevo-caso', '', BTN.enlace), 'meta') +
      (cs.length ? listaSep(cs.sort(by('created_at', -1)).map(fichaCaso))
        : vacio('Sin casos', 'La plantilla trae hechos, partes, problema, normas, argumentos, decisión, fundamentos y tu análisis.',
            btn(ico('plus', 16) + 'Crear caso', 'nuevo-caso'), 'meta')));
  }

  return (sec === 'resumen' || sec === 'asignaturas' || sec === 'calendario' ? AVISO_JURIDICO : '') +
    '<div class="flex items-center justify-between gap-2 mb-3">' +
      barraTabs(secciones, sec) +
      (sec === 'asignaturas' ? btn(ico('plus', 15) + 'Asignatura', 'nueva-asignatura') : '') +
    '</div>' + buscador + cuerpo;
};

/* ==========================================================================
   17. VISTA: ESTUDIO (planificador, Pomodoro y fichas)
   ========================================================================== */
Vistas.estudio = function () {
  const sec = UI.tab || 'plan';
  const secciones = [['plan','Planes','meta'],['sesion','Modo estudio','fuego'],['repaso','Repaso','estudio'],['avance','Avance','reloj']];
  let cuerpo = '';

  if (sec === 'plan') cuerpo = seccionPlanes();
  else if (sec === 'sesion') cuerpo = seccionModoEstudio();
  else if (sec === 'repaso') cuerpo = seccionRepaso();
  else cuerpo = seccionAvanceEstudio();

  return barraTabs(secciones, sec, 'tab', 'mb-4') + cuerpo;
};

/* ------------------------------------------------------------- PLANES ---- */
function seccionPlanes() {
  const planes = store.all('study_plans').filter(p => p.estado === 'activo');
  const atrasadas = Q.sesionesAtrasadas();
  const hoy = Q.sesionesDeHoy();
  const prox = store.all('study_sessions').filter(s => s.fecha > todayISO() && s.estado === 'pendiente')
    .sort(by('fecha')).slice(0, 8);

  return (atrasadas.length
    ? card(cardTitulo('Sesiones atrasadas (' + atrasadas.length + ')',
        btn('Reprogramar todas', 'reprogramar', '', BTN.secundario), 'alerta') +
      listaSep(atrasadas.slice(0, 5).map(filaSesion)), 'mb-3 border-critc-200 dark:border-critc-500/30')
    : '') +

  card(cardTitulo('Hoy', btn(ico('plus', 14) + 'Sesión', 'nueva-sesion', '', BTN.enlace), 'agenda') +
    (hoy.length ? listaSep(hoy.map(filaSesion))
      : vacio('Sin sesiones hoy', 'Crea un plan desde una evaluación o agenda una sesión suelta.',
          btn(ico('plus', 16) + 'Nueva sesión', 'nueva-sesion'), 'estudio')), 'mb-3') +

  card(cardTitulo('Planes activos', btn(ico('plus', 14) + 'Nuevo plan', 'nuevo-plan', '', BTN.enlace), 'meta') +
    (planes.length ? listaSep(planes.map(p => {
      const ses = store.where('study_sessions', s => s.plan_id === p.id);
      const ok = ses.filter(s => s.estado === 'completada').length;
      const pct = ses.length ? Math.round(ok / ses.length * 100) : 0;
      const pendientes = ses.filter(s => s.estado === 'pendiente');
      const minRestantes = pendientes.reduce((a, s) => a + (s.duracion_min || 60), 0);
      const r = Academico.realismo(p.fecha_objetivo, minRestantes);
      const tono = r.nivel === 'holgado' ? 'bg-okc-100 text-okc-700 dark:bg-okc-500/20 dark:text-okc-200'
        : r.nivel === 'ajustado' ? 'bg-warnc-100 text-warnc-700 dark:bg-warnc-500/20 dark:text-warnc-200'
        : 'bg-critc-100 text-critc-700 dark:bg-critc-500/20 dark:text-critc-200';
      return '<div class="px-4 py-3.5">' +
        '<div class="flex items-start justify-between gap-2"><div class="min-w-0">' +
          '<p class="text-[13.5px] font-semibold">' + esc(p.nombre) + '</p>' +
          '<p class="text-[11.5px] text-ink-400">' + esc(Q.nombreSubject(p.subject_id)) + ' · objetivo ' +
            fmtFecha(p.fecha_objetivo) + ' · ' + diffDays(p.fecha_objetivo, todayISO()) + ' días</p></div>' +
          badge(ok + '/' + ses.length + ' sesiones', pct === 100 ? 'bg-okc-100 text-okc-700 dark:bg-okc-500/20 dark:text-okc-200' : CHIP) +
        '</div>' +
        '<div class="mt-2">' + barra(pct, 'bg-uni-500') + '</div>' +
        '<div class="mt-2.5 p-2.5 rounded-xl ' + tono + '">' +
          '<p class="text-[12px] font-medium flex items-center gap-1.5">' +
            ico(r.nivel === 'irreal' ? 'alerta' : r.nivel === 'ajustado' ? 'info' : 'ok', 14) +
            'Plan ' + r.nivel + '</p>' +
          '<p class="text-[11.5px] mt-0.5 leading-snug">' + esc(r.mensaje) + '</p>' +
          '<p class="text-[11px] mt-1 tnum opacity-80">Necesitas ' + Math.round(r.necesario / 60) + ' h · ' +
            'tienes ' + Math.round(r.disponible / 60) + ' h libres en ' + r.dias + ' días</p>' +
        '</div>' +
        '<div class="flex flex-wrap gap-1.5 mt-2.5">' +
          btn('Ver sesiones', 'ver-plan', 'data-id="' + p.id + '"', BTN.enlace) +
          btn('Disponibilidad', 'editar-disponibilidad', '', BTN.enlace) +
          btn('Eliminar plan', 'borrar-plan', 'data-id="' + p.id + '"', BTN.enlace + ' text-critc-500') +
        '</div></div>';
    })) : vacio('Sin planes', 'Crea un plan desde una evaluación: Nexo reparte la materia en tu disponibilidad real, da más tiempo a lo difícil y agrega repasos.',
        btn(ico('plus', 16) + 'Crear plan', 'nuevo-plan'), 'meta')), 'mb-3') +

  card(cardTitulo('Próximas sesiones', '', 'agenda') +
    (prox.length ? listaSep(prox.map(filaSesion))
      : vacio('Sin sesiones futuras', 'Agenda sesiones para las próximas semanas.')));
}

/* ------------------------------------------------------- MODO ESTUDIO ---- */
function seccionModoEstudio() {
  const p = UI.pomodoro;
  const cfg = DB.profile.pomodoro || { foco: 25, descanso: 5, largo: 15, cada: 4 };
  const sesion = p && p.sesionId ? store.get('study_sessions', p.sesionId) : null;
  const candidatas = store.all('study_sessions')
    .filter(s => s.estado !== 'omitida' && s.fecha >= addDays(todayISO(), -7))
    .sort(by('fecha'));

  /* Sin sesión activa: se elige objetivo y material antes de empezar. */
  if (!p) {
    return card(
      cardTitulo('Empezar una sesión de estudio', '', 'fuego') +
      '<div class="px-4 pb-4">' +
        '<p class="text-[12.5px] text-ink-500 dark:text-ink-400 mb-3">Define qué vas a lograr antes de arrancar el reloj. Al terminar te pregunto cómo te fue.</p>' +
        '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">' +
          '<div class="sm:col-span-2"><label class="' + LBL + '" for="ms-sesion">Sesión planificada</label>' +
            '<select id="ms-sesion" class="' + INP + '"><option value="">— Sesión libre, sin plan —</option>' +
            candidatas.map(s => '<option value="' + s.id + '">' + esc(s.titulo) + ' · ' + fmtFecha(s.fecha) + '</option>').join('') +
            '</select></div>' +
          '<div class="sm:col-span-2"><label class="' + LBL + '" for="ms-objetivo">Objetivo de la sesión</label>' +
            '<input id="ms-objetivo" class="' + INP + '" placeholder="Ej: terminar el esquema de garantías del art. 19"></div>' +
          '<div><label class="' + LBL + '" for="ms-asig">Asignatura</label>' +
            '<select id="ms-asig" class="' + INP + '">' + optsSubjects().map(o => '<option value="' + esc(o.v) + '">' + esc(o.l) + '</option>').join('') + '</select></div>' +
          '<div><label class="' + LBL + '" for="ms-material">Material</label>' +
            '<input id="ms-material" class="' + INP + '" placeholder="Apunte, lectura, fichas…"></div>' +
          '<div><label class="' + LBL + '" for="ms-foco">Minutos de foco</label>' +
            '<input id="ms-foco" type="number" min="5" max="120" value="' + cfg.foco + '" class="' + INP + '"></div>' +
          '<div><label class="' + LBL + '" for="ms-descanso">Minutos de descanso</label>' +
            '<input id="ms-descanso" type="number" min="1" max="60" value="' + cfg.descanso + '" class="' + INP + '"></div>' +
        '</div>' +
        '<label class="flex items-center gap-2.5 text-[13px] mt-3 p-3 rounded-lg border border-ink-200 dark:border-ink-800 bg-ink-50 dark:bg-ink-850 cursor-pointer">' +
          '<input type="checkbox" id="ms-zen" class="w-4 h-4 rounded"' + (UI.zen ? ' checked' : '') + '>' +
          '<span><span class="font-medium">Modo sin distracciones</span>' +
          '<span class="block text-[11.5px] text-ink-500 dark:text-ink-400">Oculta menús, alertas y contadores mientras estudias.</span></span></label>' +
        '<div class="mt-3">' + btn(ico('fuego', 16) + 'Comenzar', 'ms-iniciar', '', BTN.primario + ' w-full') + '</div>' +
      '</div>');
  }

  /* Sesión en curso */
  const total = p.fase === 'foco' ? p.duracion * 60 : p.descanso * 60;
  const pct = (1 - p.restante / total) * 100;
  const acumulado = p.acumulado || 0;

  const reloj =
    '<div class="p-6 sm:p-8 text-center">' +
      '<p class="inline-flex items-center gap-1.5 text-[11px] uppercase tracking-wider font-semibold px-2.5 py-1 rounded-full mb-3 ' +
        (p.fase === 'descanso' ? 'bg-per-50 dark:bg-per-900/40 text-per-600 dark:text-per-300' : 'acc-soft acc-text') + '">' +
        ico(p.fase === 'descanso' ? 'personal' : 'fuego', 12) + (p.fase === 'foco' ? 'Foco' : 'Descanso') +
        ' · bloque ' + (p.bloques || 1) + '</p>' +
      (p.objetivo ? '<p class="text-[13.5px] font-medium mb-3 px-4 clamp-2">' + esc(p.objetivo) + '</p>' : '') +
      '<div class="relative w-[190px] h-[190px] mx-auto">' +
        '<svg viewBox="0 0 190 190" class="w-full h-full -rotate-90">' +
          '<circle cx="95" cy="95" r="84" fill="none" stroke="currentColor" class="text-ink-200 dark:text-ink-800" stroke-width="10"/>' +
          '<circle cx="95" cy="95" r="84" fill="none" stroke="' + (p.fase === 'descanso' ? '#0F9D75' : 'var(--acc)') + '" stroke-width="10" stroke-linecap="round" ' +
            'stroke-dasharray="527.8" stroke-dashoffset="' + (527.8 * (1 - clamp(pct, 0, 100) / 100)).toFixed(1) + '" style="transition:stroke-dashoffset .9s linear"/>' +
        '</svg>' +
        '<div class="absolute inset-0 grid place-items-center">' +
          '<p id="pomo-display" class="text-[44px] font-semibold tnum tracking-tight leading-none ' +
            (p.fase === 'descanso' ? 'text-per-600 dark:text-per-300' : 'acc-text') + '">' + fmtMMSS(p.restante) + '</p></div>' +
      '</div>' +
      '<div class="flex justify-center gap-4 mt-4 text-[12px] text-ink-500 dark:text-ink-400">' +
        '<span class="inline-flex items-center gap-1">' + ico('reloj', 13) + '<span class="tnum">' + acumulado + ' min efectivos</span></span>' +
        '<span class="inline-flex items-center gap-1">' + ico('personal', 13) + '<span class="tnum">' + (p.pausas || 0) + ' pausa(s)</span></span>' +
      '</div>' +
      '<div class="flex justify-center gap-2 mt-4 flex-wrap">' +
        (p.corriendo ? btn(ico('reloj', 16) + 'Pausar', 'ms-pausa', '', BTN.secundario)
                     : btn(ico('fuego', 16) + 'Continuar', 'ms-reanudar')) +
        btn('Saltar fase', 'ms-saltar', '', BTN.fantasma) +
        btn(ico('check', 16) + 'Terminar sesión', 'ms-terminar', '', BTN.exito) +
      '</div>' +
      (sesion ? '<p class="text-[11.5px] text-ink-400 mt-4">Vinculada a: ' + esc(sesion.titulo) + '</p>' : '') +
    '</div>';

  if (UI.zen) {
    return '<div class="fixed inset-0 z-[70] bg-[var(--page)] flex flex-col items-center justify-center p-6">' +
      '<div class="w-full max-w-md surface shadow-pop">' + reloj + '</div>' +
      '<button type="button" data-act="ms-zen-salir" class="' + BTN.fantasma + ' mt-4">Salir del modo sin distracciones</button>' +
    '</div>';
  }

  return card(reloj) +
    '<div class="mt-3">' + card(cardTitulo('Durante la sesión', '', 'info') +
      '<div class="px-4 pb-4 flex flex-wrap gap-2">' +
        btn(ico('personal', 15) + 'Registrar pausa', 'ms-pausa-registrar', '', BTN.secundario) +
        btn(ico('fuego', 15) + 'Modo sin distracciones', 'ms-zen', '', BTN.secundario) +
        (sesion && sesion.reading_id ? btn('Anotar página', 'lectura-pagina', 'data-id="' + sesion.reading_id + '"', BTN.secundario) : '') +
      '</div>') + '</div>';
}

/* ------------------------------------------------------------- REPASO ---- */
function seccionRepaso() {
  const f = UI.repasoFiltro || {};
  const cola = Academico.colaRepaso(f);
  const actual = UI.repasoActual ? store.get('flashcards', UI.repasoActual) : cola[0] && cola[0].item;
  const totalHoy = cola.length;
  const sesion = UI.repasoSesion || { correctas: 0, incorrectas: 0, inicio: Date.now() };

  const filtros = card(
    cardTitulo('Repaso de hoy', badge(totalHoy + ' pendiente(s)', CHIP) +
      btn(ico('plus', 14) + 'Nueva pregunta', 'nueva-ficha', '', BTN.enlace), 'estudio') +
    '<div class="px-4 pb-4">' +
      '<div class="flex flex-wrap gap-1.5">' +
        [['', 'Todo'], ['ficha', 'Fichas'], ['seleccion_multiple', 'Selección múltiple'], ['desarrollo', 'Desarrollo']]
          .map(([v, l]) => '<button type="button" data-act="repaso-tipo" data-v="' + v + '" class="press focus-ring text-[12px] px-2.5 py-1.5 rounded-lg ' +
            ((f.tipo || '') === v ? 'acc-bg text-white' : 'bg-ink-100 dark:bg-ink-850 text-ink-600 dark:text-ink-300') + '">' + l + '</button>').join('') +
        '<button type="button" data-act="repaso-debiles-toggle" class="press focus-ring text-[12px] px-2.5 py-1.5 rounded-lg ' +
          (f.debiles ? 'bg-warnc-500 text-white' : 'bg-ink-100 dark:bg-ink-850 text-ink-600 dark:text-ink-300') + '">Solo temas débiles</button>' +
      '</div>' +
      '<select data-act="repaso-asig" class="' + INP + ' mt-2">' +
        '<option value="">Todas las asignaturas</option>' +
        store.all('subjects').map(s => '<option value="' + s.id + '"' + (f.subject_id === s.id ? ' selected' : '') + '>' + esc(s.nombre) + '</option>').join('') +
      '</select>' +
      '<div class="flex items-center gap-3 mt-3 text-[12px] text-ink-500 dark:text-ink-400">' +
        '<span class="inline-flex items-center gap-1 text-okc-600 dark:text-okc-300">' + ico('check', 13) + '<span class="tnum">' + sesion.correctas + '</span></span>' +
        '<span class="inline-flex items-center gap-1 text-critc-500">' + ico('cerrar', 13) + '<span class="tnum">' + sesion.incorrectas + '</span></span>' +
        (sesion.correctas + sesion.incorrectas ? '<span class="tnum">' + Math.round(sesion.correctas * 100 / (sesion.correctas + sesion.incorrectas)) + '% de aciertos</span>' : '') +
      '</div>' +
    '</div>');

  if (!actual) {
    return filtros + '<div class="mt-3">' + card(vacio('Nada por repasar',
      f.debiles || f.tipo || f.subject_id
        ? 'Con esos filtros no queda material para hoy. Prueba quitando alguno.'
        : 'Ya repasaste todo lo que tocaba. Crea fichas desde tus apuntes o conceptos para seguir.',
      btn('Generar desde mis apuntes', 'fichas-desde-todo', '', BTN.secundario), 'ok')) + '</div>';
  }

  const esMC = actual.tipo === 'seleccion_multiple';
  const revelada = UI.repasoRevelada;

  const tarjeta = card(
    '<div class="p-5">' +
      '<div class="flex items-center justify-between gap-2 mb-3">' +
        badge(TIPO_PREGUNTA[actual.tipo] || 'Ficha', 'bg-uni-50 text-uni-700 dark:bg-uni-500/20 dark:text-uni-100') +
        '<span class="text-[11px] text-ink-400">' + esc(Q.nombreSubject(actual.subject_id) || 'Sin asignatura') +
          (actual.unit_id ? ' · ' + esc((store.get('units', actual.unit_id) || {}).nombre || '') : '') + '</span>' +
      '</div>' +
      '<div class="rounded-xl2 bg-uni-50 dark:bg-uni-500/10 p-5 text-center">' +
        '<p class="text-[15px] font-medium leading-snug prose-note">' + esc(actual.pregunta) + '</p>' +
        (esMC && (actual.opciones || []).length
          ? '<div class="mt-4 flex flex-col gap-1.5 max-w-md mx-auto">' + actual.opciones.map((o, i) =>
              '<button type="button" data-act="repaso-opcion" data-i="' + i + '" class="press focus-ring text-[13px] text-left px-3 py-2.5 rounded-lg ' +
              (revelada
                ? (o.correcta ? 'bg-okc-100 text-okc-700 dark:bg-okc-500/20 dark:text-okc-200 font-medium'
                              : (UI.repasoElegida === i ? 'bg-critc-100 text-critc-700 dark:bg-critc-500/20 dark:text-critc-200' : 'bg-white dark:bg-ink-800 opacity-60'))
                : 'bg-white dark:bg-ink-800 hover:ring-1 hover:ring-uni-400') + '">' +
              (revelada && o.correcta ? '✓ ' : revelada && UI.repasoElegida === i ? '✕ ' : '') + esc(o.texto) + '</button>').join('') + '</div>'
          : '') +
        (revelada && actual.respuesta
          ? '<div class="mt-4 pt-4 border-t border-uni-200 dark:border-uni-500/30 text-left">' +
            '<p class="text-[10.5px] uppercase tracking-wider font-semibold text-uni-700 dark:text-uni-200 mb-1">Tu respuesta guardada</p>' +
            '<p class="text-[13px] prose-note">' + esc(actual.respuesta) + '</p></div>'
          : '') +
      '</div>' +
      '<div class="flex flex-wrap justify-center gap-2 mt-4">' +
        (revelada
          ? btn(ico('cerrar', 15) + 'No la sabía', 'repaso-mal', 'data-id="' + actual.id + '"', BTN.secundario) +
            btn(ico('check', 15) + 'La sabía', 'repaso-bien', 'data-id="' + actual.id + '"', BTN.exito) +
            btn('Saltar', 'repaso-saltar', '', BTN.fantasma)
          : btn('Mostrar respuesta', 'repaso-revelar')) +
      '</div>' +
      '<p class="text-[11px] text-ink-400 text-center mt-3">Si aciertas, vuelve en ' +
        [1, 3, 7, 14, 30][Math.min(4, [1, 3, 7, 14, 30].indexOf(actual.intervalo_dias) + 1)] + ' días. Si fallas, mañana.</p>' +
    '</div>');

  /* Casos prácticos como modalidad de repaso */
  const casos = store.all('cases').filter(c => !f.subject_id || c.subject_id === f.subject_id);
  const cardCasos = casos.length ? '<div class="mt-3">' + card(
    cardTitulo('Repasar con casos prácticos', '', 'meta') +
    '<div class="px-4 pb-4 flex flex-col gap-1.5">' + casos.slice(0, 4).map(c =>
      '<button type="button" data-act="repasar-caso" data-id="' + c.id + '" class="press focus-ring w-full text-left flex items-center gap-2.5 p-2.5 rounded-xl hover:bg-ink-100 dark:hover:bg-ink-850">' +
        '<span class="w-8 h-8 shrink-0 rounded-lg grid place-items-center bg-uni-50 dark:bg-uni-900/40 text-uni-600 dark:text-uni-300">' + ico('meta', 15) + '</span>' +
        '<span class="min-w-0 flex-1"><span class="block text-[13px] font-medium truncate">' + esc(c.titulo) + '</span>' +
        '<span class="block text-[11px] text-ink-400 truncate">' + esc(Q.nombreSubject(c.subject_id) || '') + '</span></span>' +
        '<span class="text-ink-300 dark:text-ink-600">' + ico('flecha', 14) + '</span></button>').join('') + '</div>') + '</div>' : '';

  return filtros + '<div class="mt-3">' + tarjeta + '</div>' + cardCasos;
}

/* ------------------------------------------------------------- AVANCE ---- */
function seccionAvanceEstudio() {
  const sem = Academico.horasSemana();
  const semAnt = Academico.horasSemana(-1);
  const ses = store.all('study_sessions');
  const mes = ses.filter(s => s.fecha.slice(0, 7) === todayISO().slice(0, 7));
  const minMes = mes.reduce((a, s) => a + (s.minutos_efectivos || 0), 0);
  const porAsig = {};
  ses.filter(s => s.minutos_efectivos).forEach(s => {
    const k = Q.nombreSubject(s.subject_id) || 'Sin asignatura';
    porAsig[k] = (porAsig[k] || 0) + s.minutos_efectivos;
  });
  const maxA = Math.max(1, ...Object.values(porAsig));
  const prec = Academico.precisionPorAsignatura();
  const conFoco = ses.filter(s => s.concentracion);
  const foco = {};
  conFoco.forEach(s => { foco[s.concentracion] = (foco[s.concentracion] || 0) + 1; });

  return '<div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5 mb-4">' +
      metrica('Esta semana', Math.floor(sem.minutos / 60) + ' h ' + (sem.minutos % 60) + 'm',
        { ic: 'reloj', tono: sem.minutos >= sem.meta ? 'ok' : 'acento' }) +
      metrica('Semana anterior', Math.floor(semAnt.minutos / 60) + ' h', { ic: 'reloj' }) +
      metrica('Este mes', Math.floor(minMes / 60) + ' h', { ic: 'meta' }) +
      metrica('Pausas registradas', sem.pausas, { ic: 'personal' }) +
    '</div>' +

    card(cardTitulo('Meta semanal', btn('Cambiar meta', 'cambiar-meta', '', BTN.enlace), 'meta') +
      '<div class="px-4 pb-4">' +
        '<div class="flex items-center justify-between text-[12px] mb-1.5">' +
          '<span class="text-ink-500 dark:text-ink-400">' + Math.floor(sem.minutos / 60) + ' h de ' + Math.round(sem.meta / 60) + ' h</span>' +
          '<span class="font-semibold tnum">' + sem.pct + '%</span></div>' +
        barra(sem.pct, sem.pct >= 100 ? 'bg-okc-500' : 'bg-uni-500') +
        '<p class="text-[11.5px] text-ink-400 mt-2">Semana del ' + fmtFecha(sem.ini) + ' al ' + fmtFecha(sem.fin) + '</p>' +
      '</div>', 'mb-3') +

    '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">' +
      card(cardTitulo('Tiempo por asignatura', '', 'universidad') +
        (Object.keys(porAsig).length
          ? '<div class="px-4 pb-4 flex flex-col gap-2.5">' + Object.entries(porAsig).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
              '<div><div class="flex justify-between text-[12px] mb-1"><span class="truncate">' + esc(k) + '</span>' +
              '<span class="font-semibold tnum">' + Math.floor(v / 60) + ' h ' + (v % 60) + 'm</span></div>' +
              barra(v / maxA * 100, 'bg-uni-500') + '</div>').join('') + '</div>'
          : vacio('Sin tiempo registrado', 'Usa el modo de estudio para registrar tus horas.', '', 'reloj'))) +

      card(cardTitulo('Precisión en el repaso', '', 'estudio') +
        (Object.keys(prec).length
          ? '<div class="px-4 pb-4 flex flex-col gap-2.5">' + Object.entries(prec).map(([sid, x]) =>
              '<div><div class="flex justify-between text-[12px] mb-1">' +
              '<span class="truncate">' + esc(Q.nombreSubject(sid) || 'Sin asignatura') + '</span>' +
              '<span class="font-semibold tnum">' + x.pct + '% · ' + x.intentos + ' intentos</span></div>' +
              barra(x.pct, x.pct >= 70 ? 'bg-okc-500' : x.pct >= 40 ? 'bg-warnc-500' : 'bg-critc-500') + '</div>').join('') + '</div>'
          : vacio('Sin repasos', 'Responde fichas y preguntas para medir tu precisión.', '', 'estudio'))) +

      card(cardTitulo('Cómo te has sentido', '', 'fuego') +
        (conFoco.length
          ? '<div class="px-4 pb-4 flex gap-2">' + Object.keys(CONCENTRACION).map(k =>
              '<div class="flex-1 rounded-xl px-3 py-3 text-center ' + CONCENTRACION[k].cls + '">' +
              '<p class="text-[20px] font-bold tnum leading-none">' + (foco[k] || 0) + '</p>' +
              '<p class="text-[11px] mt-1">Concentración ' + CONCENTRACION[k].label.toLowerCase() + '</p></div>').join('') + '</div>'
          : vacio('Sin registros', 'Al cerrar una sesión te pregunto cómo te sentiste.', '', 'fuego'))) +

      card(cardTitulo('Últimas sesiones', '', 'reloj') +
        (ses.filter(s => s.estado === 'completada').length
          ? listaSep(ses.filter(s => s.estado === 'completada').sort(by('fecha', -1)).slice(0, 6).map(s =>
              '<div class="px-4 py-3">' +
                '<div class="flex items-start justify-between gap-2">' +
                  '<div class="min-w-0"><p class="text-[13px] font-medium truncate">' + esc(s.titulo) + '</p>' +
                  '<p class="text-[11px] text-ink-400">' + fmtFecha(s.fecha) + ' · ' + (s.minutos_efectivos || 0) + ' min' +
                    (s.pausas ? ' · ' + s.pausas + ' pausa(s)' : '') + '</p></div>' +
                  (s.concentracion ? badge(CONCENTRACION[s.concentracion].label, CONCENTRACION[s.concentracion].cls) : '') +
                '</div>' +
                (s.objetivo ? '<p class="text-[11.5px] text-ink-500 dark:text-ink-400 mt-1 clamp-1">Objetivo: ' + esc(s.objetivo) + '</p>' : '') +
                (s.proximo_paso ? '<p class="text-[11.5px] acc-text mt-0.5 clamp-1">Siguiente: ' + esc(s.proximo_paso) + '</p>' : '') +
              '</div>'))
          : vacio('Sin sesiones completadas', 'Cuando cierres una sesión aparecerá acá.', '', 'estudio'))) +
    '</div>';
}

function filaSesion(s) {
  const atras = s.estado === 'pendiente' && s.fecha < todayISO();
  return '<div class="flex items-center gap-3 px-4 py-3 border-l-[3px] border-uni-500 ' + (atras ? 'bg-critc-50/50 dark:bg-critc-500/10' : '') + '">' +
    casilla('toggle-sesion', s.id, s.estado === 'completada', 'Marcar sesión: ' + s.titulo) +
    '<div class="min-w-0 flex-1"><p class="text-sm font-medium ' + (s.estado === 'completada' ? 'line-through text-ink-400' : '') + '">' + esc(s.titulo) + '</p>' +
    '<p class="text-[11px] text-ink-500 dark:text-ink-400">' + esc(Q.nombreSubject(s.subject_id) || '') + ' · ' + fmtFecha(s.fecha) + (s.hora ? ' ' + s.hora : '') + ' · ' + s.duracion_min + ' min · ' + s.tipo +
      (s.minutos_efectivos ? ' · ' + s.minutos_efectivos + ' min efectivos' : '') + '</p></div>' +
    (atras ? badge('Atrasada', 'bg-critc-50 text-critc-600 dark:bg-critc-500/20 dark:text-critc-100') : '') +
    '<button data-act="editar-sesion" data-id="' + s.id + '" class="focus-ring text-[11px] text-ink-400 px-1">Editar</button>' +
  '</div>';
}
function fmtMMSS(seg) { return String(Math.floor(seg / 60)).padStart(2, '0') + ':' + String(seg % 60).padStart(2, '0'); }


/* --------------------------------------------------------------------------
   Cierre de una sesión de estudio: se registra lo que realmente pasó.
   -------------------------------------------------------------------------- */
function cerrarSesionEstudio() {
  const p = UI.pomodoro;
  if (!p) return;
  const usados = (p.acumulado || 0) + (p.fase === 'foco' ? Math.round((p.duracion * 60 - p.restante) / 60) : 0);
  const sesion = p.sesionId ? store.get('study_sessions', p.sesionId) : null;
  if (pomoTimer) { clearInterval(pomoTimer); pomoTimer = null; }
  UI.pomodoro = null; UI.zen = false;

  openForm({
    title: 'Cerrar la sesión',
    sub: usados + ' minutos efectivos · ' + (p.pausas || 0) + ' pausa(s)',
    ancho: 'max-w-md',
    fields: [
      { k: 'resultado', label: '¿Cómo terminó?', type: 'select', col: 2,
        opts: Object.keys(RESULTADO_SESION).filter(k => k !== 'pendiente').map(k => ({ v: k, l: RESULTADO_SESION[k].label })) },
      { k: 'concentracion', label: 'Nivel de concentración', type: 'select', col: 2,
        opts: Object.keys(CONCENTRACION).map(k => ({ v: k, l: CONCENTRACION[k].label })) },
      { k: 'minutos', label: 'Minutos efectivos', type: 'number', min: 0 },
      { k: 'pausas', label: 'Pausas', type: 'number', min: 0 },
      { k: 'proximo_paso', label: 'Próximo paso', type: 'textarea', col: 2,
        hint: 'Qué harás la próxima vez que retomes esto.' },
      { k: 'notas', label: 'Notas de la sesión', type: 'textarea', col: 2 }
    ],
    values: { resultado: 'completada', concentracion: 'media', minutos: usados, pausas: p.pausas || 0,

/* --- Pomodoro --- */
let pomoTimer = null;
function pomoTick() {
  const p = UI.pomodoro; if (!p || !p.corriendo) return;
  p.restante--;
  const d = document.getElementById('pomo-display');
  if (d) d.textContent = fmtMMSS(Math.max(0, p.restante));
  if (p.restante <= 0) {
    clearInterval(pomoTimer); pomoTimer = null; p.corriendo = false;
    const cfg = DB.profile.pomodoro || { largo: 15, cada: 4 };
    if (p.fase === 'foco') {
      p.acumulado = (p.acumulado || 0) + p.duracion;
      p.bloques = (p.bloques || 1);
      /* Cada cuatro bloques toca un descanso largo. */
      const largo = p.bloques % (cfg.cada || 4) === 0;
      p.fase = 'descanso';
      p.descanso = largo ? (cfg.largo || 15) : (p.descanso || cfg.descanso || 5);
      p.restante = p.descanso * 60;
      toast('Bloque completado. ' + p.descanso + ' minutos de descanso' + (largo ? ' largo' : '') + '.');
    } else {
      p.bloques = (p.bloques || 1) + 1;
      p.fase = 'foco'; p.restante = p.duracion * 60;
      p.descanso = (DB.profile.pomodoro || {}).descanso || 5;
      toast('Descanso terminado. Bloque ' + p.bloques + '.');
    }
    render();
  }
}

const Herramientas = {
  /* Generador de mensajes profesionales. Plantillas propias, sin IA. */
  mensaje({ tono, destinatario, asunto, marca }) {
    const m = marca ? ' de ' + marca : '';
    const saludos = {
      equipo: { cercano: 'Hola equipo, ¿cómo están?', ejecutivo: 'Estimado equipo:', firme: 'Equipo:', motivacional: '¡Hola equipo!', breve: 'Equipo:' },
      cliente: { cercano: 'Hola, ¿cómo estás?', ejecutivo: 'Estimado/a:', firme: 'Estimado/a:', motivacional: 'Hola, ¿cómo estás?', breve: 'Hola:' },
      rrhh: { cercano: 'Hola, ¿cómo estás?', ejecutivo: 'Estimados:', firme: 'Estimados:', motivacional: 'Hola:', breve: 'Hola:' }
    };
    const cuerpos = {
      cercano: 'Les escribo para pedirles su apoyo con ' + asunto + m + '. Es importante para poder cerrar la información a tiempo y responderle bien al cliente.',
      ejecutivo: 'Solicito su gestión respecto de ' + asunto + m + '. Esta información es necesaria para consolidar el reporte y mantener la continuidad operativa.',
      firme: 'Necesito ' + asunto + m + ' con carácter prioritario. Este punto ya fue solicitado anteriormente y su demora está afectando el cumplimiento comprometido con el cliente.',
      motivacional: 'Vamos avanzando bien y quiero pedirles un último empujón con ' + asunto + m + '. Con esto cerramos la semana ordenados y con todo respaldado.',
      breve: 'Necesito ' + asunto + m + '.'
    };
    const cierres = {
      cercano: 'Cualquier duda me avisan. ¡Gracias!',
      ejecutivo: 'Quedo atento a su confirmación.\n\nSaludos cordiales,\nCarlos Quinteros\nCoordinador Trade Marketing',
      firme: 'Agradeceré su respuesta hoy antes del cierre de jornada.\n\nSaludos,\nCarlos Quinteros\nCoordinador Trade Marketing',
      motivacional: '¡Gracias por el trabajo de siempre!',
      breve: 'Gracias.'
    };
    return (saludos[destinatario] || saludos.equipo)[tono] + '\n\n' + cuerpos[tono] + '\n\n' + cierres[tono];
  },

  horas(inicio, fin, colacionMin) {
    if (!inicio || !fin) return null;
    const a = Number(inicio.slice(0, 2)) * 60 + Number(inicio.slice(3, 5));
    let b = Number(fin.slice(0, 2)) * 60 + Number(fin.slice(3, 5));
    if (b < a) b += 24 * 60;
    const bruto = b - a;
    const neto = Math.max(0, bruto - (Number(colacionMin) || 0));
    return { bruto, neto };
  },
  iva(monto, modo) {
    const v = Number(monto) || 0;
    if (modo === 'con_iva') { const neto = v / 1.19; return { neto, iva: v - neto, total: v }; }
    const iva = v * 0.19; return { neto: v, iva, total: v + iva };
  },
  meta(metaVal, actual) {
    const m = Number(metaVal) || 0, a = Number(actual) || 0;
    return { pct: m ? a / m * 100 : 0, falta: Math.max(0, m - a) };
  }
};

function formMarca(b) {
  const v = b || { nombre: '', cliente: '', categoria: '', estado: 'al_dia', contactosTxt: '', documentosTxt: '', notas: '' };
  openForm({
    title: b ? 'Editar marca' : 'Nueva marca',
    fields: [
      { k: 'nombre', label: 'Nombre de la marca', req: true },
      { k: 'cliente', label: 'Cliente / empresa' },
      { k: 'categoria', label: 'Categoría' },
      { k: 'estado', label: 'Semáforo', type: 'select', opts: Object.keys(SEMAFORO).map(k => ({ v: k, l: SEMAFORO[k].label })) },
      { k: 'contactosTxt', label: 'Contactos', type: 'textarea', col: 2, hint: 'Una línea por contacto: Nombre | Cargo | correo | teléfono' },
      { k: 'documentosTxt', label: 'Documentos', type: 'links', col: 2, hint: 'Título | https://…' },
      { k: 'notas', label: 'Notas', type: 'textarea', col: 2 }
    ],
    values: Object.assign({}, v, {
      contactosTxt: (v.contactos || []).map(c => [c.nombre, c.cargo, c.email, c.telefono].filter(Boolean).join(' | ')).join('\n'),
      documentosTxt: v.documentos || []
    }),
    onSave(d) {
      d.contactos = (d.contactosTxt || '').split('\n').filter(Boolean).map(l => {
        const p = l.split('|').map(x => x.trim());
        return { nombre: p[0] || '', cargo: p[1] || '', email: p[2] || '', telefono: p[3] || '' };
      });
      d.documentos = d.documentosTxt || [];
      delete d.contactosTxt; delete d.documentosTxt;
      if (b) store.update('brands', b.id, d); else store.insert('brands', Object.assign({ color: '#0D5C63', activo: true }, d));
      toast('Marca guardada'); render();
    }
  });
}

/**
 * Deriva contenido de un apunte SIN tocar el original.
 * El resumen y las listas los escribe el usuario; Nexo solo propone una
 * primera versión a partir de su propio texto, nunca de fuentes externas.
 */
function derivarApunte(id) {
  const n = store.get('legal_notes', id); if (!n) return;
  const lineas = String(n.texto_original || '').split('\n').map(x => x.trim()).filter(Boolean);
  const propuestaResumen = n.resumen || lineas.slice(0, 2).join(' ');
  /* Detección conservadora: solo marca lo que el propio texto menciona. */
  const normasDetectadas = (n.texto_original || '').match(/\b(art[íi]culo\s+\d+[^,.;\n]*|ley\s+n?°?\s*[\d.]+|c[óo]digo\s+\w+)/gi) || [];
  const fallosDetectados = (n.texto_original || '').match(/\brol\s+[\d.\-]+[^,.;\n]*/gi) || [];

  openForm({
    title: 'Contenido derivado', ancho: 'max-w-2xl',
    sub: 'El texto original queda intacto',
    nota: 'Nexo <strong>no interpreta ni completa</strong> el contenido jurídico: solo separa lo que ya escribiste. ' +
      'Todo lo que aparezca acá debe verificarse en fuente oficial antes de citarlo.',
    fields: [
      { k: 'resumen', label: 'Resumen', type: 'textarea', rows: 4, col: 2 },
      { k: 'conceptos', label: 'Conceptos principales', type: 'tags', col: 2 },
      { k: 'normas', label: 'Normas mencionadas', type: 'tags', col: 2,
        hint: 'Detectadas en tu texto: ' + (normasDetectadas.length ? normasDetectadas.join(' · ') : 'ninguna') },
      { k: 'jurisprudencia', label: 'Jurisprudencia mencionada', type: 'tags', col: 2,
        hint: 'Detectada en tu texto: ' + (fallosDetectados.length ? fallosDetectados.join(' · ') : 'ninguna') }
    ],
    values: {
      resumen: propuestaResumen,
      conceptos: (n.conceptos || []).length ? n.conceptos : [],
      normas: (n.normas || []).length ? n.normas : normasDetectadas.map(x => x.trim()),
      jurisprudencia: (n.jurisprudencia || []).length ? n.jurisprudencia : fallosDetectados.map(x => x.trim())
    },
    guardar: 'Guardar derivado',
    onSave(d) {
      store.update('legal_notes', id, Object.assign({ derivado_por: 'usuario', derivado_en: nowNaive() }, d));
      toast('Contenido derivado guardado. Tu texto original no cambió.', 'exito'); render();
    }
  });
}

/** Crea fichas de repaso a partir de los conceptos de un apunte. */
function fichasDesdeApunte(id) {
  const n = store.get('legal_notes', id); if (!n) return;
