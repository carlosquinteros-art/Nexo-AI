/** Primera vez con sesión: decidir qué hacer con los datos locales. */
async function abrirPrimeraSincronizacion() {
  let remotas = 0;
  try {
    const { count } = await Nube.client.from('tasks').select('id', { count: 'exact', head: true });
    remotas = count || 0;
  } catch (e) { /* si falla, tratamos la cuenta como vacía */ }

  const locales = (DB.tasks || []).length + (DB.brands || []).length;
  if (remotas === 0 && locales === 0) return;

  const opcion = (act, icono, titulo, detalle, tono) =>
    '<button type="button" data-act="' + act + '" class="press focus-ring w-full text-left flex items-start gap-3 p-3.5 rounded-xl2 border ' +
    (tono === 'primario' ? 'acc-border acc-soft' : 'border-ink-200 dark:border-ink-800 hover:bg-ink-50 dark:hover:bg-ink-850') + '">' +
    '<span class="w-9 h-9 shrink-0 rounded-lg grid place-items-center ' + (tono === 'primario' ? 'acc-bg text-white' : 'bg-ink-100 dark:bg-ink-800 text-ink-500') + '">' + ico(icono, 18) + '</span>' +
    '<span class="min-w-0"><span class="block text-[13.5px] font-semibold">' + titulo + '</span>' +
    '<span class="block text-[12px] text-ink-500 dark:text-ink-400 mt-0.5 leading-snug">' + detalle + '</span></span></button>';

  abrirModal('¿Con qué datos partimos?',
    '<div class="flex flex-col gap-2">' +
      (remotas > 0
        ? opcion('sync-bajar', 'flecha', 'Usar mis datos de la nube',
            'Tu cuenta ya tiene ' + remotas + ' tarea(s) guardada(s). Se reemplaza lo que hay en este navegador.', 'primario')
        : '') +
      (locales > 0
        ? opcion('sync-subir', 'enviar', 'Subir lo que tengo en este equipo',
            'Se envían tus ' + locales + ' registro(s) locales a Supabase. Úsalo la primera vez.', remotas ? '' : 'primario')
        : '') +
      opcion('sync-demo', 'meta', 'Cargar datos de ejemplo en la nube',
        'Siembra la cuenta con marcas y asignaturas de muestra para explorar.', '') +
      opcion('modal-cerrar', 'cerrar', 'Decidir después',
        'Puedes hacerlo cuando quieras desde Configuración → Sincronización.', '') +
    '</div>', '', 'max-w-lg', 'Esta elección se puede repetir después');
}

/** Ejecuta una sincronización mostrando estado de carga y errores claros. */
async function sincronizar(direccion) {
  cerrarModal();
  UI.cargando = true; render();
  try {
    if (direccion === 'subir') { await Nube.subir(); toast('Datos enviados a Supabase', 'exito'); }
    else if (direccion === 'bajar') { await Nube.bajar(); toast('Datos descargados', 'exito'); }
    else { const msg = await Nube.cargarDemoEnLaNube(); toast(msg || 'Datos de ejemplo cargados', 'exito'); await Nube.bajar(); }
  } catch (e) {
    toast(mensajeAuth(e), 'error');
  } finally {
    UI.cargando = false; render();
  }
}

/* ==========================================================================
   10. PLANIFICADOR DE ESTUDIO
   ========================================================================== */
const Planificador = {
  /* Devuelve n bloques libres a partir de una fecha, usando la disponibilidad
     declarada en Configuración y evitando choques con clases y sesiones ya
     programadas.                                                            */
  slotsLibres(desde, diasMax, n) {
    const disp = DB.profile.disponibilidad_estudio || [];
    const out = [];
    for (let i = 0; i < diasMax && out.length < n; i++) {
      const fecha = addDays(desde, i);
      const dia = dayOfWeek(fecha);
      const ventanas = disp.filter(d => Number(d.dia) === dia);
      const yaEseDia = store.where('study_sessions', s => s.fecha === fecha && s.estado === 'pendiente').length;
      let usados = yaEseDia;
      for (const v of ventanas) {
        if (out.length >= n) break;
        if (usados >= 2) break;
        const dur = Math.min(90, Math.max(45, (Number(v.fin.slice(0, 2)) - Number(v.inicio.slice(0, 2))) * 60));
        out.push({ fecha, hora: v.inicio, duracion: dur });
        usados++;
      }
    }
    return out;
  },

  /* Genera el plan: reparte unidades priorizando bajo dominio y alta dificultad,
     y agrega repasos espaciados a 3 y 7 días.                                */
  generar({ subject_id, evaluation_id, nombre, fecha_objetivo, unidades, horas_semana }) {
    const plan = store.insert('study_plans', { subject_id, evaluation_id: evaluation_id || null, nombre,
      fecha_objetivo, horas_semana: Number(horas_semana) || 6, estado: 'activo' });

    const us = unidades.map(uid2 => store.get('units', uid2)).filter(Boolean);
    const peso = (u) => (5 - (DOMINIO[u.dominio]?.pct || 0) / 25) + Number(u.dificultad || 3);
    const total = us.reduce((a, u) => a + peso(u), 0) || 1;
    const diasDisp = Math.max(1, diffDays(fecha_objetivo, todayISO()));
    const slots = Planificador.slotsLibres(todayISO(), diasDisp, 40);
    if (!slots.length) { toast('No hay disponibilidad declarada. Revisa Configuración.', 'warn'); return plan; }

    // Reservamos el 75% de los bloques para materia nueva y el resto para repaso final
    const nEstudio = Math.max(us.length, Math.floor(slots.length * 0.75));
    const reparto = us.map(u => ({ u, n: Math.max(1, Math.round(peso(u) / total * nEstudio)) }));
    let i = 0;
    const creadas = [];
    reparto.forEach(({ u, n }) => {
      for (let k = 0; k < n && i < slots.length; k++, i++) {
        const s = slots[i];
        const ses = store.insert('study_sessions', { plan_id: plan.id, subject_id, unit_id: u.id,
          titulo: (k === 0 ? 'Estudio: ' : 'Profundizar: ') + u.nombre, fecha: s.fecha, hora: s.hora,
          duracion_min: s.duracion, tipo: k === 0 ? 'estudio' : 'ejercicios', estado: 'pendiente', minutos_efectivos: 0, notas: '' });
        creadas.push(ses);
      }
    });
    // Repasos espaciados (3 y 7 días después de la primera sesión de cada unidad)
    const primeras = {};
    creadas.forEach(s => { if (!primeras[s.unit_id]) primeras[s.unit_id] = s; });
    Object.values(primeras).forEach(s => {
      [3, 7].forEach(d => {
        const f = addDays(s.fecha, d);
        if (f < fecha_objetivo) {
          store.insert('study_sessions', { plan_id: plan.id, subject_id, unit_id: s.unit_id,
            titulo: 'Repaso (' + d + ' días): ' + (store.get('units', s.unit_id)?.nombre || ''),
            fecha: f, hora: s.hora, duracion_min: 45, tipo: 'repaso', estado: 'pendiente', minutos_efectivos: 0, notas: '' });
        }
      });
    });
    // Simulacro el día anterior
    const vispera = addDays(fecha_objetivo, -1);
    if (vispera >= todayISO()) {
      store.insert('study_sessions', { plan_id: plan.id, subject_id, unit_id: null, titulo: 'Simulacro y repaso general',
        fecha: vispera, hora: (slots[0] || {}).hora || '20:30', duracion_min: 90, tipo: 'ejercicios', estado: 'pendiente', minutos_efectivos: 0, notas: '' });
    }
    return plan;
  }
};

const NUM_PALABRA = {
  un: 1, uno: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8,
  nueve: 9, diez: 10, once: 11, doce: 12, trece: 13, catorce: 14, quince: 15, dieciseis: 16,
  diecisiete: 17, dieciocho: 18, diecinueve: 19, veinte: 20, treinta: 30, cuarenta: 40,
  cincuenta: 50, sesenta: 60, media: 0.5, medio: 0.5
};
const DIAS_SEM = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];

/** Número escrito con dígitos o con palabras. */
function numeroDe(txt) {
  if (txt == null) return null;
  const s = String(txt).trim().toLowerCase().replace(/\./g, '').replace(',', '.');
  if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
  if (NUM_PALABRA[s] != null) return NUM_PALABRA[s];
  const m = s.match(/^(\w+)\s+y\s+(media|medio)$/);
  if (m && NUM_PALABRA[m[1]] != null) return NUM_PALABRA[m[1]] + 0.5;
  return null;
}
const NUM_RE = '(\\d+(?:[.,]\\d+)?|' + Object.keys(NUM_PALABRA).join('|') + ')';

const NLU = {
  /* ---------------------------------------------------------------- Fechas */
  /**
   * Devuelve { fecha, fechaFin, etiqueta } en ISO local (America/Santiago).
   * Entiende: hoy, mañana, pasado mañana, el viernes, el próximo viernes,
   * en dos semanas, el 2 de septiembre, 28/08, este fin de semana,
   * hasta el viernes, desde mañana.
   */
  fecha(texto) {
    const n = ' ' + slug(texto) + ' ';
    const hoy = todayISO();
    const rango = /\b(hasta|antes del|antes de|para el|desde)\b/.test(n);
    let f = null, etiqueta = '';

    const set = (v, e) => { if (!f) { f = v; etiqueta = e; } };

    if (/\bhoy\b/.test(n)) set(hoy, 'hoy');
    if (/pasado manana/.test(n)) set(addDays(hoy, 2), 'pasado mañana');
    /* "mañana" como día, no como parte del día ("de la mañana") */
    if (/\bmanana\b/.test(n) && !/(de|por|en)\s+la\s+manana/.test(n)) set(addDays(hoy, 1), 'mañana');
    if (/\bfin de semana\b/.test(n)) {
      const d = dayOfWeek(hoy);
      set(d === 6 || d === 0 ? hoy : addDays(hoy, 6 - d), 'este fin de semana');
    }
    if (/proxima semana|semana que viene|la otra semana/.test(n)) {
      set(addDays(hoy, ((1 - dayOfWeek(hoy) + 7) % 7) || 7), 'la próxima semana');
    }

    let m = n.match(new RegExp('en\\s+' + NUM_RE + '\\s+(dias?|semanas?|meses|mes)'));
    if (m) {
      const k = numeroDe(m[1]) || 1;
      const u = m[2];
      const dias = /semana/.test(u) ? k * 7 : /mes/.test(u) ? k * 30 : k;
      set(addDays(hoy, Math.round(dias)), 'en ' + m[1] + ' ' + u);
    }

    /* Día de la semana, con o sin "próximo" */
    m = n.match(/\b(este|el|la|proximo|proxima|el proximo|la proxima)?\s*(lunes|martes|miercoles|jueves|viernes|sabado|domingo)\b/);
    if (m) {
      const idx = DIAS_SEM.indexOf(m[2]);
      let delta = (idx - dayOfWeek(hoy) + 7) % 7;
      if (delta === 0) delta = 7;
      if (/proxim/.test(m[1] || '') && delta < 7) delta += 7;
      set(addDays(hoy, delta), (m[1] ? m[1] + ' ' : 'el ') + m[2]);
    }

    /* "2 de septiembre" (con año opcional) */
    m = n.match(/\b(\d{1,2})\s+de\s+([a-z]+)(?:\s+(?:de\s+)?(\d{4}))?/);
    if (m) {
      const mi = MESES.findIndex(x => slug(x) === m[2]);
      if (mi >= 0) {
        const y = m[3] ? Number(m[3]) : Number(hoy.slice(0, 4));
        let cand = y + '-' + String(mi + 1).padStart(2, '0') + '-' + String(+m[1]).padStart(2, '0');
        if (!m[3] && cand < hoy) cand = (y + 1) + cand.slice(4);
        set(cand, m[1] + ' de ' + m[2]);
      }
    }

    /* 28/08 o 28-08-2026 */
    m = texto.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/);
    if (m) {
      const y = m[3] ? (m[3].length === 2 ? '20' + m[3] : m[3]) : hoy.slice(0, 4);
      set(y + '-' + String(+m[2]).padStart(2, '0') + '-' + String(+m[1]).padStart(2, '0'), m[0]);
    }

    return { fecha: f, fechaFin: rango && f ? f : null, etiqueta, esRango: rango };
  },

  /* ----------------------------------------------------------------- Horas */
  hora(texto) {
    const t = texto.toLowerCase();
    const n = slug(texto);
    let m = t.match(/(\d{1,2})[:.](\d{2})/);
    if (m) return String(clamp(+m[1], 0, 23)).padStart(2, '0') + ':' + m[2];

    m = n.match(new RegExp('a\\s+las?\\s+' + NUM_RE + '(?:\\s*(?:hrs?|horas?))?(?:\\s*(?:de|en)\\s+la\\s+(manana|tarde|noche))?'));
    if (m) {
      let h = numeroDe(m[1]);
      if (h == null) return null;
      h = Math.round(h);
      const franja = m[2];
      if (franja === 'tarde' && h < 12) h += 12;
      else if (franja === 'noche' && h < 12) h += 12;
      else if (!franja && h >= 1 && h <= 7) h += 12;   // "a las 3" en Chile suele ser 15:00
      return String(clamp(h, 0, 23)).padStart(2, '0') + ':00';
    }

    m = n.match(/\b(\d{1,2})\s*(?:hrs|hr|horas)\b/);
    if (m && !/menos|mas|colacion|trabajad/.test(n)) return String(clamp(+m[1], 0, 23)).padStart(2, '0') + ':00';
    return null;
  },

  /* ------------------------------------------------------------ Cantidades */
  duracionMin(texto) {
    const n = slug(texto);
    let m = n.match(new RegExp('(?:de\\s+)?' + NUM_RE + '\\s*(?:horas?|hrs?)\\s*(?:y\\s+(media|medio))?'));
    if (m && !/menos|colacion/.test(n)) {
      const h = numeroDe(m[1]);
      if (h != null) return Math.round((h + (m[2] ? 0.5 : 0)) * 60);
    }
    m = n.match(new RegExp(NUM_RE + '\\s*(?:minutos?|min)\\b'));
    if (m) { const v = numeroDe(m[1]); if (v != null) return Math.round(v); }
    return null;
  },
  paginas(texto) {
    const m = slug(texto).match(new RegExp(NUM_RE + '\\s*(?:paginas?|pags?|pp)\\b'));
    return m ? Math.round(numeroDe(m[1]) || 0) || null : null;
  },
  cantidad(texto) {
    const m = slug(texto).match(new RegExp('(?:crea|genera|hazme|dame)\\s+' + NUM_RE));
    return m ? Math.round(numeroDe(m[1]) || 0) || null : null;
  },
  unidades(texto) {
    const m = slug(texto).match(new RegExp(NUM_RE + '\\s*unidades?'));
    return m ? Math.round(numeroDe(m[1]) || 0) || null : null;
  },
  ponderacion(texto) {
    let m = texto.match(/(\d{1,3})\s*%/);
    if (m) return clamp(+m[1], 0, 100);
    m = slug(texto).match(new RegExp('(?:ponderacion|vale|pondera)\\s+(?:de\\s+|un\\s+)?' + NUM_RE));
    return m ? clamp(numeroDe(m[1]) || 0, 0, 100) : null;
  },
  monto(texto) {
    const m = texto.match(/\$\s?([\d.]+(?:,\d+)?)|\b(\d{1,3}(?:\.\d{3})+)\b/);
    if (!m) return null;
    const bruto = (m[1] || m[2] || '').replace(/\./g, '').replace(',', '.');
    const v = Number(bruto);
    return isNaN(v) ? null : v;
  },
  nota(texto) {
    /* Se lee del texto original: slug() elimina la coma o el punto decimal. */
    const m = String(texto).match(/\b([1-7][.,]\d)\b/) || String(texto).match(/\bun\s+([1-7])\b/i) || String(texto).match(/\b([1-7])[.,]?0?\b/);
    return m ? Number(String(m[1]).replace(',', '.')) : null;
  },
  prioridad(texto) {
    const n = slug(texto);
    if (/\burgente|urgencia|de inmediato|ahora mismo|lo antes posible\b/.test(n)) return 'urgente';
    if (/\bimportante|alta prioridad|prioritario\b/.test(n)) return 'alta';
    if (/\bcuando pueda|sin apuro|baja prioridad\b/.test(n)) return 'baja';
    return null;
  },

  /* --------------------------------------------------- Entidades del sistema */
  /** Solo devuelve entidades que existen. Si hay indicio pero no coincide,
      informa el texto suelto para poder preguntar sin inventar. */
  marca(texto) {
    const n = slug(texto);
    let mejor = null;
    store.all('brands').forEach(b => {
      slug(b.nombre).split(' ').filter(x => x.length > 2).forEach(tok => {
        if (new RegExp('\\b' + tok + '\\b').test(n) && (!mejor || b.nombre.length > mejor.nombre.length)) mejor = b;
      });
    });
    return mejor;
  },
  asignatura(texto) {
    const n = slug(texto);
    let mejor = null;
    store.all('subjects').forEach(s => {
      const limpio = slug(s.nombre).replace(/\b(i|ii|iii|iv)\b/g, '').trim();
      const tokens = limpio.split(' ').filter(x => x.length > 3 && x !== 'derecho');
      const ok = tokens.length ? tokens.every(t => n.includes(t)) : n.includes(limpio);
      if (ok && (!mejor || limpio.length > slug(mejor.nombre).length)) mejor = s;
    });
    return mejor;
  },
  persona(texto) {
    const n = slug(texto);
    return store.all('people').find(p => {
      const nom = slug(p.nombre).split(' ')[0];
      return nom.length > 3 && new RegExp('\\b' + nom + '\\b').test(n);
    }) || null;
  },
  tienda(texto) {
    const n = slug(texto);
    let mejor = null;
    store.all('stores').forEach(s => {
      [slug(s.nombre), slug(s.ciudad || '')].forEach(campo => {
        if (!campo) return;
        campo.split(' ').filter(x => x.length > 3).forEach(tok => {
          if (new RegExp('\\b' + tok + '\\b').test(n) && !mejor) mejor = s;
        });
      });
    });
    return mejor;
  },
  /** Lugar mencionado que NO corresponde a ninguna tienda registrada. */
  lugarDesconocido(texto) {
    const m = texto.match(/\b(?:de|en)\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]{3,})\b/);
    if (!m) return null;
    const cand = m[1];
    if (NLU.tienda(cand) || NLU.marca(cand) || NLU.asignatura(cand) || NLU.persona(cand)) return null;
    if (/^(Recursos|Gerencia|Operaciones|Marketing)$/.test(cand)) return null;
    return cand;
  },
  tipoEvaluacion(texto) {
    const n = slug(texto);
    if (/\bexamen\b/.test(n)) return 'examen';
    if (/\bcontrol\b/.test(n)) return 'control';
    if (/\bpresentacion\b/.test(n)) return 'presentacion';
    if (/\btaller\b/.test(n)) return 'taller';
    if (/\btrabajo (grupal|de investigacion|escrito)\b/.test(n)) return 'trabajo';
    if (/\bprueba|solemne|certamen\b/.test(n)) return 'prueba';
    return null;
  },
  responsable(texto) {
    const m = texto.match(/\bresponsable\s*:?\s*([A-ZÁÉÍÓÚÑ][\wáéíóúñ]+(?:\s+[A-ZÁÉÍÓÚÑ][\wáéíóúñ]+)?)/);
    if (m) return m[1];
    const p = NLU.persona(texto);
    return p ? p.nombre : null;
  },
  area(texto, marca, asignatura, persona) {
    const n = slug(texto);
    if (asignatura || /\b(prueba|examen|control|solemne|certamen|catedra|clase|estudiar|estudio|leer|lectura|apunte|jurisprudencia|sentencia|fallo|ley|articulo|codigo|universidad|ramo|asignatura|profesor|semestre|repaso|ficha|materia|unidad|unidades|nota|aprobar|examen)\b/.test(n)) return 'universidad';
    if (marca || persona || /\b(cliente|tienda|marca|venta|ventas|reporte|cobertura|turno|promotora|promotor|captadora|reunion|rrhh|recursos humanos|uniforme|pop|sell out|remuneracion|liquidacion|licencia|reemplaz|renuncia|jefatura|activacion|campana|colacion|neto|iva|meta)\b/.test(n)) return 'trabajo';
    if (/\b(gimnasio|familia|cumpleanos|medico|dentista|casa|banco|cuentas|personal)\b/.test(n)) return 'personal';
    return 'trabajo';
  }
};

/* ==========================================================================
   Clasificación de intención y construcción de la propuesta
   ========================================================================== */
const Asistente = {
  version: 1,

  /** Punto de entrada. Devuelve siempre el mismo contrato JSON. */
  async interpretar(texto, opciones) {
    const t = (texto || '').trim();
    if (!t) return this.error('Escribe algo para que pueda ayudarte.');

    /* Si hay IA configurada, se intenta primero y se cae a reglas si falla. */
    if ((opciones && opciones.usarIA) && AsistenteIA.disponible()) {
      try {
        const r = await AsistenteIA.interpretar(t);
        if (r && r.intencion) return this.normalizar(r, t, 'ia');
      } catch (e) { console.warn('IA no disponible, se usan reglas:', e.message); }
    }
    try {
      return this.normalizar(this.porReglas(t), t, 'reglas');
    } catch (e) {
      console.error(e);
      return this.error('No pude interpretar esa frase. Intenta con algo más simple, por ejemplo: «Recuérdame pedir las ventas de Gnomo mañana a las 10».');
    }
  },

  error(mensaje) {
    return { version: this.version, origen: 'reglas', intencion: null, titulo: 'No entendí',
      respuesta: { texto: mensaje }, requiereConfirmacion: false, campos: [], faltantes: [], avisos: [] };
  },

  /** Completa los campos que toda propuesta debe tener. */
  normalizar(p, textoOriginal, origen) {
    const meta = INTENCIONES[p.intencion] || {};
    return Object.assign({
      version: this.version, origen, textoOriginal,
      titulo: meta.label || 'Acción', icono: meta.ic || 'asistente',
      espacio: 'trabajo', confianza: 0.8, entidades: {}, campos: [], faltantes: [],
      pregunta: null, respuesta: null, avisos: [], requiereConfirmacion: true, accion: null
    }, p);
  },

  /* ----------------------------------------------------------------------- */
  porReglas(t) {
    const n = slug(t);
    const marca = NLU.marca(t), asig = NLU.asignatura(t), persona = NLU.persona(t), tienda = NLU.tienda(t);
    const { fecha, esRango, etiqueta } = NLU.fecha(t);
    const hora = NLU.hora(t);
    const area = NLU.area(t, marca, asig, persona);
    const ctx = { t, n, marca, asig, persona, tienda, fecha, esRango, etiqueta, hora, area };

    /* El orden importa: lo más específico primero. */
    return this.calculo(ctx) || this.consulta(ctx) || this.mensaje(ctx) || this.preguntas(ctx)
        || this.planEstudio(ctx) || this.fichaCaso(ctx) || this.fuenteJuridica(ctx)
        || this.apunteJuridico(ctx) || this.calificacion(ctx) || this.lectura(ctx)
        || this.evaluacion(ctx) || this.sesionEstudio(ctx) || this.novedadPersona(ctx)
        || this.reunion(ctx) || this.recordatorioOTarea(ctx);
  },

  /* --------------------------------------------------------------- CÁLCULOS */
  calculo(c) {
    const { n, t } = c;

    /* Horas trabajadas descontando colación */
    let m = n.match(new RegExp(NUM_RE + '\\s*horas?\\s*(?:menos|descontando|sin)\\s*' + NUM_RE + '?\\s*(?:hora|horas|min|minutos)?\\s*(?:de\\s*)?colacion'));
    if (!m) m = n.match(new RegExp('calcula\\s+' + NUM_RE + '\\s*horas?\\s*menos\\s*' + NUM_RE + '\\s*hora'));
    if (m) {
      const brutas = numeroDe(m[1]) || 0;
      const col = numeroDe(m[2]) != null ? numeroDe(m[2]) : 1;
      const colMin = /min/.test(n) && !/hora/.test(m[0].split('menos')[1] || '') ? col : col * 60;
      const netas = brutas * 60 - colMin;
      return this.resultadoCalculo('Horas efectivas',
        Math.floor(netas / 60) + ' h ' + (netas % 60) + ' min',
        ['Brutas: ' + fmtNum(brutas, 1) + ' h', 'Colación: ' + colMin + ' min',
         'Decimal: ' + fmtNum(netas / 60, 2) + ' h'], 'trabajo');
    }

    /* Neto / IVA */
    if (/\bneto|sin iva|con iva|iva\b/.test(n)) {
      const monto = NLU.monto(t);
      if (monto == null) return this.faltaDato('calcular', 'monto', '¿Sobre qué monto lo calculo?', 'trabajo');
      const pideNeto = /neto|sin iva/.test(n);
      const r = pideNeto
        ? { neto: monto / 1.19, iva: monto - monto / 1.19, total: monto }
        : { neto: monto, iva: monto * 0.19, total: monto * 1.19 };
      return this.resultadoCalculo(pideNeto ? 'Monto neto' : 'Monto con IVA',
        fmtCLP(pideNeto ? r.neto : r.total),
        ['Neto: ' + fmtCLP(r.neto), 'IVA 19%: ' + fmtCLP(r.iva), 'Total: ' + fmtCLP(r.total),
         pideNeto ? 'Se dividió por 1,19 sobre ' + fmtCLP(monto) : 'Se agregó 19% sobre ' + fmtCLP(monto)], 'trabajo');
    }

    /* Cumplimiento de meta */
    if (/cumplimiento|me falta.*meta|cuanto falta para la meta/.test(n)) {
      const nums = (t.match(/\$?\s?[\d.]{4,}/g) || []).map(x => Number(x.replace(/[^\d]/g, ''))).filter(Boolean);
      if (nums.length < 2) return this.faltaDato('calcular', 'meta', 'Dime la meta y la venta actual. Ej: «cumplimiento con meta 12000000 y venta 8600000».', 'trabajo');
      const [meta, actual] = nums;
      return this.resultadoCalculo('Cumplimiento de meta', fmtNum(actual / meta * 100) + '%',
        ['Meta: ' + fmtCLP(meta), 'Actual: ' + fmtCLP(actual), 'Falta: ' + fmtCLP(Math.max(0, meta - actual))], 'trabajo');
    }

    /* Nota necesaria para aprobar */
    if (/que nota necesito|nota necesaria|cuanto necesito para aprobar|para aprobar/.test(n)) {
      const s = c.asig || (store.all('subjects')[0] || null);
      if (!s) return this.faltaDato('calcular', 'asignatura', '¿De qué asignatura?', 'universidad');
      if (!c.asig && store.all('subjects').length > 1) {
        return this.preguntaOpciones('calcular', '¿De qué asignatura necesitas la nota?',
          store.all('subjects').map(x => ({ etiqueta: x.nombre, texto: 'Qué nota necesito para aprobar ' + x.nombre })), 'universidad');
      }
      const nn = Q.notaNecesaria(s.id);
      const pr = Q.promedio(s.id);
      if (nn == null) return this.resultadoCalculo('Nota necesaria — ' + s.nombre, 'Ya no queda ponderación pendiente',
        ['Promedio final: ' + (pr.promedio ? fmtNum(pr.promedio) : '—')], 'universidad');
      const pendientes = store.where('evaluations', e => e.subject_id === s.id && e.nota == null)
        .map(e => '• ' + e.titulo + ' (' + fmtNum(e.ponderacion, 0) + '%)');
      return this.resultadoCalculo('Nota necesaria — ' + s.nombre, fmtNum(nn),
        ['Nota de aprobación: ' + fmtNum(DB.profile.nota_aprobacion),
         'Promedio parcial: ' + (pr.promedio ? fmtNum(pr.promedio) : 'sin notas'),
         'Ponderación rendida: ' + fmtNum(pr.ponderacion, 0) + '%']
        .concat(pendientes.length ? ['Falta rendir:'].concat(pendientes) : [])
        .concat(nn > 7 ? ['Con lo que queda ya no alcanza la nota de aprobación.'] : []), 'universidad');
    }

    /* Páginas que faltan de lectura */
    if (/cuanto me falta|cuantas paginas me faltan|falta para terminar la lectura|me falta para terminar/.test(n)) {
      const lecturas = store.all('readings').filter(r => (!c.asig || r.subject_id === c.asig.id) && r.paginas_leidas < r.paginas_total);
      if (!lecturas.length) return this.resultadoCalculo('Lecturas', 'No te falta nada', ['No hay lecturas pendientes registradas.'], 'universidad');
      const total = lecturas.reduce((a, r) => a + (r.paginas_total - r.paginas_leidas), 0);
      return this.resultadoCalculo('Páginas pendientes', total + ' páginas',
        lecturas.map(r => '• ' + r.titulo + ': faltan ' + (r.paginas_total - r.paginas_leidas) + ' de ' + r.paginas_total +
          (r.fecha_limite ? ' — para el ' + fmtFecha(r.fecha_limite) : '')), 'universidad');
    }
    return null;
  },

  resultadoCalculo(titulo, valor, detalle, espacio) {
    return { intencion: 'calcular', espacio, titulo, requiereConfirmacion: false,
      respuesta: { texto: valor, subtitulo: titulo, detalle: detalle || [] } };
  },

  /* --------------------------------------------------------------- CONSULTAS */
  consulta(c) {
    const { n, t } = c;
    /* "Tengo reunión el miércoles" es una orden, no una consulta: solo se
       considera pregunta si empieza con un interrogativo o lleva signo. */
    const esPregunta = /^(que|cuales|cual|cuanto|cuantas|cuantos|cuando|muestrame|dame|listame|enumera|revisa mis)\b/.test(n) || /\?/.test(t);
    if (!esPregunta) return null;

    if (/\bevaluacion|evaluaciones|pruebas?|examenes?|controles?\b/.test(n) && !/tengo (prueba|examen|control)\b.*\b(el|para)\b/.test(n)) {
      const m = n.match(new RegExp('proximos?\\s+' + NUM_RE + '\\s*dias'));
      const dias = m ? Math.round(numeroDe(m[1]) || 30) : (/este mes|del mes/.test(n) ? 31 : 30);
      const evs = store.all('evaluations')
        .filter(e => e.estado === 'pendiente' && e.fecha && e.fecha >= todayISO() && diffDays(e.fecha, todayISO()) <= dias)
        .filter(e => !c.asig || e.subject_id === c.asig.id)
        .sort(by('fecha'));
      return { intencion: 'consultar_evaluaciones', espacio: 'universidad', requiereConfirmacion: false,
        titulo: 'Evaluaciones de los próximos ' + dias + ' días',
        respuesta: { texto: evs.length ? evs.length + ' evaluación(es)' : 'Sin evaluaciones en ese periodo',
          detalle: evs.map(e => '• ' + fmtFecha(e.fecha) + ' — ' + e.titulo + ' · ' + Q.nombreSubject(e.subject_id) +
            ' · ' + fmtNum(e.ponderacion, 0) + '% · en ' + diffDays(e.fecha, todayISO()) + ' días'),
          enlace: '#/universidad' } };
    }

    if (/\bagenda|hoy|semana|reunion|reuniones|clases\b/.test(n) && !/pendiente/.test(n)) {
      const dias = /semana/.test(n) ? 7 : 1;
      const desde = todayISO(), hasta = addDays(desde, dias - 1);
      const evs = store.all('events').filter(e => String(e.inicio).slice(0, 10) >= desde && String(e.inicio).slice(0, 10) <= hasta)
        .filter(e => !c.marca || e.brand_id === c.marca.id).sort(by('inicio'));
      const ses = store.all('study_sessions').filter(s => s.fecha >= desde && s.fecha <= hasta);
      return { intencion: 'consultar_agenda', espacio: c.area, requiereConfirmacion: false,
        titulo: dias === 1 ? 'Tu agenda de hoy' : 'Tu agenda de la semana',
        respuesta: { texto: (evs.length + ses.length) + ' compromiso(s)',
          detalle: evs.map(e => '• ' + fmtFecha(e.inicio) + ' ' + fmtHora(e.inicio) + ' — ' + e.titulo +
              (Q.contexto(e) ? ' (' + Q.contexto(e) + ')' : ''))
            .concat(ses.map(s => '• ' + fmtFecha(s.fecha) + ' ' + (s.hora || '') + ' — Estudio: ' + s.titulo)),
          enlace: '#/agenda' } };
    }

    /* Pendientes: por marca, por asignatura o generales */
    const rango = /esta semana|de la semana/.test(n) ? 7 : null;
    let items = [], titulo = 'Pendientes';
    if (c.marca) {
      titulo = 'Pendientes con ' + c.marca.nombre;
      store.where('tasks', x => x.brand_id === c.marca.id && x.estado !== 'completada')
        .filter(x => !rango || (x.due_at && diffDays(String(x.due_at).slice(0, 10), todayISO()) <= rango))
        .forEach(x => items.push('• ' + x.titulo + (x.due_at ? ' — ' + fmtRelativo(x.due_at) : '') + ' [' + ESTADOS_TAREA[x.estado].label + ']'));
      store.where('requests', r => r.brand_id === c.marca.id && ['abierta', 'en_gestion', 'sin_respuesta'].includes(r.estado))
        .forEach(r => items.push('• Solicitud: ' + r.titulo + ' — ' + ESTADO_SOLICITUD[r.estado].label));
      store.where('agreements', a => a.brand_id === c.marca.id && a.estado !== 'cerrado')
        .forEach(a => items.push('• ' + (a.tipo === 'incidencia' ? 'Incidencia' : 'Acuerdo') + ': ' + a.titulo));
    } else if (c.asig) {
      titulo = 'Pendientes de ' + c.asig.nombre;
      store.where('tasks', x => x.subject_id === c.asig.id && x.estado !== 'completada')
        .forEach(x => items.push('• ' + x.titulo + (x.due_at ? ' — ' + fmtRelativo(x.due_at) : '')));
      store.where('evaluations', e => e.subject_id === c.asig.id && e.estado === 'pendiente' && e.fecha)
        .forEach(e => items.push('• ' + e.titulo + ' — ' + fmtFecha(e.fecha)));
      store.where('readings', r => r.subject_id === c.asig.id && r.paginas_leidas < r.paginas_total)
        .forEach(r => items.push('• Lectura: ' + r.titulo + ' — faltan ' + (r.paginas_total - r.paginas_leidas) + ' páginas'));
    } else {
      titulo = rango ? 'Pendientes de esta semana' : 'Tus pendientes';
      Q.tareas({ abiertas: true, todas: true })
        .filter(x => !rango || (x.due_at && diffDays(String(x.due_at).slice(0, 10), todayISO()) <= rango && diffDays(String(x.due_at).slice(0, 10), todayISO()) >= -30))
        .sort((a, b) => Q.score(b) - Q.score(a)).slice(0, 12)
        .forEach(x => items.push('• ' + x.titulo + (x.due_at ? ' — ' + fmtRelativo(x.due_at) : '') + (Q.contexto(x) ? ' (' + Q.contexto(x) + ')' : '')));
    }
    return { intencion: 'consultar_pendientes', espacio: c.marca ? 'trabajo' : c.asig ? 'universidad' : c.area,
      requiereConfirmacion: false, titulo,
      respuesta: { texto: items.length ? items.length + ' pendiente(s)' : 'Nada pendiente por acá',
        detalle: items, nota: 'Solo se muestra lo que está registrado en Nexo.', enlace: '#/tareas' } };
  },

  /* -------------------------------------------------------------- MENSAJES */
  mensaje(c) {
    const { n, t } = c;
    if (!/^(redacta|redactame|escribe|escribeme|hazme un mensaje|arma un mensaje)/.test(n) && !/redacta.*mensaje|mensaje para/.test(n)) return null;
    const tono = /firme/.test(n) ? 'firme' : /ejecutiv/.test(n) ? 'ejecutivo' : /motivacion/.test(n) ? 'motivacional'
      : /breve|corto/.test(n) ? 'breve' : 'cercano';
    const dest = /rrhh|recursos humanos/.test(n) ? 'rrhh' : /cliente/.test(n) ? 'cliente' : 'equipo';
    const asunto = t.replace(/^.*?\b(para|sobre|de)\b\s+/i, '')
      .replace(/\b(firme|ejecutivo|cercano|motivacional|breve)\b/gi, '')
      .replace(/^recordar\s+/i, 'recordar ').trim() || 'el reporte diario';
    const cuerpo = Herramientas.mensaje({ tono, destinatario: dest, asunto, marca: c.marca ? c.marca.nombre : '' });
    return {
      intencion: 'generar_mensaje', espacio: 'trabajo', requiereConfirmacion: false,
      titulo: 'Mensaje sugerido · tono ' + tono,
      respuesta: { texto: cuerpo, copiable: true, plantilla: { titulo: 'Mensaje: ' + asunto.slice(0, 60), tono, dest, cuerpo },
        nota: 'Nexo no envía nada por ti. Cópialo y revísalo antes de mandarlo.' }
    };
  },

  /* ------------------------------------------------- PREGUNTAS DE ESTUDIO -- */
  preguntas(c) {
    const { n, t } = c;
    if (!/preguntas de repaso|preguntas sobre|crear fichas|fichas de repaso|preguntas para repasar/.test(n)) return null;
    const cantidad = NLU.cantidad(t) || 10;
    const tema = (/\bsobre\b/i.test(t) ? t.replace(/^.*?\bsobre\s+/i, '') : t.replace(/^.*?\bde\s+/i, ''))
      .replace(/\besta materia\b/i, '').trim();
    const asig = c.asig;

    const fuentes = store.all('glossary').filter(g => (!asig || g.subject_id === asig.id) &&
      (!tema || Asistente.coincide(tema, g.termino + ' ' + (g.etiquetas || []).join(' ') + ' ' + g.definicion)));
    const apuntes = store.all('notes').filter(no => no.area === 'universidad' && (!asig || no.subject_id === asig.id) &&
      (!tema || Asistente.coincide(tema, no.titulo + ' ' + (no.etiquetas || []).join(' ') + ' ' + (no.tema || ''))));

    if (!fuentes.length && !apuntes.length) {
      return { intencion: 'generar_preguntas', espacio: 'universidad', requiereConfirmacion: false,
        titulo: 'No tengo material propio sobre ese tema',
        respuesta: {
          texto: 'Nexo no inventa contenido jurídico.',
          detalle: ['Para generar preguntas necesito conceptos de tu glosario o apuntes tuyos' + (tema ? ' sobre «' + tema + '»' : '') + '.',
            'Agrega el material en Universidad → Glosario o Apuntes y vuelve a pedírmelo.'],
          enlace: '#/universidad' },
        avisos: ['sin_material'] };
    }

    const cards = fuentes.map(g => ({ pregunta: '¿Qué es ' + g.termino + '?', respuesta: g.definicion, subject_id: g.subject_id, origen: 'Glosario' }))
      .concat(apuntes.map(no => ({ pregunta: 'Explica con tus palabras: ' + no.titulo, respuesta: no.contenido || '', subject_id: no.subject_id, origen: 'Apunte propio' })))
      .slice(0, cantidad);

    return {
      intencion: 'generar_preguntas', espacio: 'universidad',
      resumen: 'Se crearán ' + cards.length + ' ficha(s) a partir de tu propio glosario y apuntes. No se genera contenido jurídico nuevo.' +
        (cards.length < cantidad ? ' Pediste ' + cantidad + ', pero solo hay material para ' + cards.length + '.' : ''),
      entidades: { asignatura: asig, tema },
      campos: [
        { k: 'tema', etiqueta: 'Tema', valor: tema || '(todo el material)', tipo: 'texto' },
        { k: 'cantidad', etiqueta: 'Cantidad', valor: String(cards.length), tipo: 'numero' }
      ],
      avisos: ['material_propio'],
      accion: { tipo: 'crear_fichas', datos: { cards } }
    };
  },

  coincide(tema, texto) {
    const STOP = ['para', 'sobre', 'este', 'esta', 'esto', 'como', 'desde', 'entre', 'materia', 'temas'];
    const raiz = w => w.replace(/(es|s)$/, '');
    const tk = slug(tema).split(' ').filter(w => w.length > 3 && !STOP.includes(w)).map(raiz);
    if (!tk.length) return true;
    const tx = slug(texto);
    return tk.filter(w => tx.includes(w)).length / tk.length >= 0.5;
  },

  /* ------------------------------------------------------- PLAN DE ESTUDIO */
  planEstudio(c) {
    const { n, t } = c;
    if (!/plan de estudio|planifica|planificar el estudio|organiza(r)? el estudio|estudiar\s+\w+\s*unidades/.test(n)) return null;

    const evs = (c.asig ? store.where('evaluations', e => e.subject_id === c.asig.id && e.estado === 'pendiente' && e.fecha)
                        : store.all('evaluations').filter(e => e.estado === 'pendiente' && e.fecha)).sort(by('fecha'));
    if (!evs.length) {
      return this.faltaDato('crear_plan_estudio', 'evaluacion',
        'Para planificar necesito una evaluación con fecha. Registra primero la prueba y su fecha.', 'universidad');
    }
    if (!c.asig && evs.length > 1) {
      return this.preguntaOpciones('crear_plan_estudio', '¿Para qué evaluación armo el plan?',
        evs.slice(0, 4).map(e => ({ etiqueta: e.titulo + ' · ' + fmtFecha(e.fecha),
          texto: 'Crea un plan de estudio para ' + Q.nombreSubject(e.subject_id) + (c.fecha ? ' desde el ' + fmtFecha(c.fecha) : '') })), 'universidad');
    }
    const ev = evs[0];
    const sub = Q.subject(ev.subject_id);
    let unidades = store.where('units', u => u.subject_id === ev.subject_id && u.dominio !== 'dominado');
    const nUnidades = NLU.unidades(t);
    if (nUnidades) unidades = unidades.slice(0, nUnidades);
    const inicio = c.fecha || todayISO();

    return {
      intencion: 'crear_plan_estudio', espacio: 'universidad',
      resumen: 'Plan para «' + ev.titulo + '» de ' + sub.nombre + ', evaluación el ' + fmtFecha(ev.fecha) +
        '. Se reparte la materia en tu disponibilidad declarada, con repasos a 3 y 7 días y un simulacro la víspera.',
      entidades: { asignatura: sub, evaluacion: ev, fecha: inicio },
      campos: [
        { k: 'evaluacion', etiqueta: 'Evaluación', valor: ev.titulo, tipo: 'texto', bloqueado: true },
        { k: 'asignatura', etiqueta: 'Asignatura', valor: sub.nombre, tipo: 'texto', bloqueado: true },
        { k: 'inicio', etiqueta: 'Empezar el', valor: inicio, tipo: 'fecha' },
        { k: 'fecha_objetivo', etiqueta: 'Fecha de la prueba', valor: ev.fecha, tipo: 'fecha' },
        { k: 'unidades', etiqueta: 'Unidades a cubrir', valor: String(unidades.length), tipo: 'numero' },
        { k: 'horas_semana', etiqueta: 'Horas por semana', valor: '6', tipo: 'numero' }
      ],
      accion: { tipo: 'plan_estudio', datos: { evaluation_id: ev.id, subject_id: ev.subject_id,
        nombre: 'Plan: ' + ev.titulo, unidadesIds: unidades.map(u => u.id) } }
    };
  },

  /* ---------------------------------------------------------- FICHA DE CASO */
  fichaCaso(c) {
    const { n, t } = c;
    if (!/ficha de caso|analisis de caso|caso practico|caso con los hechos/.test(n)) return null;
    let titulo = t.replace(/^.*?(ficha de caso|caso pr[aá]ctico|an[aá]lisis de caso)\s*/i, '')
      .replace(/^(de|sobre|con|para)\s+/i, '').trim();
    /* Si solo describe la estructura ("con los hechos, problema y decisión"),
       no es un título: se pide uno de verdad. */
    if (/^(los\s+)?hechos\b|problema jur[ií]dico|estructura/i.test(titulo)) titulo = '';
    return {
      intencion: 'crear_ficha_caso', espacio: 'universidad',
      resumen: 'Se creará la ficha con la estructura hechos → problema jurídico → normas → argumentos → conclusión. ' +
        'Los campos quedan vacíos para que los completes tú: Nexo no redacta hechos ni decisiones judiciales.',
      entidades: { asignatura: c.asig },
      campos: [
        { k: 'titulo', etiqueta: 'Título del caso', valor: titulo || '', tipo: 'texto', requerido: true },
        { k: 'subject_id', etiqueta: 'Asignatura', valor: c.asig ? c.asig.id : '', tipo: 'select', opciones: optsSubjects() },
        { k: 'hechos', etiqueta: 'Hechos', valor: '', tipo: 'textarea' },
        { k: 'problema', etiqueta: 'Problema jurídico', valor: '', tipo: 'textarea' },
        { k: 'normas', etiqueta: 'Normas aplicables (verifícalas en BCN)', valor: '', tipo: 'textarea' },
        { k: 'conclusion', etiqueta: 'Decisión o conclusión', valor: '', tipo: 'textarea' }
      ],
      faltantes: titulo ? [] : ['titulo'],
      pregunta: titulo ? null : { texto: '¿Cómo se llama el caso? Los hechos y la decisión los escribes tú: Nexo no redacta sentencias.' },
      avisos: ['verificacion_juridica'],
      accion: { tipo: 'crear', tabla: 'cases' }
    };
  },

  /* --------------------------------------------------- FUENTE JURÍDICA ---- */
  fuenteJuridica(c) {
    const { n, t } = c;
    if (!/registra(r)? (este|esta|el|la)? ?(fallo|sentencia|ley|norma|decreto|fuente)|guarda (este|esta) (fallo|sentencia|ley)|registrar fuente/.test(n)) return null;
    const tipo = /fallo|sentencia/.test(n) ? 'sentencia' : /decreto/.test(n) ? 'decreto' : /codigo/.test(n) ? 'codigo' : 'ley';
    const resto = t.replace(/^.*?(fallo|sentencia|ley|norma|decreto|fuente)\s*/i, '')
      .replace(/\bpara\s+(revisarl[oa]s?|verl[oa]|leerl[oa])\s*(despu[eé]s|luego|m[aá]s\s+tarde)?\b/i, '')
      .replace(/^(para|de|del|el|la)\s+/i, '').trim();
    return {
      intencion: 'registrar_fuente_juridica', espacio: 'universidad',
      resumen: 'Se guardará como <strong>no verificada</strong>. Nexo no completa rol, tribunal ni fecha: cópialos desde la fuente oficial.',
      entidades: { asignatura: c.asig, tipo },
      campos: [
        { k: 'identificador', etiqueta: 'Identificador', valor: resto, tipo: 'texto', requerido: true,
          ayuda: 'Ej: «Rol 12.345-2024» o «Ley 21.120». Cópialo tal cual desde la fuente.' },
        { k: 'tipo', etiqueta: 'Tipo', valor: tipo, tipo: 'select',
          opciones: Object.keys(E.fuenteT).map(k => ({ v: k, l: k })) },
        { k: 'tribunal', etiqueta: 'Tribunal', valor: '', tipo: 'texto' },
        { k: 'rol', etiqueta: 'Rol o causa', valor: '', tipo: 'texto' },
        { k: 'fecha', etiqueta: 'Fecha del documento', valor: c.fecha || '', tipo: 'fecha' },
        { k: 'enlace', etiqueta: 'Enlace oficial', valor: '', tipo: 'texto', ayuda: 'BCN, Poder Judicial o Diario Oficial.' },
        { k: 'subject_id', etiqueta: 'Asignatura', valor: c.asig ? c.asig.id : '', tipo: 'select', opciones: optsSubjects() },
        { k: 'resumen', etiqueta: 'Tu resumen', valor: '', tipo: 'textarea', ayuda: 'Escríbelo tú. Nexo no resume sentencias que no ha leído.' }
      ],
      faltantes: resto ? [] : ['identificador'],
      pregunta: resto ? null : { texto: '¿Cuál es el rol o identificador del fallo? Cópialo desde el buscador de causas del Poder Judicial; no lo invento.' },
      avisos: ['verificacion_juridica', 'sin_verificar'],
      accion: { tipo: 'crear', tabla: 'legal_sources' }
    };
  },

  /* -------------------------------------------------- APUNTE JURÍDICO ----- */
  apunteJuridico(c) {
    const { n, t } = c;
    if (!/apunte de|como apunte|guarda(r)? (este )?(concepto|apunte)|anota (este )?concepto|agrega este texto/.test(n)) return null;
    let contenido = t.replace(/^.*?(como apunte de|apunte de|apunte|concepto juridico|concepto)\s*:?\s*/i, '').trim();
    let tema = '';
    const mTema = t.match(/apunte de\s+([^.,;]+)/i);
    if (mTema) { tema = mTema[1].trim(); contenido = t.replace(/^.*?apunte de\s+[^.,;]+[.,;]?\s*/i, '').trim(); }
    const esConcepto = /concepto/.test(n);

    return {
      intencion: 'registrar_apunte_juridico', espacio: 'universidad',
      resumen: esConcepto
        ? 'Se guardará en el glosario marcado como <strong>no verificado</strong>. Confirma la definición en tu manual o en fuente oficial antes de citarla.'
        : 'Se guardará como apunte tuyo, asociado a la asignatura y al tema. Tu texto se conserva tal cual.',
      entidades: { asignatura: c.asig, tema },
      campos: esConcepto
        ? [
            { k: 'termino', etiqueta: 'Concepto', valor: (contenido.split(':')[0] || '').trim(), tipo: 'texto', requerido: true },
            { k: 'definicion', etiqueta: 'Definición (tu texto, sin cambios)', valor: contenido.includes(':') ? contenido.split(':').slice(1).join(':').trim() : contenido, tipo: 'textarea', requerido: true },
            { k: 'subject_id', etiqueta: 'Asignatura', valor: c.asig ? c.asig.id : '', tipo: 'select', opciones: optsSubjects() },
            { k: 'fuente', etiqueta: 'Origen', valor: 'Apunte propio', tipo: 'texto' }
          ]
        : [
            { k: 'titulo', etiqueta: 'Título', valor: tema ? 'Apunte: ' + tema : (contenido.slice(0, 60) || ''), tipo: 'texto', requerido: true },
            { k: 'contenido', etiqueta: 'Contenido (tu texto, sin cambios)', valor: contenido, tipo: 'textarea', requerido: true },
            { k: 'subject_id', etiqueta: 'Asignatura', valor: c.asig ? c.asig.id : '', tipo: 'select', opciones: optsSubjects() },
            { k: 'tema', etiqueta: 'Tema', valor: tema, tipo: 'texto' }
          ],
      faltantes: contenido ? [] : ['contenido'],
      pregunta: contenido ? null : { texto: 'Pega el texto del apunte y lo guardo tal cual, sin modificarlo.' },
      avisos: ['verificacion_juridica'],
      accion: { tipo: 'crear', tabla: esConcepto ? 'glossary' : 'notes', apunte: !esConcepto }
    };
  },

  /* ------------------------------------------------------- CALIFICACIÓN --- */
  calificacion(c) {
    const { n, t } = c;
    if (!/me saque|obtuve|saque un|nota de|me pusieron|calificacion/.test(n)) return null;
    const nota = NLU.nota(t);
    const evs = store.all('evaluations').filter(e => !c.asig || e.subject_id === c.asig.id);
    const candidata = evs.filter(e => e.nota == null && e.fecha && e.fecha <= todayISO()).sort(by('fecha', -1))[0]
      || evs.filter(e => e.nota == null).sort(by('fecha'))[0];
    if (!candidata) return this.faltaDato('registrar_calificacion', 'evaluacion', 'No encuentro una evaluación sin nota. Regístrala primero.', 'universidad');
    return {
      intencion: 'registrar_calificacion', espacio: 'universidad',
      resumen: 'Se guardará la nota y se recalculará el promedio y la nota que necesitas.',
      entidades: { asignatura: Q.subject(candidata.subject_id), evaluacion: candidata },
      campos: [
        { k: 'evaluation_id', etiqueta: 'Evaluación', valor: candidata.id, tipo: 'select',
          opciones: evs.map(e => ({ v: e.id, l: e.titulo + ' · ' + Q.nombreSubject(e.subject_id) })) },
        { k: 'nota', etiqueta: 'Nota (1,0 a 7,0)', valor: nota != null ? String(nota) : '', tipo: 'numero', requerido: true }
      ],
      faltantes: nota == null ? ['nota'] : [],
      pregunta: nota == null ? { texto: '¿Qué nota obtuviste?' } : null,
      accion: { tipo: 'calificacion' }
    };
  },

  /* ------------------------------------------------------------- LECTURA -- */
  lectura(c) {
    const { n, t } = c;
    const pags = NLU.paginas(t);
    if (!pags || !/leer|lectura|leerme/.test(n)) return null;
    const esRecordatorio = /recuerdame|recordarme|avisame/.test(n);
    return {
      intencion: 'registrar_lectura', espacio: 'universidad',
      resumen: 'Se agrega al registro de lecturas con control de páginas.' +
        (esRecordatorio ? ' Además se crea la tarea del recordatorio.' : ''),
      entidades: { asignatura: c.asig, paginas: pags, fecha: c.fecha },
      campos: [
        { k: 'titulo', etiqueta: 'Título de la lectura', valor: (c.asig ? 'Lectura de ' + c.asig.nombre : ''), tipo: 'texto', requerido: true },
        { k: 'subject_id', etiqueta: 'Asignatura', valor: c.asig ? c.asig.id : '', tipo: 'select', opciones: optsSubjects() },
        { k: 'paginas_total', etiqueta: 'Páginas', valor: String(pags), tipo: 'numero' },
        { k: 'fecha_limite', etiqueta: 'Para el', valor: c.fecha || '', tipo: 'fecha' },
        { k: 'prioridad', etiqueta: 'Prioridad', valor: NLU.prioridad(t) || 'alta', tipo: 'select', opciones: optsPrio() },
        { k: 'crear_tarea', etiqueta: 'Crear también un recordatorio', valor: esRecordatorio ? '1' : '', tipo: 'check' }
      ],
      faltantes: c.asig ? [] : ['asignatura'],
      pregunta: c.asig ? null : {
        texto: '¿De qué asignatura es la lectura?',
        opciones: store.all('subjects').map(s => ({ etiqueta: s.nombre, texto: t + ' de ' + s.nombre }))
      },
      accion: { tipo: 'crear', tabla: 'readings' }
    };
  },

  /* --------------------------------------------------------- EVALUACIÓN --- */
  evaluacion(c) {
    const { n, t } = c;
    const tipo = NLU.tipoEvaluacion(t);
    if (!tipo || !/tengo|hay|agenda|registra|crea|anota|es el|sera el/.test(n)) return null;
    if (!c.asig) {
      return this.preguntaOpciones('crear_evaluacion', '¿De qué asignatura es la ' + TIPO_EVAL[tipo].toLowerCase() + '?',

    return {
      intencion: 'crear_evaluacion', espacio: 'universidad',
      resumen: 'Se agrega a ' + c.asig.nombre + ' y aparece en el calendario académico y en Inicio.',
      entidades: { asignatura: c.asig, tipo, fecha: c.fecha, hora: c.hora },
      campos: [
        { k: 'titulo', etiqueta: 'Título', valor: TIPO_EVAL[tipo] + ' de ' + c.asig.nombre, tipo: 'texto', requerido: true },
        { k: 'subject_id', etiqueta: 'Asignatura', valor: c.asig.id, tipo: 'select', opciones: optsSubjects() },
        { k: 'tipo', etiqueta: 'Tipo', valor: tipo, tipo: 'select', opciones: Object.keys(TIPO_EVAL).map(k => ({ v: k, l: TIPO_EVAL[k] })) },
        { k: 'fecha', etiqueta: 'Fecha', valor: c.fecha || '', tipo: 'fecha', requerido: true },
        { k: 'hora', etiqueta: 'Hora', valor: c.hora || '18:30', tipo: 'hora' },
        { k: 'ponderacion', etiqueta: 'Ponderación (%)', valor: String(NLU.ponderacion(t) || 25), tipo: 'numero' },
        { k: 'temario', etiqueta: 'Temario', valor: '', tipo: 'textarea' }
      ],
      faltantes: c.fecha ? [] : ['fecha'],
      pregunta: c.fecha ? null : { texto: '¿Qué día es la ' + TIPO_EVAL[tipo].toLowerCase() + '?' },
      accion: { tipo: 'crear', tabla: 'evaluations' }
    };
  },

  /* ---------------------------------------------------- SESIÓN DE ESTUDIO - */
  sesionEstudio(c) {
    const { n, t } = c;
    if (!/sesion de estudio|bloque de estudio|estudiar/.test(n)) return null;
    const dur = NLU.duracionMin(t) || 60;
    return {
      intencion: 'crear_sesion_estudio', espacio: 'universidad',

        { k: 'titulo', etiqueta: 'Título', valor: 'Sesión de estudio' + (c.asig ? ': ' + c.asig.nombre : ''), tipo: 'texto', requerido: true },
        { k: 'subject_id', etiqueta: 'Asignatura', valor: c.asig ? c.asig.id : '', tipo: 'select', opciones: optsSubjects() },
        { k: 'fecha', etiqueta: 'Fecha', valor: c.fecha || todayISO(), tipo: 'fecha', requerido: true },
        { k: 'hora', etiqueta: 'Hora', valor: c.hora || '20:30', tipo: 'hora' },
        { k: 'duracion_min', etiqueta: 'Duración (min)', valor: String(dur), tipo: 'numero' },
        { k: 'tipo', etiqueta: 'Tipo', valor: 'estudio', tipo: 'select',
          opciones: [['estudio', 'Estudio'], ['repaso', 'Repaso'], ['ejercicios', 'Ejercicios'], ['sintesis', 'Síntesis']].map(x => ({ v: x[0], l: x[1] })) }
      ],
      accion: { tipo: 'crear', tabla: 'study_sessions' }
    };
  },

  /* -------------------------------------------------- NOVEDAD DE PERSONA -- */
  novedadPersona(c) {
    const { n, t } = c;
    if (!/licencia|vacacion|reemplaz|renunci|se va|capacitacion|amonestacion/.test(n)) return null;
    /* "Crea una tarea para reemplazar a alguien" es una tarea, no una novedad.
       Sin persona identificada y con verbo en infinitivo, se deja pasar. */
    if (!c.persona && (/^(crea|crear|nueva tarea|recuerdame|recordarme|agenda|agendar|necesito)/.test(n)
        || /\b(reemplazar|cubrir|contratar|buscar)\b/.test(n))) return null;
    if (!c.persona) {
      const nombre = (t.match(/\b(?:que|a)\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]{2,})\b/) || [])[1];
      return this.preguntaOpciones('registrar_novedad_persona',
        nombre ? 'No tengo a nadie llamado «' + nombre + '» en tu equipo. ¿A quién te refieres?' : '¿De qué persona es la novedad?',
        store.all('people').slice(0, 6).map(p => ({ etiqueta: p.nombre + ' · ' + (Q.nombreBrand(p.brand_id) || 'sin marca'),
          texto: t.replace(nombre || '@@', p.nombre.split(' ')[0]) })), 'trabajo',
        'No registro novedades de personas que no existen en tu equipo.');
    }
    const tipo = /licencia/.test(n) ? 'licencia' : /vacacion/.test(n) ? 'vacaciones' : /reemplaz/.test(n) ? 'reemplazo'
      : /renunci|se va/.test(n) ? 'renuncia' : /capacitacion/.test(n) ? 'capacitacion' : 'amonestacion';
    const hasta = c.esRango ? c.fecha : null;
    return {
      intencion: 'registrar_novedad_persona', espacio: 'trabajo',
      resumen: 'Se registra la novedad y se actualiza el estado de ' + c.persona.nombre +
        '. Solo se guardan tipo y fechas: nunca diagnósticos ni datos de salud.',
      entidades: { persona: c.persona, marca: Q.brand(c.persona.brand_id), tipo },
      campos: [
        { k: 'person_id', etiqueta: 'Persona', valor: c.persona.id, tipo: 'select',
          opciones: store.all('people').map(p => ({ v: p.id, l: p.nombre + ' · ' + (Q.nombreBrand(p.brand_id) || '') })) },
        { k: 'tipo', etiqueta: 'Tipo de novedad', valor: tipo, tipo: 'select',
          opciones: [['licencia', 'Licencia'], ['vacaciones', 'Vacaciones'], ['reemplazo', 'Reemplazo'], ['ingreso', 'Ingreso'],
            ['renuncia', 'Renuncia'], ['capacitacion', 'Capacitación'], ['amonestacion', 'Amonestación']].map(x => ({ v: x[0], l: x[1] })) },
        { k: 'desde', etiqueta: 'Desde', valor: hasta ? todayISO() : (c.fecha || todayISO()), tipo: 'fecha', requerido: true },
        { k: 'hasta', etiqueta: 'Hasta', valor: hasta || '', tipo: 'fecha' },
        { k: 'nota', etiqueta: 'Observación operativa', valor: '', tipo: 'texto', ayuda: 'Sin información médica.' }
      ],
      avisos: ['datos_minimos'],
      accion: { tipo: 'novedad' }
    };
  },

  /* -------------------------------------------------------------- REUNIÓN - */
  reunion(c) {
    const { n, t } = c;
    if (!/\b(reunion|reunirme|junta|videollamada|meet|zoom|cita con)\b/.test(n)) return null;
    const f = (c.fecha || addDays(todayISO(), 1)) + 'T' + (c.hora || '10:00');
    return {
      intencion: 'crear_reunion', espacio: c.area === 'universidad' ? 'universidad' : 'trabajo',
      resumen: 'Se crea el evento y aparece en Inicio y en la Agenda.' + (c.marca ? ' Queda asociado a ' + c.marca.nombre + '.' : ''),
      entidades: { marca: c.marca, fecha: c.fecha, hora: c.hora },
      campos: [
        { k: 'titulo', etiqueta: 'Título', valor: 'Reunión' + (c.marca ? ' con ' + c.marca.nombre : ''), tipo: 'texto', requerido: true },
        { k: 'brand_id', etiqueta: 'Marca', valor: c.marca ? c.marca.id : '', tipo: 'select', opciones: optsBrands() },
        { k: 'fecha', etiqueta: 'Fecha', valor: f.slice(0, 10), tipo: 'fecha', requerido: true },
        { k: 'hora', etiqueta: 'Hora', valor: fmtHora(f), tipo: 'hora', requerido: true },
        { k: 'duracion_min', etiqueta: 'Duración (min)', valor: String(NLU.duracionMin(t) || 60), tipo: 'numero' },
        { k: 'lugar', etiqueta: 'Lugar o enlace', valor: '', tipo: 'texto' },
        { k: 'objetivo', etiqueta: 'Objetivo', valor: '', tipo: 'texto' },
        { k: 'participantes', etiqueta: 'Participantes', valor: '', tipo: 'texto', ayuda: 'Separados por coma.' }
      ],
      faltantes: c.hora ? [] : ['hora'],
      accion: { tipo: 'crear', tabla: 'events' }
    };
  },

  /* ------------------------------------------------- RECORDATORIO / TAREA - */
  recordatorioOTarea(c) {
    const { n, t } = c;
    const esRecordatorio = /^(recuerdame|recordarme|avisame|no me dejes olvidar)/.test(n);
    const esNota = /^(anota|apunta|toma nota)\b/.test(n) && !/tarea/.test(n);
    const esperando = /esta esperando|quedo esperando|esperando respuesta|a la espera/.test(n);

    if (esNota && !esperando) {
      const contenido = t.replace(/^(anota|ap[uú]nta|apunta|toma nota)\s*(que|:)?\s*/i, '').trim();
      return {
        intencion: 'registrar_nota', espacio: c.area,
        resumen: 'Se guarda en Notas. Después puedes convertirla en tarea, evento o ficha sin perder el texto original.',
        entidades: { marca: c.marca, asignatura: c.asig },
        campos: [
          { k: 'titulo', etiqueta: 'Título', valor: contenido.slice(0, 70), tipo: 'texto', requerido: true },
          { k: 'contenido', etiqueta: 'Contenido', valor: contenido, tipo: 'textarea' },
          { k: 'area', etiqueta: 'Espacio', valor: c.area, tipo: 'select', opciones: optsArea() },
          { k: 'brand_id', etiqueta: 'Marca', valor: c.marca ? c.marca.id : '', tipo: 'select', opciones: optsBrands() },
          { k: 'subject_id', etiqueta: 'Asignatura', valor: c.asig ? c.asig.id : '', tipo: 'select', opciones: optsSubjects() }
        ],
        accion: { tipo: 'crear', tabla: 'notes' }
      };
    }

    /* Título limpio, sin las expresiones de fecha y hora ya interpretadas */
    let titulo = t.replace(/^(recu[eé]rdame|recordarme|recordar|av[ií]same|tengo que|debo|necesito|hay que|crea(r)?\s+(una\s+)?tarea(\s+urgente|\s+importante)?(\s+para)?|nueva tarea)\s*/i, '').trim();
    titulo = this.limpiarTitulo(titulo);
    titulo = titulo.charAt(0).toUpperCase() + titulo.slice(1);

    const prioridad = NLU.prioridad(t) || (c.fecha && diffDays(c.fecha, todayISO()) <= 1 ? 'alta' : 'media');
    const due = c.fecha ? c.fecha + 'T' + (c.hora || '18:00') : null;
    const lugar = NLU.lugarDesconocido(t);

    const p = {
      intencion: esRecordatorio ? 'crear_recordatorio' : 'crear_tarea',
      espacio: c.area,
      resumen: (esRecordatorio ? 'Se crea el recordatorio' : 'Se crea la tarea') + ' en el espacio ' + AREAS[c.area].label + '.' +
        (esperando ? ' Queda en estado «esperando respuesta», así no ensucia tus pendientes propios.' : ''),
      entidades: { marca: c.marca, asignatura: c.asig, persona: c.persona, tienda: c.tienda, fecha: c.fecha, hora: c.hora, prioridad },
      campos: [
        { k: 'titulo', etiqueta: 'Título', valor: titulo, tipo: 'texto', requerido: true },
        { k: 'area', etiqueta: 'Espacio', valor: c.area, tipo: 'select', opciones: optsArea() },
        { k: 'prioridad', etiqueta: 'Prioridad', valor: prioridad, tipo: 'select', opciones: optsPrio() },
        { k: 'estado', etiqueta: 'Estado', valor: esperando ? 'esperando' : 'pendiente', tipo: 'select', opciones: optsEstadoT() },
        { k: 'fecha', etiqueta: 'Vence el', valor: c.fecha || '', tipo: 'fecha' },
        { k: 'hora', etiqueta: 'Hora', valor: c.hora || (c.fecha ? '18:00' : ''), tipo: 'hora' },
        { k: 'brand_id', etiqueta: 'Marca', valor: c.marca ? c.marca.id : '', tipo: 'select', opciones: optsBrands() },
        { k: 'subject_id', etiqueta: 'Asignatura', valor: c.asig ? c.asig.id : '', tipo: 'select', opciones: optsSubjects() },
        { k: 'responsable', etiqueta: 'Responsable', valor: NLU.responsable(t) || 'Carlos', tipo: 'texto' },
        { k: 'descripcion', etiqueta: 'Descripción', valor: '', tipo: 'textarea' }
      ],
      accion: { tipo: 'crear', tabla: 'tasks', due_at: due }
    };

    /* Menciona un lugar que no está registrado: preguntamos en vez de inventar. */
    if (lugar && !c.tienda) {
      p.avisos = ['lugar_desconocido'];
      p.pregunta = {
        texto: 'No tengo ninguna tienda registrada en ' + lugar + '. ¿A cuál corresponde?',
        opciones: store.all('stores').slice(0, 6).map(s => ({ etiqueta: s.nombre + ' · ' + (s.ciudad || ''),
          texto: t.replace(new RegExp(lugar, 'i'), s.nombre) }))
          .concat([{ etiqueta: 'Dejar sin tienda', texto: t.replace(new RegExp('\\s*(de|en)\\s+' + lugar, 'i'), '') }])
      };
    }
    return p;
  },

  limpiarTitulo(s) {
    const hora = /\s*,?\s*(a\s+las?\s+[\wáéíóú]+([:.]\d{2})?\s*(hrs?|horas?)?(\s+de\s+la\s+(mañana|tarde|noche))?|\d{1,2}\s*hrs?)\s*$/i;
    const fecha = /\s*,?\s*(para\s+el\s+|para\s+|antes\s+del?\s+|hasta\s+el\s+|el\s+|este\s+|pr[oó]ximo\s+|la\s+pr[oó]xima\s+)?(hoy|ma[ñn]ana|pasado\s+ma[ñn]ana|lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo|fin de semana|semana|\d{1,2}\s+de\s+[a-zá-ú]+(\s+de\s+\d{4})?|\d{1,2}[\/\-]\d{1,2}([\/\-]\d{2,4})?|en\s+\w+\s+(d[ií]as?|semanas?|meses))\s*$/i;
    let out = s;
    for (let i = 0; i < 3; i++) out = out.replace(hora, '').replace(fecha, '').trim();
    return out.replace(/[\s,;:.]+$/, '').trim() || s;
  },

  /* ------------------------------------------------------------ Auxiliares - */
  faltaDato(intencion, campo, texto, espacio) {
    return { intencion, espacio: espacio || 'trabajo', requiereConfirmacion: false,
      titulo: INTENCIONES[intencion] ? INTENCIONES[intencion].label : 'Falta información',
      faltantes: [campo], pregunta: { texto }, respuesta: { texto } };
  },
  preguntaOpciones(intencion, texto, opciones, espacio, nota) {
    return { intencion, espacio: espacio || 'trabajo', requiereConfirmacion: false,
      titulo: INTENCIONES[intencion] ? INTENCIONES[intencion].label : 'Necesito un dato',
      pregunta: { texto, opciones: opciones.slice(0, 6) },
      respuesta: nota ? { texto, nota } : { texto } };
  }
};

/* ==========================================================================
   Ejecución de la acción confirmada
   Nada de esto ocurre sin que el usuario apriete «Confirmar».
   ========================================================================== */
const AsistenteAcciones = {
  ejecutar(p, v) {
    const val = (k, d) => (v && v[k] !== undefined && v[k] !== '' ? v[k] : d);
    const numero = (k, d) => { const x = Number(val(k, d)); return isNaN(x) ? d : x; };
    const fechaHora = (fk, hk, hDef) => {
      const f = val(fk, ''); if (!f) return null;
      return f + 'T' + (val(hk, hDef || '18:00') || hDef || '18:00');
    };
    let creado = null, mensaje = 'Listo', entidad = 'task', ruta = null;

    switch (p.intencion) {
      case 'crear_tarea':
      case 'crear_recordatorio': {
        creado = store.insert('tasks', {
          parent_id: null, area: val('area', 'trabajo'), titulo: val('titulo', 'Sin título'),
          descripcion: val('descripcion', ''), categoria: '', responsable: val('responsable', 'Carlos'),
          prioridad: val('prioridad', 'media'), estado: val('estado', 'pendiente'),
          due_at: fechaHora('fecha', 'hora', '18:00'),
          brand_id: val('brand_id', null) || null, subject_id: val('subject_id', null) || null,
          recurrencia: 'ninguna', checklist: [], enlaces: [], completed_at: null
        });
        if (p.intencion === 'crear_recordatorio' && creado.due_at) {
          Nube.crearRecordatorio('task', creado.id, creado.due_at, creado.titulo);
        }
        mensaje = p.intencion === 'crear_recordatorio' ? 'Recordatorio creado' : 'Tarea creada';
        ruta = '#/tareas'; entidad = 'task'; break;
      }
      case 'crear_reunion': {
        const inicio = fechaHora('fecha', 'hora', '10:00');
        creado = store.insert('events', {
          area: p.espacio === 'universidad' ? 'universidad' : 'trabajo', tipo: 'reunion',
          titulo: val('titulo', 'Reunión'), inicio, fin: inicio ? addMin(inicio, numero('duracion_min', 60)) : null,
          lugar: val('lugar', ''), enlace: '', objetivo: val('objetivo', ''), notas: '',
          participantes: String(val('participantes', '')).split(',').map(s => s.trim()).filter(Boolean).map(n2 => ({ nombre: n2, rol: '' })),
          brand_id: val('brand_id', null) || null, subject_id: null, recordatorio_min: 30, estado: 'programado'
        });
        mensaje = 'Reunión agendada'; ruta = '#/agenda'; entidad = 'meeting'; break;
      }
      case 'crear_evaluacion': {
        creado = store.insert('evaluations', {
          subject_id: val('subject_id', null), titulo: val('titulo', 'Evaluación'), tipo: val('tipo', 'prueba'),
          fecha: val('fecha', null), hora: val('hora', '18:30'), ponderacion: numero('ponderacion', 25),
          nota: null, temario: val('temario', ''), estado: 'pendiente'
        });
        if (creado.fecha) {
          store.insert('events', { area: 'universidad', tipo: 'evaluacion', titulo: creado.titulo,
            inicio: creado.fecha + 'T' + (creado.hora || '18:30'), fin: null, subject_id: creado.subject_id,
            brand_id: null, lugar: '', enlace: '', objetivo: creado.temario || '', notas: '',
            participantes: [], recordatorio_min: 60, estado: 'programado' });
        }
        mensaje = 'Evaluación registrada'; ruta = '#/universidad'; entidad = 'assessment'; break;
      }
      case 'crear_sesion_estudio': {
        creado = store.insert('study_sessions', {
          plan_id: null, subject_id: val('subject_id', null) || null, unit_id: null,
          titulo: val('titulo', 'Sesión de estudio'), fecha: val('fecha', todayISO()), hora: val('hora', '20:30'),
          duracion_min: numero('duracion_min', 60), tipo: val('tipo', 'estudio'), estado: 'pendiente',
          minutos_efectivos: 0, notas: ''
        });
        mensaje = 'Sesión de estudio creada'; ruta = '#/estudio'; entidad = 'study_session'; break;
      }
      case 'registrar_nota': {
        creado = store.insert('notes', {
          area: val('area', 'trabajo'), tipo: val('area', 'trabajo') === 'universidad' ? 'apunte' : 'nota',
          titulo: val('titulo', 'Nota'), contenido: val('contenido', ''), etiquetas: [],
          brand_id: val('brand_id', null) || null, subject_id: val('subject_id', null) || null,
          unit_id: null, tema: '', fijada: false
        });
        mensaje = 'Nota guardada'; ruta = '#/notas'; entidad = 'note'; break;
      }
      case 'registrar_apunte_juridico': {
        if (p.accion.apunte) {
          creado = store.insert('notes', {
            area: 'universidad', tipo: 'apunte', titulo: val('titulo', 'Apunte'), contenido: val('contenido', ''),
            etiquetas: [], brand_id: null, subject_id: val('subject_id', null) || null, unit_id: null,
            tema: val('tema', ''), fijada: false
          });
          entidad = 'legal_note'; mensaje = 'Apunte guardado sin modificar tu texto'; ruta = '#/notas';
        } else {
          creado = store.insert('glossary', {
            subject_id: val('subject_id', null) || null, termino: val('termino', 'Concepto'),
            definicion: val('definicion', ''), fuente: val('fuente', 'Apunte propio'),
            verificado: false, etiquetas: []
          });
          entidad = 'legal_concept'; mensaje = 'Concepto guardado (sin verificar)'; ruta = '#/universidad';
        }
        break;
      }
      case 'registrar_lectura': {
        creado = store.insert('readings', {
          subject_id: val('subject_id', null) || null, titulo: val('titulo', 'Lectura'), autor: '',
          paginas_total: numero('paginas_total', 0), paginas_leidas: 0,
          fecha_limite: val('fecha_limite', null), prioridad: val('prioridad', 'alta'), enlace: ''
        });
        if (val('crear_tarea', '')) {
          store.insert('tasks', { parent_id: null, area: 'universidad',
            titulo: 'Leer ' + creado.paginas_total + ' páginas: ' + creado.titulo, descripcion: '',
            categoria: 'Lectura', responsable: 'Carlos', prioridad: creado.prioridad, estado: 'pendiente',
            due_at: creado.fecha_limite ? creado.fecha_limite + 'T22:00' : null, brand_id: null,
            subject_id: creado.subject_id, recurrencia: 'ninguna', checklist: [], enlaces: [], completed_at: null });
        }
        mensaje = 'Lectura registrada'; ruta = '#/universidad'; entidad = 'reading'; break;
      }
      case 'registrar_calificacion': {
        const id = val('evaluation_id', null);
        const nota = numero('nota', null);
        store.update('evaluations', id, { nota, estado: 'calificada' });
        creado = store.get('evaluations', id);
        const s = Q.subject(creado.subject_id);
        const pr = Q.promedio(creado.subject_id), nn = Q.notaNecesaria(creado.subject_id);
        mensaje = 'Nota ' + fmtNum(nota) + ' registrada · promedio de ' + (s ? s.nombre : '') + ': ' +
          (pr.promedio ? fmtNum(pr.promedio) : '—') + (nn != null ? ' · necesitas ' + fmtNum(nn) : '');
        ruta = '#/asignatura/' + creado.subject_id; entidad = 'assessment'; break;
      }
      case 'registrar_fuente_juridica': {
        creado = store.insert('legal_sources', {
          subject_id: val('subject_id', null) || null, tipo: val('tipo', 'sentencia'),
          identificador: val('identificador', 'Por identificar'), titulo: '', tribunal: val('tribunal', ''),
          rol: val('rol', ''), fecha: val('fecha', null), materia: '', enlace: val('enlace', ''),
          resumen: val('resumen', ''), verificado: false
        });
        mensaje = 'Fuente registrada como NO verificada'; ruta = '#/universidad'; entidad = 'legal_source'; break;
      }
      case 'crear_ficha_caso': {
        creado = store.insert('cases', {
          subject_id: val('subject_id', null) || null, titulo: val('titulo', 'Caso'),
          hechos: val('hechos', ''), problema: val('problema', ''), normas: val('normas', ''),
          argumentos: '', conclusion: val('conclusion', ''), estado: 'borrador'
        });
        mensaje = 'Ficha de caso creada'; ruta = '#/universidad'; entidad = 'case_brief'; break;
      }
      case 'registrar_novedad_persona': {
        const pid = val('person_id', null);
        creado = store.insert('person_events', {
          person_id: pid, tipo: val('tipo', 'licencia'), desde: val('desde', todayISO()),
          hasta: val('hasta', null) || null, nota: val('nota', '')
        });
        const mapa = { licencia: 'licencia', vacaciones: 'vacaciones', reemplazo: 'reemplazo', renuncia: 'renuncia',
          ingreso: 'activo', capacitacion: 'activo', amonestacion: 'activo' };
        store.update('people', pid, { estado: mapa[creado.tipo] || 'activo' });
        const per = store.get('people', pid);
        mensaje = 'Novedad registrada para ' + (per ? per.nombre : 'la persona');
        ruta = per && per.brand_id ? '#/marca/' + per.brand_id : '#/trabajo'; entidad = 'person'; break;
      }
      case 'crear_plan_estudio': {
        const d = p.accion.datos;
        const plan = Planificador.generar({
          subject_id: d.subject_id, evaluation_id: d.evaluation_id, nombre: d.nombre,
          fecha_objetivo: val('fecha_objetivo', null), unidades: d.unidadesIds,
          horas_semana: numero('horas_semana', 6)
        });
        creado = plan;
        const n2 = store.where('study_sessions', s => s.plan_id === plan.id).length;
        mensaje = 'Plan creado con ' + n2 + ' sesión(es)'; ruta = '#/estudio'; entidad = 'study_plan'; break;
      }
      case 'generar_preguntas': {
        const cards = p.accion.datos.cards.slice(0, Number(val('cantidad', p.accion.datos.cards.length)) || p.accion.datos.cards.length);
        cards.forEach(c => store.insert('flashcards', {
          subject_id: c.subject_id, unit_id: null, pregunta: c.pregunta, respuesta: c.respuesta,
          tipo: 'ficha', opciones: [], dominio: 'no_estudiado', aciertos: 0, fallos: 0,
          intervalo_dias: 1, proxima_revision: todayISO()
        }));
        creado = { id: 'lote' }; mensaje = cards.length + ' ficha(s) creada(s) desde tu propio material';
        ruta = '#/estudio'; entidad = 'flashcard'; break;
      }
      default:
        return { ok: false, mensaje: 'Esa acción todavía no se puede ejecutar.' };
    }

    if (creado && creado.id && creado.id !== 'lote') {
      Nube.registrarActividad(entidad, creado.id, 'create', mensaje + ' · desde el asistente');
    }
    return { ok: true, mensaje, ruta, creado };
  },

  /** Guarda un mensaje redactado como plantilla reutilizable. */
  guardarPlantilla(plantilla) {
    const t = store.insert('notes', {
      area: 'trabajo', tipo: 'nota', titulo: plantilla.titulo, contenido: plantilla.cuerpo,
      etiquetas: ['plantilla', plantilla.tono], brand_id: null, subject_id: null, unit_id: null,
      tema: 'Mensaje ' + plantilla.dest, fijada: false
    });
    Nube.registrarActividad('note', t.id, 'create', 'Plantilla de mensaje guardada');
    return t;
  }
};

/* ==========================================================================
   Capa de IA — preparada, nunca con claves en el navegador
   --------------------------------------------------------------------------
   El frontend solo llama a la Edge Function `nexo-ai` de Supabase, que corre
   en el servidor con la API key guardada como secreto. Si no está desplegada,
   el asistente sigue funcionando con reglas.
   ========================================================================== */
const AsistenteIA = {
  disponible() { return !!(Nube.conectado && DB.profile.ia_activada); },

  /** Contexto mínimo y sin datos sensibles: solo nombres para desambiguar. */
  contexto() {
    return {
      hoy: todayISO(), ahora: nowNaive(), zona: TZ,
      marcas: store.all('brands').map(b => ({ id: b.id, nombre: b.nombre })),
      asignaturas: store.all('subjects').map(s => ({ id: s.id, nombre: s.nombre })),
      personas: store.all('people').map(p => ({ id: p.id, nombre: p.nombre })),
      tiendas: store.all('stores').map(s => ({ id: s.id, nombre: s.nombre, ciudad: s.ciudad })),
      intenciones: Object.keys(INTENCIONES)
    };
  },

  async interpretar(texto) {
    const { data, error } = await Nube.client.functions.invoke('nexo-ai', {
      body: { texto, contexto: this.contexto(), version: Asistente.version }
    });
    if (error) throw error;
    if (!data || !data.intencion) throw new Error('Respuesta sin intención');
    return data;
  }
};

/* ------------------------------ Flujo del chat ---------------------------- */
async function enviarChat(texto) {
  const t = (texto || '').trim();
  if (!t) return;
  UI.chat = UI.chat || [];
  UI.chat.push({ rol: 'yo', txt: t });
  UI.propuesta = null; UI.propEditando = false; UI.pensando = true;
  render();

  const p = await Asistente.interpretar(t, { usarIA: AsistenteIA.disponible() });
  UI.pensando = false;

  if (p.requiereConfirmacion && p.intencion) {
    UI.propuesta = p;
    if (p.pregunta) UI.chat.push({ rol: 'nexo', tipo: 'pregunta', propuesta: p });
  } else if (p.pregunta) {
    UI.chat.push({ rol: 'nexo', tipo: 'pregunta', propuesta: p });
    guardarHistorial(t, 'Pregunta pendiente');
  } else {
    UI.chat.push({ rol: 'nexo', tipo: 'respuesta', titulo: p.titulo, respuesta: p.respuesta || { texto: 'Listo' } });
    guardarHistorial(t, p.titulo);
  }
  render();
  setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 60);
}

/** Lee los valores editados de la tarjeta (si está en modo edición). */
function valoresPropuesta(p) {
  const v = {};
  p.campos.forEach(f => {
    const el = document.getElementById('pc_' + f.k);
    if (!el) { v[f.k] = f.valor; return; }
    v[f.k] = f.tipo === 'check' ? (el.checked ? '1' : '') : el.value;
  });
  return v;
}

function confirmarPropuesta() {
  const p = UI.propuesta;
  if (!p) return;
  const v = valoresPropuesta(p);
  const faltan = p.campos.filter(f => f.requerido && !String(v[f.k] || '').trim()).map(f => f.etiqueta);
  if (faltan.length) {
    UI.propEditando = true; render();
    return toast('Falta completar: ' + faltan.join(', '), 'warn');
  }
  let r;
  try { r = AsistenteAcciones.ejecutar(p, v); }
  catch (e) { console.error(e); r = { ok: false, mensaje: 'No se pudo guardar: ' + e.message }; }

  UI.chat.push({ rol: 'nexo', tipo: 'resultado', estado: r.ok ? 'ok' : 'no', txt: r.mensaje, ruta: r.ruta });
  guardarHistorial(p.textoOriginal || '', r.mensaje);
  UI.propuesta = null; UI.propEditando = false;
  toast(r.mensaje, r.ok ? 'exito' : 'error');
  render();
}

/* ==========================================================================
   13. VISTA: TAREAS
   ========================================================================== */
function filtrarTareas() {
  const f = UI.filtros;
  let l = Q.tareas({});
  if (f.estado) l = l.filter(t => t.estado === f.estado); else l = l.filter(t => t.estado !== 'completada' || f.fecha === 'completadas');
  if (f.prioridad) l = l.filter(t => t.prioridad === f.prioridad);
  if (f.brand) l = l.filter(t => t.brand_id === f.brand);
  if (f.subject) l = l.filter(t => t.subject_id === f.subject);
  if (f.q) { const q = slug(f.q); l = l.filter(t => slug(t.titulo + ' ' + (t.descripcion || '') + ' ' + (t.categoria || '')).includes(q)); }
  if (f.fecha === 'hoy') l = l.filter(Q.paraHoy);
  else if (f.fecha === 'vencidas') l = l.filter(Q.vencida);
  else if (f.fecha === 'semana') l = l.filter(t => t.due_at && diffDays(String(t.due_at).slice(0, 10), todayISO()) >= 0 && diffDays(String(t.due_at).slice(0, 10), todayISO()) <= 7);
  else if (f.fecha === 'sinfecha') l = l.filter(t => !t.due_at);
  else if (f.fecha === 'completadas') l = l.filter(t => t.estado === 'completada');
  return l.sort((a, b) => Q.score(b) - Q.score(a));
}

function selectFiltro(k, label, opts, val) {
  const activo = !!val;
  return '<select data-act="filtro" data-k="' + k + '" aria-label="' + esc(label) + '" class="text-[12px] font-medium rounded-lg border px-2.5 py-1.5 focus-ring transition-colors ' +
    (activo ? 'acc-border acc-soft acc-text' : 'border-ink-200 dark:border-ink-800 bg-ink-50 dark:bg-ink-850 text-ink-600 dark:text-ink-300') + '">' +
    opts.map(o => '<option value="' + esc(o.v) + '"' + (String(o.v) === String(val) ? ' selected' : '') + '>' + esc(o.l) + '</option>').join('') + '</select>';
}

Vistas.tareas = function () {

  } else {

/* Calendario mensual reutilizable */
function calendarioMes(items, campoFecha, extraPorDia) {
  const base = UI.mes || todayISO().slice(0, 7);
  const [y, m] = base.split('-').map(Number);
  const primero = new Date(Date.UTC(y, m - 1, 1));
  const diasMes = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const offset = (primero.getUTCDay() + 6) % 7; // lunes primero
  const celdas = [];
  for (let i = 0; i < offset; i++) celdas.push(null);
  for (let d = 1; d <= diasMes; d++) celdas.push(base + '-' + String(d).padStart(2, '0'));
  while (celdas.length % 7) celdas.push(null);

  return '<div class="card bg-[var(--surface)] shadow-sm border border-ink-200 dark:border-ink-800 p-3">' +
    '<div class="flex items-center justify-between mb-3 px-1">' +
      '<button data-act="mes" data-v="-1" class="focus-ring w-8 h-8 rounded-lg hover:bg-ink-100 dark:hover:bg-ink-850">‹</button>' +
      '<p class="font-semibold text-sm capitalize">' + MESES[m - 1] + ' ' + y + '</p>' +
      '<button data-act="mes" data-v="1" class="focus-ring w-8 h-8 rounded-lg hover:bg-ink-100 dark:hover:bg-ink-850">›</button>' +
    '</div>' +
    '<div class="grid grid-cols-7 gap-1 text-center text-[10px] uppercase text-ink-400 mb-1">' +
      ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d => '<div>' + d + '</div>').join('') + '</div>' +
    '<div class="grid grid-cols-7 gap-1">' + celdas.map(f => {
      if (!f) return '<div class="min-h-[68px] rounded-lg"></div>';
      const delDia = items.filter(i => String(i[campoFecha] || '').slice(0, 10) === f);
      const hoy = f === todayISO();
      return '<div class="min-h-[68px] rounded-lg p-1 ' + (hoy ? 'ring-2 ring-[var(--acc)] acc-soft' : 'bg-ink-50 dark:bg-ink-850/60') + '">' +
        '<p class="text-[10px] font-semibold ' + (hoy ? 'text-petrol-600 dark:text-petrol-300' : 'text-ink-400') + '">' + Number(f.slice(-2)) + '</p>' +
        delDia.slice(0, 3).map(i => '<div data-act="' + (i.due_at !== undefined ? 'ver-tarea' : 'ver-evento') + '" data-id="' + i.id + '" class="mt-0.5 text-[10px] leading-tight px-1 py-0.5 rounded truncate ' +
          (AREAS[i.area]?.bg || '') + ' ' + (AREAS[i.area]?.txt || '') + '" title="' + esc(i.titulo) + '">' + esc(i.titulo) + '</div>').join('') +
        (delDia.length > 3 ? '<p class="text-[9px] text-ink-400 mt-0.5">+' + (delDia.length - 3) + '</p>' : '') +
        (extraPorDia ? extraPorDia(f) : '') +
      '</div>';
    }).join('') + '</div></div>';
}
